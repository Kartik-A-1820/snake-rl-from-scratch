# Summary

We trained a one-step Q-learning agent (Watkins, 1989; Watkins & Dayan, 1992) to play 12×12 Snake. Its state is 11 binary features: danger ahead/right/left, heading, and food direction. The Q-table has 2048 rows, but only 256 can ever occur.

Over the first 100 epochs (1 epoch = 100 episodes), the greedy score on 500 held-out seeds rose from 0.04 to 20.0. After that it plateaued at 19–22 across three training seeds. That is the same level as a ten-line hand-written heuristic (20.4). The agent never filled the board on 12×12. On 6×6 it won once in 13,500 evaluation games.

The algorithm worked. The *state* is the bottleneck: about 90% of deaths are self-collisions, and nothing in the 11 features can describe free space beyond the next cell. This note derives the theory behind every line of the training loop, shows where each assumption holds or breaks for Snake, and uses the failure to motivate tryout 02.

```widget

```

# 1. Snake as a Markov decision process

A finite MDP is a tuple $(\mathcal{S}, \mathcal{A}, P, R, \gamma)$:

- $\mathcal{S}$ is the set of states.
- $\mathcal{A}$ is the set of actions.
- $P(s' \mid s, a)$ gives the transition probabilities.
- $R(s, a, s')$ is the reward.
- $\gamma \in [0, 1)$ is the discount factor (Puterman, 1994; Sutton & Barto, 2018, ch. 3).

The **Markov property** requires that the next state and reward depend only on the current state and action:

$$
\Pr(S_{t+1}=s', R_{t+1}=r \mid S_t, A_t, S_{t-1}, A_{t-1}, \dots) = \Pr(S_{t+1}=s', R_{t+1}=r \mid S_t, A_t).
$$

**The true Snake state** is the ordered body (a path of cells), the heading, the food cell, and the step counter used for timeouts. With the body as a self-avoiding path on a 12×12 grid, the number of states is astronomically large, far beyond any table. Food placement is the only source of randomness: after eating, the next food cell is drawn uniformly from the free cells by a seeded mulberry32 generator. That makes $P$ stochastic, but every episode is exactly reproducible from its seed.

**Actions** are relative: $\mathcal{A} = \{\text{straight}, \text{right}, \text{left}\}$. Relative actions remove the illegal 180° reversal by construction. They also make the policy symmetric under rotation, so "turn toward the food" means the same thing whichever way the snake faces.

**Rewards:** $+1$ for eating, $-1$ for dying, and $0$ otherwise. Rewards are deliberately sparse and sign-coded. Any shaping (§6) is an experiment, not a default.

**Episodes end in two different ways**, and the difference matters for learning:

- **Termination**: hitting a wall or the body, or filling the board. The episode ends because the MDP really ended. The value of the next state is $0$.
- **Truncation**: going $100 \times \text{length}$ steps without eating. The *environment* didn't end; we stopped watching. Treating truncation as termination teaches the agent that circling is fatal, when it is merely boring. That mis-specifies the value function (Pardo et al., 2018).

The engine reports them separately (`terminated`, `truncated`), as in Gymnasium. The update bootstraps through truncation.

```quiz
Q: A looping agent is cut off by the 100×length timeout. What target should the last transition use?
- [ ] r + 0, because the episode is over
- [x] r + γ·max_a Q(s', a), because the state was not terminal
- [ ] −1, to punish looping
Why: Truncation is a property of our training loop, not of the MDP. Using r + 0 would encode "this state has value 0", which is false and biases Q downward near loops (Pardo et al., 2018). If looping is undesirable, that belongs in the reward or the time limit, stated explicitly.
```

# 2. Returns, value functions and Bellman equations

The **return** from time $t$ is the discounted sum of future rewards:

$$
G_t = \sum_{k=0}^{\infty} \gamma^k R_{t+k+1} = R_{t+1} + \gamma G_{t+1}.
$$

The recursion on the right is the whole trick of dynamic programming.

For a policy $\pi(a \mid s)$, the **state-value** and **action-value** functions are

$$
v_\pi(s) = \mathbb{E}_\pi[G_t \mid S_t = s], \qquad q_\pi(s,a) = \mathbb{E}_\pi[G_t \mid S_t = s, A_t = a].
$$

**Bellman expectation equation.** Substitute $G_t = R_{t+1} + \gamma G_{t+1}$ and use the Markov property, which lets $\mathbb{E}[G_{t+1} \mid S_{t+1}=s']$ be written as $v_\pi(s')$:

$$
\begin{aligned}
q_\pi(s,a) &= \mathbb{E}[R_{t+1} + \gamma G_{t+1} \mid S_t=s, A_t=a] \\
&= \sum_{s'} P(s' \mid s,a)\Big[R(s,a,s') + \gamma \sum_{a'} \pi(a' \mid s')\, q_\pi(s',a')\Big].
\end{aligned}
$$

**Bellman optimality equation.** An optimal policy acts greedily with respect to its own values, so the inner average over $a'$ becomes a maximum:

$$
q_*(s,a) = \sum_{s'} P(s' \mid s,a)\Big[R(s,a,s') + \gamma \max_{a'} q_*(s',a')\Big].
$$

**Why a solution exists and is unique.** Define the Bellman optimality operator

$$
(\mathcal{T}q)(s,a) = \sum_{s'} P(s' \mid s,a)\big[R + \gamma \max_{a'} q(s',a')\big].
$$

For any two Q-functions $q_1$ and $q_2$:

$$
|(\mathcal{T}q_1)(s,a) - (\mathcal{T}q_2)(s,a)| \le \gamma \sum_{s'} P(s' \mid s,a)\, \big|\max_{a'} q_1(s',a') - \max_{a'} q_2(s',a')\big| \le \gamma\, \|q_1 - q_2\|_\infty .
$$

This uses $|\max f - \max g| \le \max|f-g|$. So $\mathcal{T}$ is a $\gamma$-contraction in the sup norm. By Banach's fixed-point theorem it has a unique fixed point $q_*$, and iterating $q_{k+1} = \mathcal{T}q_k$ (value iteration) converges to it geometrically:

$$
\|q_k - q_*\|_\infty \le \gamma^k \|q_0 - q_*\|_\infty .
$$

Q-learning is a *sampled*, *asynchronous* version of this iteration.

```widget
gamma_horizon
```

**Reading γ for Snake.** The **effective horizon** is about $1/(1-\gamma)$ steps: 20 steps at $\gamma=0.95$ and 100 at $0.99$.

- On a 12×12 board the nearest food is typically 5–15 steps away, so $\gamma=0.95$ "sees" the next apple.
- Avoiding a self-trap can require planning dozens of steps ahead, around the whole body. A short horizon is one reason a myopic agent coils into dead ends.
- A long horizon does not help when the state can't represent the trap (§5), which the γ sweep below confirms.

# 3. From dynamic programming to temporal-difference learning

We don't know $P$. **Monte Carlo** methods estimate $q_\pi(s,a)$ by averaging complete returns. That is unbiased, but the variance is high and you must wait until the episode ends.

**Temporal-difference (TD)** methods (Sutton, 1988) replace the unknown expectation with one sampled transition and *bootstrap* from the current estimate.

The **Q-learning** update for a transition $(s, a, r, s')$ is

$$
Q(s,a) \leftarrow Q(s,a) + \alpha \,\underbrace{\big[\, r + \gamma \max_{a'} Q(s',a') - Q(s,a) \,\big]}_{\delta \;=\; \text{TD error}} ,
$$

with $\max_{a'} Q(s', a') := 0$ when $s'$ is terminal.

- The bracketed quantity is a sample of $(\mathcal{T}Q)(s,a) - Q(s,a)$.
- Its expectation over $s'$ is exactly the Bellman residual.
- The update is a stochastic-approximation step toward the fixed point of $\mathcal{T}$.

**Q-learning is off-policy.** The target uses $\max_{a'}$, the greedy action, whatever action the behaviour policy takes next. So we can explore with $\varepsilon$-greedy and still learn about the greedy policy. SARSA uses the action actually taken next and learns the value of the exploring policy instead.

**Convergence** (Watkins & Dayan, 1992; Jaakkola, Jordan & Singh, 1994; Tsitsiklis, 1994). Tabular Q-learning converges to $q_*$ with probability 1 if:

1. the process is a finite MDP;
2. every $(s,a)$ pair is updated infinitely often;
3. the step sizes satisfy the Robbins–Monro conditions $\sum_t \alpha_t(s,a) = \infty$ and $\sum_t \alpha_t^2(s,a) < \infty$;
4. rewards are bounded.

Our run breaks two of these on purpose:

- **Constant α = 0.1.** This violates $\sum \alpha^2 < \infty$. The table never settles; it tracks recent experience. That is useful if the environment changes, but it shows up as checkpoint-to-checkpoint jitter (§8).
- **The process we learn on is not an MDP** in the feature space (§5). The guarantee simply doesn't apply.

```widget
q_update
```

```quiz
Q: In the update, why is the target r + γ·max Q(s',·) and not r + γ·Q(s', a_next), where a_next is the ε-greedy action actually taken?
- [ ] It is cheaper to compute
- [x] max makes the target the greedy (optimal) policy's value, so learning is off-policy
- [ ] a_next is not known yet
Why: Using the action actually taken gives SARSA, which learns q for the ε-greedy behaviour policy itself. Q-learning's max learns q* while behaving exploratorily. The cost of that is maximisation bias with noisy estimates, which Double Q-learning fixes (van Hasselt, 2010).
```

# 4. Exploration

**ε-greedy** takes a uniformly random action with probability $\varepsilon$ and otherwise the greedy one. With $\varepsilon$ decaying to 0 and all pairs visited infinitely often (GLIE: greedy in the limit with infinite exploration), the behaviour policy itself becomes optimal (Singh et al., 2000).

We decay linearly from $1.0$ to $0.01$ over the first 50% of episodes, then hold at $0.01$.

```widget
epsilon_schedule
```

Exploration costs the most in Snake when the snake is long. A single random turn next to the body is fatal. That is why the *training* score at $\varepsilon = 0.01$ (18.2) stays below the greedy *evaluation* score (20.1), and why the training curve is a poor measure of policy quality. **Always evaluate greedily, on held-out seeds.**

# 5. The state we actually learn on, and why it limits everything

The agent never sees the true state. It sees an 11-bit observation $o = \phi(s)$:

| Bits | Meaning |
|---|---|
| 0–2 | danger if moving straight / right / left (wall or body, tail excluded because it moves) |
| 3–6 | heading one-hot (R, D, L, U) |
| 7–10 | food is left / right / up / down of the head |

**Only 256 rows of the 2048 can occur.** Heading is one-hot, so 4 of the 16 patterns are possible. Food direction has 8 valid combinations: at most one of left/right and one of up/down is set, and the food is never under the head. Danger has 8. So $8 \times 4 \times 8 = 256$. The agent visited exactly 256 rows by epoch 125, which is a nice sanity check that exploration covered the reachable table.

**State aliasing.** Many true states map to the same observation. "Body ahead-left, food up-right" looks identical whether the free region on the right is 100 cells or 2 cells. The second case is a death trap, but the observation can't say so. Formally the agent faces a **partially observable MDP** (POMDP; Kaelbling, Littman & Cassandra, 1998).

Q-learning on observations treats $o$ as if it were Markov, and that has known consequences (Singh, Jaakkola & Jordan, 1994):

- the best *memoryless deterministic* policy can be arbitrarily worse than the optimal one;
- Q-learning need not converge to it;
- values can chatter as the mix of underlying states behind each $o$ shifts with the policy.

```widget
aliasing
```

That is the root cause of the plateau. With this observation, a near-optimal memoryless policy *is* "go toward the food unless the next cell is deadly". The learned table agrees with exactly that heuristic on **87.6%** of the states the heuristic visits, and scores the same (20.1 vs 20.4).

The same property has an upside. The features are size-invariant, so the 12×12 table plays other board sizes unchanged:

| Board | 10×10 | 16×16 | 20×20 |
|---|---:|---:|---:|
| Q-table | 18.4 | 25.4 | 29.7 |
| Heuristic | 17.9 | 24.5 | 28.0 |

(300 seeds each.)

```quiz
Q: The agent has visited all 256 reachable rows, ε is 0.01, and it has trained for another 10,000 episodes. Will more training eventually stop self-collisions?
- [ ] Yes, Q-learning converges to the optimal policy given enough data
- [x] No: the information needed (free space beyond one cell) is not in the observation
- [ ] Only if α is decayed
Why: Convergence theorems are about the MDP whose state you observe. Two situations that need opposite actions share one table row, so no table entry can be right for both. Decaying α would only freeze the compromise. The fix is a richer state: reachable-area features or the raw grid fed to a CNN (tryout 02).
```

# 6. Reward design and shaping

The reward defines the task. Anything you add changes the task unless it has a special form.

**Ng, Harada & Russell (1999)** proved that potential-based shaping, of the form

$$
F(s, s') = \gamma\,\Phi(s') - \Phi(s),
$$

leaves the optimal policy unchanged for *any* potential $\Phi$. The reason is that the shaping terms telescope inside the return:

$$
\sum_{k} \gamma^k F(S_{t+k}, S_{t+k+1}) = -\Phi(S_t) + \lim_{K\to\infty}\gamma^K \Phi(S_{t+K}) = -\Phi(S_t).
$$

So every action's value shifts by the same state-dependent constant.

An ad-hoc "+0.1 for moving closer to food, −0.1 for moving away" is *almost* this with $\Phi = -\text{distance}$. But without the $\gamma$ on $\Phi(s')$ and the $\Phi(\text{terminal}) = 0$ convention, it rewards back-and-forth oscillation, a classic case of specification gaming (Krakovna et al., 2020).

The Python environment offers `shaping="potential"` with $\Phi(s) = -\|\text{head}-\text{food}\|_1 / 2n$. Tryout 01 used **no shaping**: the ±1 reward is dense enough here, and adding shaping would confound the representation finding.

# 7. How the theory maps to the code

`tools/train_tabular.js` (Node) runs the same engine as the browser game, line for line:

| Theory | Code |
|---|---|
| $o = \phi(s)$, 11 bits → table row | `S.basicStateIndex(g)` packs `basicFeatures` into an integer 0–2047 |
| $\varepsilon$-greedy behaviour | `rng.nextU32()/2**32 < eps ? rng.int(3) : argmax(q[s])` |
| terminal ⇒ no bootstrap | `r.terminated ? 0 : gamma * Math.max(...q[s2])` |
| truncation ⇒ bootstrap | timeouts return `terminated:false, truncated:true`, so the `max` term stays |
| TD update with step size α | `q[s][a] += alpha * (target - q[s][a])` |
| greedy evaluation, held-out | `S.evaluate(greedy, {seeds: 100000…100499})` at every checkpoint |
| reproducibility | engine RNG (mulberry32) seeded per run; the same seed gives the identical run (verified: 2,173,663 steps twice) |

**Experimental protocol.**

- One epoch is 100 episodes. We checkpoint every 25 epochs, so there are 8 checkpoints in 200 epochs (20,000 episodes, about 2.2 M environment steps, about 2 s of CPU).
- Hyperparameters: α = 0.1, γ = 0.95, ε from 1.0 to 0.01 over the first 100 epochs.
- Every checkpoint evaluates the greedy policy on the same 500 held-out seeds, so checkpoints are directly comparable.
- Three training seeds on 12×12 and three on 6×6.
- Baselines on the same 500 seeds: random play scores 0.17; the greedy heuristic scores 20.4.

```widget

**12×12, seed 1:**

- Eval mean goes 0.04 → 6.67 → 12.51 → 18.09 → 20.03 by epoch 100, the point where ε reaches its floor.
- After that the checkpoints read 19.16, 19.75, 21.68 and 20.08.
- Wins: 0 in 20,000 training episodes and 4,500 evaluation games.

Watch the trained table play any of the held-out evaluation seeds. The heatmap colours every free cell by $\max_a Q$, as if the head were standing there with the current heading. Notice that the colours depend only on the 3-cell neighbourhood and the food direction, never on how much room is left.

```widget
replay
```

**Is the late jitter meaningful?** The spread of eval scores is about 6.3. That is estimated from the percentiles: p10 = 12 and p90 = 28, and for a roughly normal distribution $\sigma \approx (p_{90}-p_{10})/2.56$. With 500 games, the standard error of the mean is about $6.3/\sqrt{500} \approx 0.28$.

Swings of ±1.6 are therefore larger than sampling noise. They are *real* changes in the greedy policy, caused by the constant step size continually rewriting the table (§3), not measurement noise. Across three seeds the final means are 20.1, 21.3 and 20.1. Report the band, not the best checkpoint (Henderson et al., 2018; Agarwal et al., 2021).

**6×6 (win = score 33).** The plateau is at about 13. Across all seeds the run produced a handful of wins during training and **1 evaluation win in 13,500 games**. Those wins happen when food happens to land conveniently, not from planning.

```widget
sweep_heatmap
```

**γ and α sweep** (10k episodes, 3 seeds × 300 evaluation games per cell):

- Every setting with γ ≤ 0.95 and α ≤ 0.1 lands at 19–23.
- γ = 0.99 is *worse* and much less stable (seed spread 10–24 at α = 0.3). A longer horizon can't help when the trap isn't observable. It only propagates noisy, aliased values further.
- Large α amplifies the chattering predicted for aliased states.

# 9. Failure analysis

1. **Self-trapping (~90% of deaths).** Root cause: there is no information about free space beyond one cell. *Fix:* add reachable-area features per action (flood fill), or give a CNN the whole grid.
2. **Early loops (epoch 25: 21% of games timed out).** Unvisited rows hold ties at 0. `argmax` breaks ties toward "straight", and some feature patterns lead to cycles. This disappears once the table fills. *Lesson:* tie-breaking and the time limit are part of the algorithm.
3. **Wall deaths still 8–12%.** These come mostly from forced situations where all three moves are blocked, plus aliasing: a row learned mostly from safe cases occasionally fires in an unsafe one.
4. **No convergence, by construction.** Constant α plus a non-Markov observation gives a policy that keeps moving. If a stable artefact is needed, decay α, or keep the best checkpoint *by evaluation on separate validation seeds*, never by test-set score.
5. **Not a GPU problem.** The table has 2048×3 floats (24 KB dense, 8 KB as sparse JSON). Training takes 2 seconds on one CPU core. PyTorch would add overhead and nothing else, which is why this tryout uses none.

# 10. What this sets up

- The algorithm was never the bottleneck; the observation was. Tryout 02 keeps Q-learning but:
  1. feeds the **whole grid** (body recency, head, food, walls) to a small CNN, so the Q-function can see traps;
  2. replaces the table with a neural network, which needs **experience replay** and a **target network** to stay stable (Mnih et al., 2015).
- Expect sample efficiency to *drop*. The table needs about 2 M steps; a CNN DQN typically needs tens of millions. That is where vectorised environments on the GPU earn their keep.

Q: Why is the effective number of table rows 256, not 2048?
- [ ] Exploration did not reach the rest
- [x] One-hot heading (4 of 16) × valid food directions (8) × danger patterns (8)

- [ ] The evaluation is overfitting the eval seeds
- [x] Even 1% random actions are costly when the snake is long, so training scores understate the policy
- [ ] The two numbers come from different policies, so the gap is noise
Why: In Snake one random turn beside the body is fatal, and long episodes contain hundreds of such moments. Evaluate greedily, on held-out seeds, with enough episodes to put a standard error on the mean.

<script>
// === SNAKE CORE BEGIN ===
// Engine shared by this page, node tools (game/snake_core.js extracts this block) and, by line-for-line
// mirroring, python/snake_rl/core.py. Change a rule here → change it there; tests/test_parity.py catches drift.
(function (root) {
  'use strict';

  // Clockwise order, so "turn right" is dir+1 and "turn left" is dir+3 (mod 4). y grows downward.
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // R, D, L, U
  const ACTIONS = { STRAIGHT: 0, RIGHT: 1, LEFT: 2 };

  // mulberry32: tiny, fast, reproducible bit-for-bit in Python with 32-bit masking.
  class Rng {
    constructor(seed) { this.s = seed >>> 0; }
    nextU32() {
      this.s = (this.s + 0x6D2B79F5) >>> 0;
      let t = this.s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return (t ^ (t >>> 14)) >>> 0;
    }
    // Integer maths, not float, so Python computes the identical index (u*n < 2^53 always here).
    int(n) { return Math.floor(this.nextU32() * n / 4294967296); }
  }

  class SnakeGame {
    constructor({ width = 12, height = 12, seed = 0, idleLimit = 100 } = {}) {
      this.w = width; this.h = height; this.idleLimit = idleLimit;
      this.rng = new Rng(seed);
      this.occ = new Uint8Array(width * height);
      this.reset();
    }

    // reset(seed) restarts the RNG; reset() continues the stream (what auto-reset in the vec env does).
    reset(seed) {
      if (seed !== undefined && seed !== null) this.rng = new Rng(seed);
      const cx = Math.floor(this.w / 2), cy = Math.floor(this.h / 2);
      this.body = [[cx, cy], [cx - 1, cy], [cx - 2, cy]]; // head first
      this.occ.fill(0);
      for (const [x, y] of this.body) this.occ[y * this.w + x] = 1;
      this.dir = 0;
      this.score = 0; this.steps = 0; this.sinceFood = 0;
      this.done = false; this.won = false; this.cause = null;
      this.placeFood();
      return this;
    }

    placeFood() {
      const free = [];
      for (let y = 0; y < this.h; y++)
        for (let x = 0; x < this.w; x++)
          if (!this.occ[y * this.w + x]) free.push([x, y]);
      this.food = free.length ? free[this.rng.int(free.length)] : null;
    }

    // The tail cell vacates on this tick, so it is not an obstacle. Food never sits on the body,
    // so "moving into the tail while eating" can't happen and needs no special case.
    blocked(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return true;
      const t = this.body[this.body.length - 1];
      return this.occ[y * this.w + x] === 1 && !(x === t[0] && y === t[1]);
    }

    step(action) {
      if (this.done) throw new Error('step() after episode end; call reset()');
      if (action === ACTIONS.RIGHT) this.dir = (this.dir + 1) % 4;
      else if (action === ACTIONS.LEFT) this.dir = (this.dir + 3) % 4;
      const [dx, dy] = DIRS[this.dir];
      const nx = this.body[0][0] + dx, ny = this.body[0][1] + dy;
      this.steps++; this.sinceFood++;

      if (this.blocked(nx, ny)) {
        this.done = true;
        this.cause = (nx < 0 || ny < 0 || nx >= this.w || ny >= this.h) ? 'wall' : 'self';
        return { reward: -1, terminated: true, truncated: false, event: this.cause };
      }
      const eating = this.food !== null && nx === this.food[0] && ny === this.food[1];
      if (!eating) {
        const t = this.body.pop();
        this.occ[t[1] * this.w + t[0]] = 0;
      }
      this.body.unshift([nx, ny]);
      this.occ[ny * this.w + nx] = 1;

      if (eating) {
        this.score++; this.sinceFood = 0;
        if (this.body.length === this.w * this.h) {
          this.done = true; this.won = true; this.food = null; this.cause = 'win';
          return { reward: 1, terminated: true, truncated: false, event: 'win' };
        }
        this.placeFood();
        return { reward: 1, terminated: false, truncated: false, event: 'food' };
      }
      // Truncation, not termination: the state isn't terminal, we just stop a looping agent.
      // Learners must still bootstrap through it (Pardo et al. 2018).
      if (this.sinceFood > this.idleLimit * this.body.length) {
        this.done = true; this.cause = 'timeout';
        return { reward: 0, terminated: false, truncated: true, event: 'timeout' };
      }
      return { reward: 0, terminated: false, truncated: false, event: null };
    }

    // Human input is absolute (arrow keys); agents act relative. Reversal maps to straight.
    relativeFromAbsolute(absDir) {
      const d = (absDir - this.dir + 4) % 4;
      return d === 1 ? ACTIONS.RIGHT : d === 3 ? ACTIONS.LEFT : ACTIONS.STRAIGHT;
    }
  }

  // ---- features (mirror: python/snake_rl/features.py) ----

  // 11 binary features: danger [straight, right, left], heading one-hot [R, D, L, U], food [left, right, up, down].
  function basicFeatures(g) {
    const [hx, hy] = g.body[0];
    const f = new Array(11).fill(0);
    const rel = [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4];
    for (let i = 0; i < 3; i++) { const [dx, dy] = DIRS[rel[i]]; f[i] = g.blocked(hx + dx, hy + dy) ? 1 : 0; }
    f[3 + g.dir] = 1;
    if (g.food) {
      f[7] = g.food[0] < hx ? 1 : 0; f[8] = g.food[0] > hx ? 1 : 0;
      f[9] = g.food[1] < hy ? 1 : 0; f[10] = g.food[1] > hy ? 1 : 0;
    }
    return f;
  }

  function basicStateIndex(g) {
    const f = basicFeatures(g);
    let s = 0;
    for (let i = 0; i < 11; i++) s |= f[i] << i;
    return s;
  }

  // Free area reachable from (sx,sy), tail counted as free. Approximate (the body moves while you
  // travel) but it is exactly the signal the 11 features lack: "will this move trap me?".
  function reachable(g, sx, sy) {
    if (g.blocked(sx, sy)) return 0;
    const seen = new Uint8Array(g.w * g.h);
    const stack = [[sx, sy]]; seen[sy * g.w + sx] = 1; let n = 0;
    while (stack.length) {
      const [x, y] = stack.pop(); n++;
      for (const [dx, dy] of DIRS) {
        const ax = x + dx, ay = y + dy;
        if (ax < 0 || ay < 0 || ax >= g.w || ay >= g.h) continue;
        const k = ay * g.w + ax;
        if (seen[k] || g.blocked(ax, ay)) continue;
        seen[k] = 1; stack.push([ax, ay]);
      }
    }
    return n;
  }

  // 15 features: basic 11 + reachable-area fraction for [straight, right, left] + length fraction.
  function extendedFeatures(g) {
    const f = basicFeatures(g);
    const [hx, hy] = g.body[0];
    const area = g.w * g.h;
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const [dx, dy] = DIRS[d];
      f.push(reachable(g, hx + dx, hy + dy) / area);
    }
    f.push(g.body.length / area);
    return f;
  }

  // Grid observation for the CNN agents, shape (4, h+2, w+2), flattened channel-major like PyTorch.
  // ch0 body recency (head 1 → tail 1/L, so heading is visible), ch1 head, ch2 food, ch3 wall ring.
  // Mirror: python/snake_rl/features.py::grid_obs and vec_env.py::_obs.
  function gridObservation(g) {
    const W = g.w + 2, H = g.h + 2, plane = W * H;
    const x = new Float32Array(4 * plane);
    const L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * W + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * W + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * W + g.food[0] + 1] = 1;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      if (r === 0 || c === 0 || r === H - 1 || c === W - 1) x[3 * plane + r * W + c] = 1;
    return { data: x, shape: [4, H, W] };
  }

  // Tryout 05 observation: a fixed 14x14 canvas (board at offset 1, everything outside is wall) so one network plays every
  // board up to 12x12. Channels: 0 tail order (age/length), 1 head, 2 food, 3 wall, 4 length/cells, 5 (win6) reachable area.
  // Mirrors python/snake_rl/features.py::win_obs and TorchSnakeVecEnv._win.
  function gridObservationWin(g, reach) {
    const C = 14, S = g.w, plane = C * C, nch = reach ? 6 : 5, x = new Float32Array(nch * plane), L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * C + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * C + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * C + g.food[0] + 1] = 1;
    for (let r = 0; r < C; r++) for (let c = 0; c < C; c++) x[3 * plane + r * C + c] = (r >= 1 && r <= S && c >= 1 && c <= S) ? 0 : 1;
    for (let r = 1; r <= S; r++) for (let c = 1; c <= S; c++) x[4 * plane + r * C + c] = L / (S * S);
    if (reach) {
      const seen = new Uint8Array(S * S), stack = [[g.body[0][0], g.body[0][1]]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        for (const [dx, dy] of DIRS) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && ny >= 0 && nx < S && ny < S && !g.occ[ny * S + nx] && !seen[ny * S + nx]) { seen[ny * S + nx] = 1; stack.push([nx, ny]); }
        }
      }
      for (let i = 0; i < S * S; i++) if (seen[i]) x[5 * plane + (Math.floor(i / S) + 1) * C + (i % S) + 1] = 1;
    }
    return { data: x, shape: [nch, C, C] };
  }

  // "Trap" mask (tryout 05): [straight, right, left] -> true if the move kills at once OR leads into a region too small for the snake.
  // Time-aware flood fill: a body cell can be entered at move m once its age <= m (the tail keeps freeing cells); K = cells/2 + 2
  // expansions; trap when the reachable area < length (+1 if the move eats). If every move is a trap only instant deaths are
  // blocked. Mirrors python/snake_rl/features.py::trap_danger and TorchSnakeVecEnv.danger_trap.
  function trapDanger(g) {
    const S = g.w, L = g.body.length, age = new Map(), key = (x, y) => y * S + x;
    g.body.forEach(([bx, by], i) => age.set(key(bx, by), L - i));
    const [hx, hy] = g.body[0], inst = [], areas = [], cands = [];
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
      const dead = nx < 0 || ny < 0 || nx >= S || ny >= S || (age.get(key(nx, ny)) || 0) > 1;
      inst.push(dead); cands.push([nx, ny]);
      if (dead) { areas.push(0); continue; }
      let reach = new Set([key(nx, ny)]);
      for (let m = 2; m < S * S / 2 + 3; m++) {
        const nw = new Set(reach);
        for (const k of reach) {
          const cx = k % S, cy = Math.floor(k / S);
          for (const [dx, dy] of DIRS) {
            const qx = cx + dx, qy = cy + dy;
            if (qx >= 0 && qy >= 0 && qx < S && qy < S && (age.get(key(qx, qy)) || 0) <= m) nw.add(key(qx, qy));
          }
        }
        reach = nw;
      }
      areas.push(reach.size);
    }
    const trap = [0, 1, 2].map(j => !inst[j] && areas[j] < L + (g.food && cands[j][0] === g.food[0] && cands[j][1] === g.food[1] ? 1 : 0));
    let ok = [0, 1, 2].map(j => !(inst[j] || trap[j]));
    if (!ok.some(Boolean)) ok = inst.map(v => !v);
    return ok.map(v => !v);
  }

  // Non-RL reference: follow a Hamiltonian cycle of the board. Visits every cell once, so the snake can never trap itself and
  // fills the board on every seed. Even square boards of at least 6x6 (the start body must lie on the cycle).
  const HAM = {};
  function hamCycle(S) {
    if (HAM[S]) return HAM[S];
    if (S % 2 || S < 6) throw new Error('the Hamiltonian-cycle agent needs an even board of at least 6x6');
    const cyc = [];
    for (let x = 0; x < S; x++) cyc.push([x, 0]);
    for (let r = 1; r < S; r++) { if (r % 2) for (let x = S - 1; x > 0; x--) cyc.push([x, r]); else for (let x = 1; x < S; x++) cyc.push([x, r]); }
    for (let y = S - 1; y > 0; y--) cyc.push([0, y]);
    const c = S / 2, k = cyc.findIndex(q => q[0] === c && q[1] === c), nx = cyc[(k + 1) % cyc.length];
    if (!(nx[0] === c + 1 && nx[1] === c)) cyc.reverse();
    const pos = new Map(); cyc.forEach((q, i) => pos.set(q[0] + ',' + q[1], i));
    return (HAM[S] = { cyc, pos });
  }
  function hamiltonianAction(g) {
    const { cyc, pos } = hamCycle(g.w), [hx, hy] = g.body[0], [nx, ny] = cyc[(pos.get(hx + ',' + hy) + 1) % cyc.length];
    const d = DIRS.findIndex(v => v[0] === nx - hx && v[1] === ny - hy), rel = (d - g.dir + 4) % 4;
    return rel === 0 ? 0 : rel === 1 ? 1 : 2;
  }

  // Minimal NCHW inference for exported CNN/MLP models (layers written by python/export_model.py).
  function runLayers(layers, inp) {
    let x = inp.data, shape = inp.shape;
    for (const L of layers) {
      if (L.op === 'conv') {
        const [C, H, W] = shape, { cout, k, stride: s, pad: p, w, b } = L;
        const Ho = Math.floor((H + 2 * p - k) / s) + 1, Wo = Math.floor((W + 2 * p - k) / s) + 1;
        const out = new Float32Array(cout * Ho * Wo);
        for (let co = 0; co < cout; co++)
          for (let i = 0; i < Ho; i++)
            for (let j = 0; j < Wo; j++) {
              let acc = b[co];
              for (let ci = 0; ci < C; ci++)
                for (let ki = 0; ki < k; ki++) {
                  const yy = i * s + ki - p; if (yy < 0 || yy >= H) continue;
                  for (let kj = 0; kj < k; kj++) {
                    const xx = j * s + kj - p; if (xx < 0 || xx >= W) continue;
                    acc += w[((co * C + ci) * k + ki) * k + kj] * x[(ci * H + yy) * W + xx];
                  }
                }
              out[(co * Ho + i) * Wo + j] = acc;
            }
        x = out; shape = [cout, Ho, Wo];
      } else if (L.op === 'relu') {
        x = x.map(v => (v > 0 ? v : 0));
      } else if (L.op === 'flatten') {
        shape = [x.length];
      } else if (L.op === 'linear') {
        const out = new Float32Array(L.out);
        for (let o = 0; o < L.out; o++) {
          let acc = L.b[o]; const base = o * L.in;
          for (let i = 0; i < L.in; i++) acc += L.w[base + i] * x[i];
          out[o] = acc;
        }
        x = out; shape = [L.out];
      } else if (L.op === 'dueling') {
        const v = runLayers(L.value, { data: x, shape }).data[0];
        const a = runLayers(L.adv, { data: x, shape }).data;
        const m = a.reduce((s2, t) => s2 + t, 0) / a.length;
        x = a.map(t => v + t - m); shape = [a.length];
      } else throw new Error('unknown op ' + L.op);
    }
    return { data: x, shape };
  }

  function modelInput(m, g) {
    if (m.obs === 'grid4') return gridObservation(g);
    if (m.obs === 'win5') return gridObservationWin(g, false);
    if (m.obs === 'win6') return gridObservationWin(g, true);
    const f = m.features === 'extended' ? extendedFeatures(g) : basicFeatures(g);
    return { data: Float32Array.from(f), shape: [f.length] };
  }

  // ---- policies ----

  function argmax(a) { let b = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[b]) b = i; return b; }

  const policies = {
    random: (g, rng) => rng.int(3),
    // Greedy-toward-food that avoids immediate death: the bar any learned agent has to clear.
    greedy: (g) => {
      const [hx, hy] = g.body[0];
      let best = 0, bestD = Infinity;
      for (const a of [0, 1, 2]) {
        const d = a === 0 ? g.dir : a === 1 ? (g.dir + 1) % 4 : (g.dir + 3) % 4;
        const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
        if (g.blocked(nx, ny)) continue;
        const dist = g.food ? Math.abs(nx - g.food[0]) + Math.abs(ny - g.food[1]) : 0;
        if (dist < bestD) { bestD = dist; best = a; }
      }
      return best;
    },
  };

  function mlpForward(layers, x) {
    let h = x;
    for (let l = 0; l < layers.length; l++) {
      const { w, b } = layers[l];
      const out = new Array(b.length);
      for (let i = 0; i < b.length; i++) {
        let s = b[i]; const row = w[i];
        for (let j = 0; j < h.length; j++) s += row[j] * h[j];
        out[i] = l < layers.length - 1 && s < 0 ? 0 : s; // ReLU on hidden layers only
      }
      h = out;
    }
    return h;
  }

  function policyFromModel(m) {
    // q may be a dense array or a sparse {stateIndex: [..]} map; unseen states default to 0s.
    if (m.type === 'hamiltonian') return (g) => hamiltonianAction(g);
    if (m.type === 'tabular') return (g) => argmax(m.q[basicStateIndex(g)] || [0, 0, 0]);
    if (m.type === 'mlp') {
      const feat = m.features === 'extended' ? extendedFeatures : basicFeatures;
      return (g) => argmax(mlpForward(m.layers, feat(g)));
    }
    if (m.type === 'net') {
      if (!m.mask) return (g) => argmax(Array.from(runLayers(m.layers, modelInput(m, g)).data));
      // action masking (tryout 03): never pick a move that kills on the next tick, unless every move does.
      // basicFeatures()[0..2] are the danger bits for [straight, right, left], the same action order as the net's outputs.
      return (g) => {
        const q = Array.from(runLayers(m.layers, modelInput(m, g)).data), d = m.mask === 'trap' ? trapDanger(g) : basicFeatures(g);
        let ok = [!d[0], !d[1], !d[2]];
        if (!ok.some(Boolean)) ok = [true, true, true];
        let best = -1;
        for (let i = 0; i < 3; i++) if (ok[i] && (best < 0 || q[i] > q[best])) best = i;
        return best;
      };
    }
    throw new Error('unknown model type ' + m.type);
  }

  function modelScores(m, g) {
    if (m.type === 'hamiltonian') return [0, 0, 0];
    if (m.type === 'tabular') return m.q[basicStateIndex(g)] || [0, 0, 0];
    if (m.type === 'mlp') return mlpForward(m.layers, (m.features === 'extended' ? extendedFeatures : basicFeatures)(g));
    return Array.from(runLayers(m.layers, modelInput(m, g)).data);
  }

  // ---- tabular Q-learning (mirror: python/train_tabular.py) ----

  function trainTabularQ(opts = {}) {
    const o = Object.assign({
      width: 12, height: 12, episodes: 20000, alpha: 0.1, gamma: 0.95,
      epsStart: 1.0, epsEnd: 0.01, epsDecayFrac: 0.5, seed: 1, logEvery: 250,
    }, opts);
    const q = Array.from({ length: 2048 }, () => [0, 0, 0]);
    const visits = new Uint32Array(2048);
    const rng = new Rng(o.seed ^ 0x9E3779B9);
    const g = new SnakeGame({ width: o.width, height: o.height, seed: o.seed });
    const log = []; let buf = []; let totalSteps = 0;
    for (let ep = 0; ep < o.episodes; ep++) {
      const eps = Math.max(o.epsEnd, o.epsStart - (o.epsStart - o.epsEnd) * ep / (o.episodes * o.epsDecayFrac));
      g.reset();
      let s = basicStateIndex(g);
      while (!g.done) {
        const a = rng.nextU32() / 4294967296 < eps ? rng.int(3) : argmax(q[s]);
        const r = g.step(a);
        const s2 = r.terminated ? -1 : basicStateIndex(g);
        // terminated → no bootstrap; truncated → still bootstrap (the state wasn't terminal)
        const target = r.reward + (r.terminated ? 0 : o.gamma * Math.max(...q[s2]));
        q[s][a] += o.alpha * (target - q[s][a]);
        visits[s]++; s = s2; totalSteps++;
      }
      buf.push([g.score, g.cause]);
      if ((ep + 1) % o.logEvery === 0) {
        const sc = buf.map(b => b[0]);
        log.push({
          episode: ep + 1, steps: totalSteps, eps: +eps.toFixed(3),
          mean: +(sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(3), max: Math.max(...sc),
          wall: buf.filter(b => b[1] === 'wall').length / buf.length,
          self: buf.filter(b => b[1] === 'self').length / buf.length,
          timeout: buf.filter(b => b[1] === 'timeout').length / buf.length,
        });
        buf = [];
      }
    }
    return { q, visits, log, opts: o, totalSteps };
  }

  // Greedy evaluation on held-out seeds. Optionally records one replay every k episodes.
  function evaluate(policy, { width = 12, height = 12, seeds = [], recordEvery = 0, rngSeed = 7 } = {}) {
    const rng = new Rng(rngSeed);
    const res = { scores: [], lengths: [], causes: {}, replays: [] };
    seeds.forEach((seed, i) => {
      const g = new SnakeGame({ width, height, seed });
      const actions = [];
      while (!g.done) { const a = policy(g, rng); actions.push(a); g.step(a); }
      res.scores.push(g.score); res.lengths.push(g.steps);
      res.causes[g.cause] = (res.causes[g.cause] || 0) + 1;
      if (recordEvery && i % recordEvery === 0) res.replays.push({ seed, width, height, actions: actions.join(''), score: g.score });
    });
    const s = [...res.scores].sort((a, b) => a - b);
    const pct = p => s[Math.min(s.length - 1, Math.floor(p * s.length))];
    res.summary = {
      n: s.length, mean: s.reduce((a, b) => a + b, 0) / s.length,
      median: pct(0.5), p10: pct(0.1), p90: pct(0.9), max: s[s.length - 1],
      // IQM: mean of the middle 50%, robust to outliers (Agarwal et al. 2021)
      iqm: (() => { const m = s.slice(Math.floor(s.length * 0.25), Math.ceil(s.length * 0.75)); return m.reduce((a, b) => a + b, 0) / m.length; })(),
    };
    return res;
  }

  const api = { DIRS, ACTIONS, Rng, SnakeGame, basicFeatures, basicStateIndex, extendedFeatures, reachable,
    gridObservation, gridObservationWin, hamiltonianAction, trapDanger, runLayers, modelInput, modelScores,
    argmax, policies, mlpForward, policyFromModel, trainTabularQ, evaluate };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SnakeCore = api;
})(typeof self !== 'undefined' ? self : this);
// === SNAKE CORE END ===

<script>
// ---------- shared widget helpers ----------
const H = (() => {
  const tip = document.getElementById('tip');
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'style' ? (e.style.cssText = v) : k.startsWith('on') ? (e[k] = v) : e.setAttribute(k, v);
    for (const k of kids) e.append(k);
    return e;
  };
  const showTip = (txt, ev) => { tip.textContent = txt; tip.style.display = 'block'; tip.style.left = ev.clientX + 12 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; };
  const hideTip = () => { tip.style.display = 'none'; };
  const slider = (label, min, max, step, value, onInput, fmt = v => v) => {
    const out = el('span', { class: 'mono' }, fmt(value));
    const inp = el('input', { type: 'range', min, max, step, value });
    inp.oninput = () => { out.textContent = fmt(+inp.value); onInput(+inp.value); };
    return el('label', {}, label, inp, out);
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  // Line chart with hover. series: [{name, x:[], y:[], color, dash}]
  function lineChart(host, { series, xlabel = '', ylabel = '', w = 760, h = 300, ymin, ymax, hlines = [] }) {
    host.innerHTML = '';
    const m = { l: 48, r: 130, t: 12, b: 36 }, W = w - m.l - m.r, Hh = h - m.t - m.b;
    const xs = series.flatMap(d => d.x), ys = series.flatMap(d => d.y).filter(v => v != null).concat(hlines.map(l => l.y));
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = ymin ?? Math.min(0, ...ys), y1 = ymax ?? Math.max(...ys) * 1.08;
    const X = v => m.l + (v - x0) / (x1 - x0 || 1) * W, Y = v => m.t + Hh - (v - y0) / (y1 - y0 || 1) * Hh;
    const svg = s('svg', { viewBox: `0 0 ${w} ${h}`, width: '100%' });
    for (let i = 0; i <= 5; i++) {
      const v = y0 + (y1 - y0) * i / 5;
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(v), y2: Y(v), stroke: '#eceee8' }));
      const t = s('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = +v.toFixed(1); svg.append(t);
    }
    const xt = [...new Set(series[0].x)];
    const step = Math.ceil(xt.length / 10);
    xt.forEach((v, i) => { if (i % step) return; const t = s('text', { x: X(v), y: m.t + Hh + 16, 'text-anchor': 'middle' }); t.textContent = v; svg.append(t); });
    const xl = s('text', { x: m.l + W / 2, y: h - 4, 'text-anchor': 'middle' }); xl.textContent = xlabel; svg.append(xl);
    const yl = s('text', { x: 12, y: m.t + Hh / 2, transform: `rotate(-90 12 ${m.t + Hh / 2})`, 'text-anchor': 'middle' }); yl.textContent = ylabel; svg.append(yl);
    hlines.forEach(l => {
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(l.y), y2: Y(l.y), stroke: l.color || '#999', 'stroke-dasharray': '4 4' }));
      const t = s('text', { x: m.l + 6, y: Y(l.y) - 5 }); t.textContent = l.name; svg.append(t);
    });
    series.forEach((d, k) => {
      const pts = d.x.map((x, i) => d.y[i] == null ? null : [X(x), Y(d.y[i])]).filter(Boolean);
      svg.append(s('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: d.color, 'stroke-width': 2, 'stroke-dasharray': d.dash || '' }));
      d.x.forEach((x, i) => {
        if (d.y[i] == null) return;
        const dense = d.x.length > 60;
        if (dense && i % 5) return;  // keep long curves readable; every 5th point stays hoverable
        const c = s('circle', { cx: X(x), cy: Y(d.y[i]), r: dense ? 2.5 : 4, fill: d.color });
        c.onmousemove = ev => showTip(`${d.name}\n${xlabel} ${x}: ${d.y[i]}${d.extra ? '\n' + d.extra(i) : ''}`, ev);
        c.onmouseleave = hideTip;
        svg.append(c);
      });
      const t = s('text', { x: m.l + W + 6, y: m.t + 14 + k * 16, fill: d.color }); t.textContent = '— ' + d.name; t.setAttribute('style', `fill:${d.color}`); svg.append(t);
    });
    host.append(svg);
    return svg;
  }
  // Draw a Snake board; overlay(x, y) may return a CSS colour per cell (heatmaps).
  function board(canvas, g, { cell = 22, overlay = null, label = null } = {}) {
    canvas.width = g.w * cell; canvas.height = g.h * cell;
    const c = canvas.getContext('2d');
    c.fillStyle = '#9bbc0f'; c.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const col = overlay && overlay(x, y);
      if (col) { c.fillStyle = col; c.fillRect(x * cell, y * cell, cell, cell); }
      else if ((x + y) % 2) { c.fillStyle = '#93b40f'; c.fillRect(x * cell, y * cell, cell, cell); }
      if (label) { const t = label(x, y); if (t) { c.fillStyle = '#0f380f'; c.font = '9px monospace'; c.fillText(t, x * cell + 2, y * cell + cell - 4); } }
    }
    if (g.food) { c.fillStyle = '#0f380f'; const p = cell * 0.28; c.fillRect(g.food[0] * cell + p, g.food[1] * cell + p, cell - 2 * p, cell - 2 * p); }
    g.body.forEach(([x, y], i) => { c.fillStyle = i ? '#306230' : '#0f380f'; c.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2); });
  }
  const heat = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1))); return `rgba(${Math.round(220 - 190 * t)},${Math.round(70 + 120 * t)},${Math.round(60 + 30 * t)},0.85)`; };
  return { el, slider, lineChart, board, heat, showTip, hideTip, s };
})();
const WIDGETS = {};

<script>
// Interactive figures for tryout 01. Each WIDGETS[name](host, R, S, H) gets the results JSON (R), the game
// engine (S, the same code as game/index.html) and the helpers (H) from notes/template.html.

const COLORS = ['#306230', '#c27c0e', '#3a6ea5', '#9b3d8f'];
const ACT = ['straight', 'right', 'left'];
const qRow = (R, idx) => (R.model && R.model.q[idx]) || [0, 0, 0];

// Features as if the head stood at (x, y) with heading d: used for the value heatmap.
function indexAt(S, g, x, y, d) {
  let s = 0;
  [d, (d + 1) % 4, (d + 3) % 4].forEach((dd, i) => { if (g.blocked(x + S.DIRS[dd][0], y + S.DIRS[dd][1])) s |= 1 << i; });
  s |= 1 << (3 + d);
  if (g.food) {
    if (g.food[0] < x) s |= 1 << 7; if (g.food[0] > x) s |= 1 << 8;
    if (g.food[1] < y) s |= 1 << 9; if (g.food[1] > y) s |= 1 << 10;
  }
  return s;
}

function snapshot(g) { return { w: g.w, h: g.h, body: g.body.map(p => [...p]), dir: g.dir, food: g.food && [...g.food] }; }
function restore(S, snap) {
  const g = new S.SnakeGame({ width: snap.w, height: snap.h, seed: 0 });
  g.body = snap.body.map(p => [...p]); g.occ.fill(0);
  for (const [x, y] of g.body) g.occ[y * g.w + x] = 1;
  g.dir = snap.dir; g.food = snap.food && [...snap.food];
  return g;
}

WIDGETS.curves = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Learning curves: greedy evaluation on 500 held-out seeds'));
  const ctl = H.el('div', { class: 'row' }); host.append(ctl);
  const chart = H.el('div'); host.append(chart);
  const note = H.el('div', { class: 'mono' }); host.append(note);
  let board = '12x12', metric = 'eval';
  const draw = () => {
    const sc = R.seedCurves, ep = sc.epochs, run = R.runs[board + '_seed1'].checkpoints;
    const series = metric === 'eval'
      ? Object.entries(sc[board]).map(([k, ys], i) => ({ name: 'eval ' + k, x: ep, y: ys, color: COLORS[i],
          extra: k === 'seed1' ? j => `median ${run[j].median}, p90 ${run[j].p90}, max ${run[j].max}, wins ${run[j].wins}\ndeaths wall/self/timeout ${run[j].wall}/${run[j].self}/${run[j].timeout}` : null }))
      : [{ name: 'eval (greedy)', x: ep, y: run.map(c => c.evalMean), color: COLORS[0] },
         { name: 'train (ε-greedy)', x: ep, y: run.map(c => c.trainMean), color: COLORS[1], dash: '5 4' },
         { name: 'best eval game', x: ep, y: run.map(c => c.max), color: COLORS[2], dash: '2 3' }];
    const hl = board === '12x12' ? [{ y: R.baselines12.greedy, name: 'heuristic 20.4', color: '#b3261e' }] : [];
    H.lineChart(chart, { series, xlabel: 'epoch (×100 episodes)', ylabel: 'score (food eaten)', hlines: hl });
    note.textContent = `win = score ${R.runs[board + '_seed1'].winScore}. Hover points for details.`;
  };
  const sel = (opts, cb) => { const s = H.el('select'); opts.forEach(o => s.append(H.el('option', { value: o[0] }, o[1]))); s.onchange = () => { cb(s.value); draw(); }; return s; };
  ctl.append(H.el('label', {}, 'board ', sel([['12x12', '12×12'], ['6x6', '6×6']], v => board = v)),
             H.el('label', {}, 'view ', sel([['eval', '3 seeds, eval mean'], ['detail', 'seed 1: eval vs train vs best']], v => metric = v)));
  draw();
};

WIDGETS.gamma_horizon = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Discounting: how far ahead does γ look?'));
  const chart = H.el('div'), info = H.el('div', { class: 'mono' });
  let g = 0.95;
  const draw = () => {
    const k = Array.from({ length: 101 }, (_, i) => i);
    H.lineChart(chart, { series: [
      { name: 'weight γ^k', x: k, y: k.map(i => +Math.pow(g, i).toFixed(4)), color: COLORS[0] },
      { name: 'γ = 0.99 ref', x: k, y: k.map(i => +Math.pow(0.99, i).toFixed(4)), color: '#aaa', dash: '4 4' }],
      xlabel: 'steps into the future k', ylabel: 'weight', ymin: 0, ymax: 1, h: 240 });
    const hzn = 1 / (1 - g);
    info.innerHTML = `effective horizon 1/(1−γ) = <b>${hzn.toFixed(1)}</b> steps · food 10 steps away is worth γ¹⁰ = ${Math.pow(g, 10).toFixed(3)} · ` +
      `a death 40 steps away weighs γ⁴⁰ = ${Math.pow(g, 40).toFixed(3)}<br>Snake on 12×12: food ≈ 5–15 steps away; escaping a coil can take 50+ steps.`;
  };
  host.append(H.el('div', { class: 'row' }, H.slider('γ ', 0.5, 0.999, 0.001, g, v => { g = v; draw(); }, v => v.toFixed(3))), chart, info);
  draw();
};

WIDGETS.q_update = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'One Q-learning update, on a real Snake transition'));
  const q = {}; // local editable copy of the learned table
  const reset = () => { for (const k in q) delete q[k]; Object.entries(R.model.q).forEach(([k, v]) => q[k] = [...v]); };
  reset();
  let alpha = 0.1, gamma = 0.95, seed = 100003, g, eps = 0.0, rng = new S.Rng(1);
  const cv = H.el('canvas'), out = H.el('div', { class: 'mono', style: 'white-space:pre;line-height:1.5' });
  const row = i => q[i] || (q[i] = [0, 0, 0]);
  const newGame = () => { g = new S.SnakeGame({ seed }); render(null); };
  const render = (t) => {
    H.board(cv, g, { cell: 18 });
    const s = S.basicStateIndex(g), f = S.basicFeatures(g);
    let txt = `state s = row ${s}   features ${f.join('')}  (danger S/R/L | heading R D L U | food L R U D)\n` +
              `Q(s,·) = [${row(s).map(v => v.toFixed(3)).join(', ')}]   greedy → ${ACT[S.argmax(row(s))]}\n`;
    if (t) {
      txt += `\nlast transition: a = ${ACT[t.a]}${t.explore ? ' (random, ε)' : ''},  r = ${t.r},  ${t.term ? 'TERMINAL → no bootstrap' : `max_a' Q(s',a') = ${t.next.toFixed(3)}`}\n` +
             `target  = r + γ·max Q(s',·) = ${t.r} + ${gamma.toFixed(2)}·${t.term ? 0 : t.next.toFixed(3)} = ${t.target.toFixed(3)}\n` +
             `δ (TD error) = target − Q(s,a) = ${t.target.toFixed(3)} − ${t.old.toFixed(3)} = ${(t.target - t.old).toFixed(3)}\n` +
             `Q(s,a) ← ${t.old.toFixed(3)} + α·δ = ${t.old.toFixed(3)} + ${alpha.toFixed(2)}·${(t.target - t.old).toFixed(3)} = ${t.new.toFixed(3)}`;
    }
    out.textContent = txt;
  };
  const step = () => {
    if (g.done) { g.reset(); render(null); return; }
    const s = S.basicStateIndex(g), explore = rng.nextU32() / 4294967296 < eps;
    const a = explore ? rng.int(3) : S.argmax(row(s));
    const r = g.step(a);
    const next = r.terminated ? 0 : Math.max(...row(S.basicStateIndex(g)));
    const old = row(s)[a], target = r.reward + (r.terminated ? 0 : gamma * next);
    row(s)[a] = old + alpha * (target - old);
    render({ a, r: r.reward, term: r.terminated, next, old, target, new: row(s)[a], explore });
  };
  const btn = (t, f) => H.el('button', { class: 'btn', onclick: f }, t);
  host.append(
    H.el('div', { class: 'row' }, H.slider('α ', 0.01, 1, 0.01, alpha, v => alpha = v, v => v.toFixed(2)),
      H.slider('γ ', 0, 0.999, 0.001, gamma, v => gamma = v, v => v.toFixed(3)),
      H.slider('ε ', 0, 1, 0.05, eps, v => eps = v, v => v.toFixed(2))),
    H.el('div', { class: 'row' }, btn('step + update', step), btn('10 steps', () => { for (let i = 0; i < 10; i++) step(); }),
      btn('new episode', () => { seed++; newGame(); }), btn('restore learned table', () => { reset(); render(null); })),
    H.el('div', { class: 'row', style: 'align-items:flex-start' }, cv, out));
  newGame();
};

WIDGETS.epsilon_schedule = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'ε-greedy schedule, and what exploration costs'));
  const c = R.config, run = R.runs['12x12_seed1'].checkpoints;
  let e0 = c.epsStart, e1 = c.epsEnd, frac = c.epsDecayEpochs / c.epochs;
  const chart = H.el('div'), info = H.el('div', { class: 'mono' });
  const draw = () => {
    const ep = Array.from({ length: 41 }, (_, i) => i * 5);
    const eps = ep.map(x => +Math.max(e1, e0 - (e0 - e1) * x / (c.epochs * frac)).toFixed(3));
    H.lineChart(chart, { series: [{ name: 'ε (your schedule)', x: ep, y: eps, color: COLORS[2] }], xlabel: 'epoch', ylabel: 'ε', ymin: 0, ymax: 1, h: 200 });
    const p = n => (100 * Math.pow(1 - e1, n)).toFixed(1);
    info.innerHTML = `At the floor ε = ${e1}: chance an episode of 200 / 500 moves has <i>no</i> random action = ${p(200)}% / ${p(500)}%.<br>` +
      `Measured (run used ε 1→0.01 over 100 epochs): epoch 200 train mean ${run[8].trainMean} vs greedy eval ${run[8].evalMean}.`;
  };
  host.append(H.el('div', { class: 'row' },
    H.slider('start ', 0, 1, 0.05, e0, v => { e0 = v; draw(); }, v => v.toFixed(2)),
    H.slider('floor ', 0, 0.3, 0.005, e1, v => { e1 = v; draw(); }, v => v.toFixed(3)),
    H.slider('decay over ', 0.05, 1, 0.05, frac, v => { frac = v; draw(); }, v => Math.round(v * 100) + '% of run')), chart, info);
  draw();
};

WIDGETS.aliasing = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'State aliasing: one table row, two very different situations'));
  // Search real greedy episodes for two states with the same row where the greedy move is safe in one
  // and walks into a pocket smaller than the snake in the other.
  const pol = g => S.argmax(qRow(R, S.basicStateIndex(g)));
  const seen = {};
  let pair = null;
  for (let seed = 100000; seed < 100200 && !pair; seed++) {
    const g = new S.SnakeGame({ seed });
    while (!g.done && !pair) {
      if (g.body.length > 12) {
        const idx = S.basicStateIndex(g), a = pol(g);
        const d = a === 0 ? g.dir : a === 1 ? (g.dir + 1) % 4 : (g.dir + 3) % 4;
        const nx = g.body[0][0] + S.DIRS[d][0], ny = g.body[0][1] + S.DIRS[d][1];
        const area = S.reachable(g, nx, ny), trap = area < g.body.length;
        const snap = { ...snapshot(g), a, area, nx, ny, idx };
        const other = seen[idx] && seen[idx][trap ? 'safe' : 'trap'];
        if (other) pair = trap ? [other, snap] : [snap, other];
        (seen[idx] = seen[idx] || {})[trap ? 'trap' : 'safe'] = seen[idx][trap ? 'trap' : 'safe'] || snap;
      }
      g.step(pol(g));
    }
  }
  if (!pair) { host.append('No aliased pair found in 200 episodes.'); return; }
  const row = H.el('div', { class: 'row', style: 'align-items:flex-start' });
  pair.forEach((snap, k) => {
    const g = restore(S, snap);
    const region = new Set();
    // flood fill from the chosen cell to colour the space the greedy move leads into
    const stack = [[snap.nx, snap.ny]];
    while (stack.length) {
      const [x, y] = stack.pop(), key = y * g.w + x;
      if (region.has(key) || g.blocked(x, y)) continue;
      region.add(key);
      S.DIRS.forEach(([dx, dy]) => stack.push([x + dx, y + dy]));
    }
    const cv = H.el('canvas');
    H.board(cv, g, { cell: 16, overlay: (x, y) => region.has(y * g.w + x) ? (k ? 'rgba(179,38,30,.35)' : 'rgba(30,122,52,.3)') : null });
    row.append(H.el('div', {}, cv, H.el('div', { class: 'mono' },
      `${k ? 'TRAP' : 'SAFE'}: row ${snap.idx}, greedy → ${ACT[snap.a]}`), H.el('div', { class: 'mono' },
      `room after the move: ${snap.area} cells, snake length ${snap.body.length}`)));
  });
  host.append(row, H.el('div', { class: 'mono', style: 'margin-top:6px' },
    `Both boards produce features ${pair[0].idx.toString(2).padStart(11, '0').split('').reverse().join('')} → identical Q(s,·) = [${qRow(R, pair[0].idx).map(v => v.toFixed(2)).join(', ')}]. ` +
    'No table entry can be right for both; the coloured region is what the agent cannot see.'));
};

WIDGETS.checkpoint_table = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Checkpoint log: every 25 epochs (2,500 episodes)'));
  const sel = H.el('select'); ['12x12', '6x6'].forEach(b => sel.append(H.el('option', { value: b }, b.replace('x', '×'))));
  const box = H.el('div');
  const draw = () => {
    const run = R.runs[sel.value + '_seed1'], pct = (c, k) => Math.round(100 * c[k] / 500) + '%';
    let prev = null;
    box.innerHTML = '<table><tr><th>epoch</th><th>ε</th><th>train mean (max, wins)</th><th>eval mean</th><th>median</th><th>p90</th><th>max</th><th>wins/500</th><th>Δ eval</th><th>wall / self / timeout</th></tr>' +
      run.checkpoints.map(c => {
        const d = prev == null ? '–' : (c.evalMean - prev >= 0 ? '+' : '') + (c.evalMean - prev).toFixed(2); prev = c.evalMean;
        return `<tr><td>${c.epoch}</td><td>${c.eps}</td><td>${c.trainMean == null ? '–' : `${c.trainMean} (${c.trainMax}, ${c.trainWins})`}</td><td><b>${c.evalMean}</b></td><td>${c.median}</td><td>${c.p90}</td><td>${c.max}</td><td>${c.wins}</td><td>${d}</td><td>${pct(c, 'wall')} / ${pct(c, 'self')} / ${pct(c, 'timeout')}</td></tr>`;
      }).join('') + `</table><div class="mono">win = score ${run.winScore}</div>`;
  };
  sel.onchange = draw;
  host.append(H.el('div', { class: 'row' }, H.el('label', {}, 'board ', sel)), box);
  draw();
};

WIDGETS.sweep_heatmap = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'γ × α sweep: mean greedy score (3 seeds, hover for each)'));
  const sw = R.sweep, cw = 120, ch = 36, m = 60;
  const svg = H.s('svg', { viewBox: `0 0 ${m + cw * sw.alphas.length + 20} ${m + ch * sw.gammas.length}`, width: '480' });
  sw.gammas.forEach((gm, i) => {
    const t = H.s('text', { x: m - 8, y: m + i * ch + ch / 2 + 4, 'text-anchor': 'end' }); t.textContent = 'γ ' + gm; svg.append(t);
    sw.alphas.forEach((al, j) => {
      if (i === 0) { const t2 = H.s('text', { x: m + j * cw + cw / 2, y: m - 10, 'text-anchor': 'middle' }); t2.textContent = 'α ' + al; svg.append(t2); }
      const v = sw.means[i][j], mean = v.reduce((a, b) => a + b, 0) / v.length;
      const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (v.length - 1));
      const r = H.s('rect', { x: m + j * cw, y: m + i * ch, width: cw - 2, height: ch - 2, fill: H.heat(mean, 10, 23), rx: 3 });
      r.onmousemove = ev => H.showTip(`γ=${gm}, α=${al}\nseeds: ${v.join(', ')}\nmean ${mean.toFixed(2)} ± ${sd.toFixed(2)} (sd)`, ev);
      r.onmouseleave = H.hideTip;
      const t3 = H.s('text', { x: m + j * cw + cw / 2, y: m + i * ch + ch / 2 + 4, 'text-anchor': 'middle' });
      t3.textContent = mean.toFixed(1) + ' ± ' + sd.toFixed(1); t3.setAttribute('style', 'fill:#0f380f;font-weight:600');
      svg.append(r, t3);
    });
  });
  host.append(svg, H.el('div', { class: 'mono' }, sw.note + '. Red = worse, green = better.'));
};

WIDGETS.replay = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Replay the trained table on held-out seeds, with a live value heatmap'));
  let seed = 100000, g, timer = null, speed = 12, showHeat = true;
  const cv = H.el('canvas'), info = H.el('div', { class: 'mono', style: 'white-space:pre' });
  const pol = gm => S.argmax(qRow(R, S.basicStateIndex(gm)));
  const draw = () => {
    let lo = Infinity, hi = -Infinity; const vals = {};
    if (showHeat) for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      if (g.occ[y * g.w + x]) continue;
      const v = Math.max(...qRow(R, indexAt(S, g, x, y, g.dir))); vals[y * g.w + x] = v; lo = Math.min(lo, v); hi = Math.max(hi, v);
    }
    H.board(cv, g, { cell: 24, overlay: showHeat ? (x, y) => (y * g.w + x) in vals ? H.heat(vals[y * g.w + x], lo, hi) : null : null });
    const q = qRow(R, S.basicStateIndex(g));
    info.textContent = `seed ${seed}   score ${g.score}   length ${g.body.length}   steps ${g.steps}${g.done ? '   → ' + g.cause.toUpperCase() : ''}\n` +
      `Q(s,·): straight ${q[0].toFixed(3)}  right ${q[1].toFixed(3)}  left ${q[2].toFixed(3)}   → ${ACT[S.argmax(q)]}` +
      (showHeat ? `\nheatmap: max_a Q with the head moved to each cell (range ${lo.toFixed(2)} … ${hi.toFixed(2)})` : '');
  };
  const load = () => { stop(); g = new S.SnakeGame({ seed }); draw(); };
  const tick = () => { if (g.done) return stop(); g.step(pol(g)); draw(); };
  const stop = () => { clearInterval(timer); timer = null; };
  const play = () => { stop(); timer = setInterval(tick, 1000 / speed); };
  const seedIn = H.el('input', { type: 'number', value: seed, style: 'width:90px' });
  seedIn.onchange = () => { seed = +seedIn.value; load(); };
  const chk = H.el('input', { type: 'checkbox', checked: '' }); chk.onchange = () => { showHeat = chk.checked; draw(); };
  host.append(H.el('div', { class: 'row' }, H.el('label', {}, 'eval seed ', seedIn),
    H.el('button', { class: 'btn', onclick: play }, '▶ play'), H.el('button', { class: 'btn', onclick: stop }, '❚❚'),
    H.el('button', { class: 'btn', onclick: () => { stop(); tick(); } }, 'step'),
    H.el('button', { class: 'btn', onclick: () => { seedIn.value = ++seed; load(); } }, 'next seed'),
    H.slider('speed ', 2, 60, 1, speed, v => { speed = v; if (timer) play(); }, v => v + '/s'),
    H.el('label', {}, chk, 'value heatmap')), H.el('div', { class: 'row', style: 'align-items:flex-start' }, cv, info));
  load();
};

</script>
<script>
// ---------- render markdown + math + widgets + quizzes ----------
(() => {
  const doc = document.getElementById('doc');
  const fm = MD.match(/^---\n([\s\S]*?)\n---\n/);
  const meta = {};
  if (fm) fm[1].split('\n').forEach(l => { const m = l.match(/^(\w+):\s*"?(.*?)"?$/); if (m) meta[m[1]] = m[2]; });
  let md = fm ? MD.slice(fm[0].length) : MD;
  const blocks = [];
  md = md.replace(/```(widget|quiz)\n([\s\S]*?)```/g, (_, kind, body) => { blocks.push({ kind, body: body.trim() }); return `\n<div class="blk" data-i="${blocks.length - 1}"></div>\n`; });
  const maths = [];
  const keep = (m, d) => { maths.push({ m, d }); return `@@M${maths.length - 1}@@`; };
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true)).replace(/\$([^$\n]+?)\$/g, (_, m) => keep(m, false));
  const tex = (m, d) => window.katex ? katex.renderToString(m, { displayMode: d, throwOnError: false }) : `<code>${m}</code>`;
  const inlineMath = t => t.replace(/\$([^$\n]+?)\$/g, (_, m) => tex(m, false));
  let html = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, '&lt;')}</pre><p class="err">marked.js did not load (offline?)</p>`;
  html = html.replace(/@@M(\d+)@@/g, (_, i) => tex(maths[i].m, maths[i].d));
  doc.innerHTML = `<header><h1 class="doc">${meta.title || ''}</h1><div class="subtitle">${meta.subtitle || ''}</div></header>` + html;

  doc.querySelectorAll('.blk').forEach(div => {
    const b = blocks[+div.dataset.i];
    if (b.kind === 'widget') {
      const box = H.el('div', { class: 'widget' });
      div.replaceWith(box);
      try { (WIDGETS[b.body] || (() => { throw new Error('no widget ' + b.body); }))(box, RESULTS, window.SnakeCore, H); }
      catch (e) { box.append(H.el('div', { class: 'err' }, String(e.stack || e))); }
    } else {
      const q = { opts: [] };
      b.body.split('\n').forEach(l => {
        if (l.startsWith('Q:')) q.q = l.slice(2).trim();
        else if (/^- \[( |x)\]/.test(l)) q.opts.push({ t: l.slice(6).trim(), ok: l[3] === 'x' });
        else if (l.startsWith('Why:')) q.why = l.slice(4).trim();
      });
      const box = H.el('div', { class: 'quiz' }, H.el('h4', {}, 'Self-check'));
      const p = H.el('p', {}); p.innerHTML = inlineMath(q.q); box.append(p);
      q.opts.forEach(o => {
        const btn = H.el('button', {}); btn.innerHTML = inlineMath(o.t);
        btn.onclick = () => { btn.classList.add(o.ok ? 'right' : 'wrong'); if (o.ok) box.classList.add('done'); };
        box.append(btn);
      });
      const why = H.el('div', { class: 'why' }); why.innerHTML = '<b>Why:</b> ' + inlineMath(q.why || ''); box.append(why);
      div.replaceWith(box);
    }
  });

  const toc = document.getElementById('toc');
  toc.append(H.el('div', { class: 'title' }, meta.title || 'Contents'));
  const hs = [...doc.querySelectorAll('main h1:not(.doc)')];
  hs.forEach((h, i) => { h.id = 's' + i; const a = H.el('a', { href: '#s' + i }, h.textContent); toc.append(a); });
  const links = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    let k = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) k = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === k));
  });
})();
</script>
