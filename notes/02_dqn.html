# Summary

Tryout 01 showed that the algorithm wasn't the bottleneck; the observation was. Tryout 02 keeps Q-learning and changes two things:

1. **The state is the whole board.** It is a 4-channel 14×14 image: body recency, head, food, and the wall ring. The agent can finally see where its body is.
2. **The table becomes a neural network.** It is a small CNN with about 0.32 M parameters, trained with the two stabilisers from Mnih et al. (2015): an experience replay buffer and a target network. It also uses Double-DQN targets (van Hasselt et al., 2016).

The environment runs as 128 games stepped together as tensors on the GPU, and the replay buffer lives there too. The benchmark section measures where the GPU helps on this machine and where the CPU wins.

All numbers in this note come from `results.json`, which `python/train_dqn.py` writes (these runs: a laptop with a GTX 1650 Ti). If a figure below is empty, the run hasn't been done yet.

```

# 1. From a table to a function

A table stores one number per (state, action). With the board as the state, that is hopeless: there are astronomically many board configurations. **Function approximation** replaces the table with $Q_\theta(s,a)$, a network with parameters $\theta$, and the network generalises across states that look alike.

Semi-gradient Q-learning minimises the squared TD error with the target held fixed:

$$
L(\theta) = \mathbb{E}_{(s,a,r,s')}\Big[\big(\underbrace{r + \gamma \max_{a'} Q_{\bar\theta}(s',a')}_{y,\ \text{treated as a constant}} - Q_\theta(s,a)\big)^2\Big],
\qquad
\nabla_\theta L = -2\,\mathbb{E}\big[(y - Q_\theta(s,a))\,\nabla_\theta Q_\theta(s,a)\big].
$$

This is *not* the gradient of any fixed objective. The target $y$ depends on $\theta$ too, and we ignore that dependence, hence "semi-gradient" (Sutton & Barto, 2018, §9.3). With a table, the update reduces exactly to tryout 01's rule, where $\nabla_\theta Q$ is a one-hot vector.

**The deadly triad** (Sutton & Barto, 2018, §11.3). Combining

1. function approximation,
2. bootstrapping, and
3. off-policy data

can diverge even on tiny problems (Baird, 1995; Tsitsiklis & Van Roy, 1997). DQN has all three. Its engineering choices are best read as ways to keep the triad in check.

# 2. Experience replay

Consecutive Snake frames are highly correlated, and SGD assumes roughly i.i.d. samples. **Replay** (Lin, 1992) stores transitions $(s, a, r, s', \text{terminal})$ in a ring buffer and trains on uniform random minibatches from it. This does three things:

- breaks temporal correlation;
- reuses each transition many times (better sample efficiency);
- averages the behaviour policy over many past policies, which damps feedback loops.

**Replay ratio.** Each vectorised step adds 128 transitions and runs one gradient step on a batch of 512, so each transition is sampled about $512/128 = 4$ times on average while it is in the buffer.

**What's stored.** The *pre-reset* next state, `info["next_obs"]`, and `terminal`. The `truncated` flag is deliberately not stored, so timeouts still bootstrap (tryout 01, §1).

**Memory, measured rather than guessed.** Observations are stored as `uint8`. Every value in the grid is $k/255$-exact for snakes up to 255 cells. 200 k transitions × 2 observations × 784 bytes ≈ **314 MB**. That is the largest thing on the GPU; the network weights are about **1.3 MB**. The "512 MB–1 GB VRAM budget" is therefore a replay-buffer budget, not a model budget.

# 3. Target network

If $y$ uses the same $\theta$ we are updating, every step moves the target as well, and errors can chase themselves. DQN computes $y$ with a *frozen copy* $\bar\theta$, synced every 1,000 gradient steps:

$$
y = r + \gamma\,(1 - \text{terminal})\, \max_{a'} Q_{\bar\theta}(s', a').
$$

Between syncs this turns learning into a sequence of supervised regression problems against a fixed target. That is the fitted-Q-iteration view of DQN (Riedmiller, 2005).

# 4. Overestimation and Double DQN

Even if every estimate is unbiased, $Q(s',a') = q(s',a') + \epsilon_{a'}$ with $\mathbb{E}[\epsilon]=0$, the max is biased upward by Jensen's inequality:

$$
\mathbb{E}\big[\max_{a'} Q(s',a')\big] \;\ge\; \max_{a'} \mathbb{E}\big[Q(s',a')\big] = \max_{a'} q(s',a').
$$

For $m$ actions with i.i.d. noise $\mathcal{N}(0,\sigma^2)$ and equal true values, the bias is $\sigma\,\mathbb{E}[\max_i Z_i]$: about $0.85\sigma$ for $m=3$. Bootstrapping feeds that bias back into the next target.

**Double Q-learning** (van Hasselt, 2010) decouples *selecting* the action from *evaluating* it. Double DQN (van Hasselt, Guez & Silver, 2016) uses the networks DQN already has:

$$
y^{\text{Double}} = r + \gamma (1-\text{terminal})\, Q_{\bar\theta}\big(s',\ \arg\max_{a'} Q_\theta(s',a')\big).
$$

When the selection noise is independent of the evaluation noise, $\mathbb{E}[Q_{\bar\theta}(s', \hat a)] = q(s', \hat a) \le \max_a q(s',a)$. The bias is gone, and slight underestimation is the price.

```widget
overestimation
```

**Dueling heads** (Wang et al., 2016) are available with `--dueling`. They split the head into $V(s)$ and $A(s,a)$, combined as $Q = V + A - \bar A$. This helps when many states have actions of nearly equal value, which in Snake is most of open space. Tryout 03 is a good place for the ablation.

# 5. A state that can see the body

| Channel | Content | Why |
|---|---|---|
| 0 | body recency: head $=1$, …, tail $=1/L$ | shape *and* direction of motion; which cells free up soonest |
| 1 | head one-hot | makes the egocentric reference explicit |
| 2 | food one-hot | the goal |
| 3 | wall ring (padding = 1) | lets convolutions see the boundary as "body-like danger" |

The network: Conv(4→32, 3×3) → Conv(32→64, 3×3, stride 2) → Conv(64→64, 3×3, stride 2), each followed by ReLU, so the 14×14 input shrinks to 7×7 and then 4×4. Then a dense layer from 1024 to 256 with ReLU, and a final dense layer to 3 Q-values.

- **Parameters:** 319,779, of which 82% sit in the 1024→256 dense layer.
- **Receptive field:** after three 3×3 convolutions with two of stride 2, each unit sees a 9×9 window. The dense layer then combines all 4×4 positions, so the Q-values depend on the whole board.
- **Tied to board size:** the dense layer fixes the input to 12×12. A board-size-agnostic variant would end with global pooling, which is a deliberate trade-off.

**Ablation:** `--obs basic` trains the *same* DQN on tryout 01's 11 features with a 5 K-parameter MLP. If the thesis is right, it plateaus near 20, like the table. If the CNN clearly beats about 20, the improvement is attributable to the state, not to "deep RL".

# 6. Vectorised environments on the GPU, and what the GPU is actually for

`snake_rl/vec_env.py` steps N games as tensors:

- The body is an *age grid*: each body cell stores how many ticks it remains occupied. Moving decrements every cell and writes the new head; eating skips the decrement.
- Food placement reproduces the scalar engine's RNG bit for bit: mulberry32 in int64, with the "k-th free cell" found by a cumulative sum.
- `tests/test_parity.py` checks it step by step against the Python engine. That engine is in turn checked against traces from the JavaScript game.

Why bother? A small CNN at batch 1 is dominated by kernel-launch and synchronisation overhead on a GPU (tens of µs per call). The CPU often wins there. The GPU only pays off when each call carries enough work: many environments per step, and large training batches. The benchmark makes that concrete on *this* laptop.

**How to read it.**

- Compare the CUDA and CPU rows at batch 1 (the live game) and at batch 512–4096 (training).
- For the 5 K-parameter MLP, expect the CPU to win at small batches.
- For the CNN, expect CUDA to win from a few hundred samples per batch.
- Environment throughput on CUDA should grow almost linearly with N until the GPU saturates.

# 7. How the theory maps to the code

| Theory | Code (`python/train_dqn.py`) |
|---|---|
| ε-greedy behaviour, ε 1 → 0.02 over 40% of steps | `explore = torch.rand(n) < eps; act = torch.where(explore, random, greedy)` |
| replay buffer (Lin, 1992) | `Replay.add/sample`, uint8 on the training device |
| target $y$ with frozen $\bar\theta$ | `target(o2)`, `target.load_state_dict(net.state_dict())` every 1,000 updates |
| Double DQN | `a2 = net(o2).argmax(1); q2 = target(o2).gather(1, a2)` |
| terminal vs truncated | `y = r + γ(1 − term)·q2`; `trunc` is not stored as terminal |
| Huber loss (Mnih et al., 2015) | `F.smooth_l1_loss(q, y)`, gradients clipped at norm 10 |
| evaluation protocol | greedy on the same 500 *test* seeds as tryout 01; "best" chosen on 200 separate *validation* seeds |

**Analysis.** The run shown above is the repaired setup trained for 5 M steps (`dqn_cnn_12x12_long`; the first, failed run is §8b). The four questions, in order:

1. **Does the CNN beat the tabular agent and the greedy heuristic (both about 20)?** Marginally, and not reliably. The best checkpoint by validation score (epoch 65, validation 24.6) has test mean **24.5**, median 26, p90 37, max 45. But the last eight checkpoints on the test seeds read 24.5, 21.3, 19.0, 21.6, 22.3, 18.5, 16.9, 24.9: mean 21.1, spread about ±2.7. The best-checkpoint number is a maximum over 20 noisy evaluations, so it is optimistic; the honest summary is "about 21, roughly level with tabular and the MLP (20.9)", on one training seed. The spread between three seeds at 1 M steps (§8b: 14.3 to 18.2) is of the same size as the gap to 20.
2. **Did the cause of death shift away from self-collision?** No, it grew. At the best checkpoint 443 of 500 games end by self-collision, 39 by wall and 18 by timeout; timeouts fell from 357 of 500 at 0.5 M steps to under 50. The agent stopped circling and walling itself in early but still traps itself once the body is long. Winning (filling all 144 cells) never happened; the best fill reached 33–36% of the board.
3. **Did Q-values blow up?** No. The mean Q of the sampled action rose from about 0 to 6 by epoch 80 and then stayed flat at 6.0–6.3, while the Huber loss settled near 0.1. No sign of divergence or of the deadly triad at this scale. (Q is a discounted value, so it is not directly comparable to the food count.)
4. **Is the best checkpoint the last one?** No. The best by validation is epoch 65 of 100; the final epoch 100 scored 24.9 on test but 23.4 on validation, and epochs 90 and 95 dipped to 18.5 and 16.9. With a constant learning rate and no target-network or learning-rate decay, the policy keeps wandering at roughly the same level between checkpoints. A learning-rate schedule, or averaging evaluations over several checkpoints, would make the late-training curve smoother; neither is implemented.

# 8b. The first CNN run failed: diagnosis, and reward shaping

The first 1 M-step run (CPU and, identically, CUDA) did **not** learn: mean food 0.15 → 0.9, loss ≈ 0.002, $Q \approx 0$, against about 20 for the tabular agent. A failed run is useful data, so it is kept here.

## What the logs said

| Evidence | Reading |
|---|---|
| CPU and CUDA runs show the same curve, 7 656 gradient updates in 1 M env steps | Not a device bug. Same algorithm, same failure. |
| Greedy evaluation: 500 of 500 games end by `timeout` | The greedy policy circles until the starvation limit. Circling is safe, and nothing in the reward punishes it. |
| 7 656 updates ÷ 1 000 (`--target-every`) = **7 target-network syncs** | Bootstrapping advanced about 7 steps of horizon in total. The $+1$ for food could not propagate back more than a few steps. |
| Same code, `--obs basic` (11-feature MLP): test mean **20.9** at epoch 10 | The replay, target network, Double-DQN and loss are correct. The problem is specific to the CNN-on-grid run. |
| CNN with 4× the updates (batch 128, 4 updates per step, target sync every 500) and 3-step returns: test mean 1.9 → 4.4 → 11.0 → **16.8**, timeouts 265 → 52 of 500 | The main cause was too few optimiser steps and too few target syncs, not the observation. |

So hypotheses 1 (too few updates) and 4 (target-network schedule) were confirmed, and 2 (the circling local optimum) was confirmed as the symptom. The weaker suspicion that the grid hides the heading (actions are relative turns and the grid has no direction plane) is **not** the main cause. It may still explain why the CNN lags the MLP.

Two implementation facts matter for any change to the reward. A starvation `timeout` is a *truncation*: the stored transition has `disc = γᵏ`, so it still bootstraps from the next state. Only a death or a win is a terminal and sets the bootstrap to 0. And the stored next state is the one *before* auto-reset.

## Potential-based shaping

Define a potential on states, $\Phi(s) = -k\,\frac{|x_h - x_f| + |y_h - y_f|}{2S}$ (Manhattan distance to the food, scaled so $\Phi \in [-k, 0]$), and add

$$F(s, s') = \gamma\,\Phi(s') - \Phi(s)$$

to the reward. A move toward the food gives $F > 0$, a move away gives $F < 0$. This is the "reward moving closer, hurt moving away" idea, in the one form that is safe.

**Theorem (Ng, Harada & Russell, 1999).** For any $\Phi$, the shaped MDP has the same optimal policies as the original one. Sketch: along any trajectory $s_0, s_1, \dots, s_T$ the shaping terms telescope,

$$\sum_{t=0}^{T-1}\gamma^t F(s_t, s_{t+1}) = \sum_{t=0}^{T-1}\gamma^t\bigl(\gamma\Phi(s_{t+1}) - \Phi(s_t)\bigr) = \gamma^T\Phi(s_T) - \Phi(s_0).$$

Taking the expectation of the shaped return from $(s, a)$ gives $Q'(s,a) = Q(s,a) - \Phi(s)$, because $\Phi(s_0)$ does not depend on the action and $\gamma^T\Phi(s_T) \to 0$ (or is 0 by choice at a terminal). Subtracting a function of $s$ alone from every action's value leaves the $\arg\max_a$ unchanged. $\blacksquare$

The conditions that make the proof go through are exactly the implementation details:

- $\Phi(\text{terminal}) = 0$ for death and for a win. Otherwise the telescoping leaves a $\gamma^T\Phi(s_T)$ that depends on where the snake died and biases the policy.
- After eating, $s'$ contains the **new** food, so $\Phi(s')$ is measured to the new food. The snake is not rewarded for "arriving" at food that has just vanished.
- A timeout is not a terminal. $s'$ is a real state, so $\Phi(s')$ is kept and bootstrapping continues.
- $\gamma$ in $F$ must be the training $\gamma$.

`python/tests/test_env.py` checks the telescoping identity on a real trajectory ($\sum\gamma^tF = -\Phi(s_0)$ when the episode ends in death) and that the torch vec env and the scalar engine give the same shaped rewards.

## Why the naive version is not safe

"+$c$ if closer, $-c$ if farther" is not of the form $\gamma\Phi(s') - \Phi(s)$, so none of the above applies. The sign of the reward depends only on the distance to the food, never on whether the move is wise:

- **Bias.** A long snake often *must* move away from the food to avoid sealing itself in. Naive shaping charges a fee for every such detour, so the optimum of the shaped problem is a more reckless snake than the true optimum. With $\gamma\Phi$ the same detour is repaid when the snake comes back, because the telescoped total is path-independent.
- **Exploitable loops.** A reward that depends on the sign of a distance change, with no discount-consistent offset, can pay differently on the approach and on the retreat of the same cycle (for example when the food moves or the path is asymmetric). The agent will find whichever cycle pays most.
- **Scale.** $\pm 1$ per move would dominate the food reward ($+1$) over a ten-step approach. The runs below use $c = 0.1$, which is already large next to the potential's per-step change of about $k/(2S) = 0.04$.

## The timeout loophole is a different fix

Potential shaping preserves the optimal policy, so it **cannot** by itself remove an optimum that the original reward already allows: with a reward of 0 per step and $-1$ for death, circling forever has value 0 and is a legitimate local optimum. Closing that loophole means deliberately changing the task. The fourth arm adds a reward of $-1$ on a starvation timeout (`--timeout-penalty 1`). That is a change of problem, not a shaping term, and the notes keep the two ideas separate.

## Ablation

Four arms on CUDA, same seed, 1 M env steps, CNN on the grid, the same repaired training setup (32 envs, batch 128, 4 updates per env step, target sync every 500 updates, 3-step returns, Double DQN). Only the reward differs. Test mean is over the 500 held-out seeds, for the checkpoint with the best validation score.

| # | Reward | Test mean | Median | p90 | Max | Deaths (wall / self / timeout, of 500) |
|---|---|---|---|---|---|---|
| 1 | baseline ($+1$ food, $-1$ death) | **16.83** | 18 | 29 | **36** | 112 / 336 / 52 |
| 2 | naive $\pm 0.1$ per move | 12.99 | 14 | 19 | 24 | 48 / 397 / 55 |
| 3 | potential, $k = 1$ | 11.63 | 13 | 19 | 26 | 56 / 351 / 93 |
| 4 | potential, $k = 1$, timeout $-1$ | 12.26 | 14 | 20 | 25 | 73 / 329 / 98 |

Learning curves (test mean at epochs 5, 10, 15, 20, i.e. every 250 k steps):

| # | 0.25 M | 0.50 M | 0.75 M | 1.0 M |
|---|---|---|---|---|
| 1 baseline | 1.8 | 4.4 | 11.0 | 16.8 |
| 2 naive | 2.5 | 8.2 | 13.0 | 12.5 |
| 3 potential | 1.7 | 4.6 | 10.0 | 11.6 |
| 4 potential + timeout | 1.6 | 4.8 | 11.1 | 12.3 |

**Reading, with the caveats up front.** This is **one seed per arm**, and between-run spread in this kind of training is often several points, so differences of 1–4 points here are not established.

- Once the update schedule is repaired, **shaping did not help within 1 M steps**. The baseline is the best arm at the end.
- Naive shaping learned fastest early (8.2 at 0.5 M against 4.4), consistent with a denser signal, and then stalled and drifted down (13.0 → 12.5). Its deaths shifted from wall to self-collision (397 of 500), which fits the bias argument: the agent is paid to chase the food and does not plan around its own tail. One seed cannot prove that mechanism.
- Potential shaping did not speed up early learning in this run. The potential's per-step reward ($\le 0.04$) is small next to the noise in the Q-estimates at this stage, so its effect would show up later, if at all.
- The timeout penalty did not reduce timeouts (98 against 93 for arm 3). Timeouts were already falling in every arm as the policy improved (baseline: 265 → 52), so the loophole shrinks as a side effect of learning to eat, without the penalty.
- The larger lever by far was the update schedule, not the reward: the same reward went from a test mean under 1 to 16.8.

**More seeds, baseline against potential only** (same 1 M-step setup; test mean of the best checkpoint):

| Seed | 1 baseline | 3 potential, $k = 1$ |
|---|---|---|
| 0 | 16.83 | 11.63 |
| 1 | 18.23 | 12.16 |
| 2 | 14.30 | 11.37 |
| mean | **16.45** | 11.72 |

The baseline is ahead in all three seeds (by 5.2, 6.1 and 2.9 points), and the ranges do not overlap (14.3 to 18.2 against 11.4 to 12.2). Three seeds is still modest evidence, but it supports the reading that, here, potential shaping with $k = 1$ slowed learning within 1 M steps instead of speeding it up. That does not contradict the theory: shaping keeps the optimum, it does not promise faster learning, and a poorly scaled $\Phi$ adds noise to the targets.

Not run: other values of $k$, annealing $k \to 0$ (`--shape-anneal` is implemented), shaping on the 5 M-step run, and the naive and timeout arms on more seeds (those two rest on a single seed).

# 10. Failure modes to watch for

- **Divergence.** Q-values grow without bound and the loss spikes after a target sync. Remedies: lower the learning rate, sync the target less often, use Huber loss, clip gradients.
- **Catastrophic forgetting.** Once the agent is good, the buffer fills with long late-game episodes and early-game skills decay. Watch for test scores that rise and then fall.
- **Looping.** A cautious agent circles forever. Timeouts cut this off as truncation, which is correct, but a high timeout rate means the agent is valuing safety over food. Reward shaping or a smaller γ can trade this off.
- **Overfitting to seeds.** Training uses millions of distinct food sequences, so this is unlikely. That is still why test and validation seeds are disjoint.

# Self-check

```quiz
Q: Why does DQN compute the TD target with a separate, periodically copied network?
- [ ] To halve GPU memory
- [x] So the regression target does not move with every gradient step, which stabilises bootstrapping with function approximation
- [ ] Because the online network cannot evaluate s'
Why: With function approximation a single update changes Q everywhere, including at s'. A frozen target turns each sync interval into an ordinary regression problem (fitted Q-iteration).
```

```quiz
Q: Each Q estimate for 3 actions has zero-mean noise. Why is r + γ·max Q(s',·) biased upward?
- [ ] Because γ < 1
- [x] E[max of noisy estimates] ≥ max of their means (Jensen), and bootstrapping propagates the excess
- [ ] Because rewards are positive
Why: The max preferentially picks whichever estimate got lucky. Double DQN selects with one network and evaluates with the other, so the selection's luck is not reused in the evaluation.
```

```quiz
Q: On a GTX 1650 Ti, which is most likely faster for choosing ONE action with a 5 K-parameter MLP?
- [x] CPU (PyTorch with 1 thread, or ONNX Runtime)
- [ ] CUDA, because GPUs are always faster for neural networks
- [ ] It makes no difference
Why: At batch 1 the work is a few thousand multiply-adds. GPU time is dominated by kernel launches, synchronisation and host-device copies, so the CPU finishes before the GPU has started. The benchmark in §6 measures this on your laptop.
```

      const [dx, dy] = DIRS[this.dir];
      const nx = this.body[0][0] + dx, ny = this.body[0][1] + dy;
      this.steps++; this.sinceFood++;

      if (this.blocked(nx, ny)) {

        this.cause = (nx < 0 || ny < 0 || nx >= this.w || ny >= this.h) ? 'wall' : 'self';
        return { reward: -1, terminated: true, truncated: false, event: this.cause };

      if (!eating) {

        this.occ[t[1] * this.w + t[0]] = 0;
      }
      this.body.unshift([nx, ny]);
      this.occ[ny * this.w + nx] = 1;

      if (eating) {
        this.score++; this.sinceFood = 0;
        if (this.body.length === this.w * this.h) {
          this.done = true; this.won = true; this.food = null; this.cause = 'win';
          return { reward: 1, terminated: true, truncated: false, event: 'win' };
        }
        this.placeFood();
        return { reward: 1, terminated: false, truncated: false, event: 'food' };
      }
      // Truncation, not termination: the state isn't terminal, we just stop a looping agent.
      // Learners must still bootstrap through it (Pardo et al. 2018).
      if (this.sinceFood > this.idleLimit * this.body.length) {
        this.done = true; this.cause = 'timeout';
        return { reward: 0, terminated: false, truncated: true, event: 'timeout' };
      }
      return { reward: 0, terminated: false, truncated: false, event: null };
    }

    // Human input is absolute (arrow keys); agents act relative. Reversal maps to straight.
    relativeFromAbsolute(absDir) {
      const d = (absDir - this.dir + 4) % 4;
      return d === 1 ? ACTIONS.RIGHT : d === 3 ? ACTIONS.LEFT : ACTIONS.STRAIGHT;
    }
  }

  // ---- features (mirror: python/snake_rl/features.py) ----

  // 11 binary features: danger [straight, right, left], heading one-hot [R, D, L, U], food [left, right, up, down].
  function basicFeatures(g) {
    const [hx, hy] = g.body[0];
    const f = new Array(11).fill(0);
    const rel = [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4];
    for (let i = 0; i < 3; i++) { const [dx, dy] = DIRS[rel[i]]; f[i] = g.blocked(hx + dx, hy + dy) ? 1 : 0; }
    f[3 + g.dir] = 1;
    if (g.food) {
      f[7] = g.food[0] < hx ? 1 : 0; f[8] = g.food[0] > hx ? 1 : 0;
      f[9] = g.food[1] < hy ? 1 : 0; f[10] = g.food[1] > hy ? 1 : 0;
    }
    return f;
  }

  function basicStateIndex(g) {
    const f = basicFeatures(g);
    let s = 0;
    for (let i = 0; i < 11; i++) s |= f[i] << i;
    return s;
  }

  // Free area reachable from (sx,sy), tail counted as free. Approximate (the body moves while you
  // travel) but it is exactly the signal the 11 features lack: "will this move trap me?".
  function reachable(g, sx, sy) {
    if (g.blocked(sx, sy)) return 0;
    const seen = new Uint8Array(g.w * g.h);
    const stack = [[sx, sy]]; seen[sy * g.w + sx] = 1; let n = 0;
    while (stack.length) {
      const [x, y] = stack.pop(); n++;
      for (const [dx, dy] of DIRS) {
        const ax = x + dx, ay = y + dy;
        if (ax < 0 || ay < 0 || ax >= g.w || ay >= g.h) continue;
        const k = ay * g.w + ax;
        if (seen[k] || g.blocked(ax, ay)) continue;
        seen[k] = 1; stack.push([ax, ay]);
      }
    }
    return n;
  }

  // 15 features: basic 11 + reachable-area fraction for [straight, right, left] + length fraction.
  function extendedFeatures(g) {
    const f = basicFeatures(g);
    const [hx, hy] = g.body[0];
    const area = g.w * g.h;
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const [dx, dy] = DIRS[d];
      f.push(reachable(g, hx + dx, hy + dy) / area);
    }
    f.push(g.body.length / area);
    return f;
  }

  // Grid observation for the CNN agents, shape (4, h+2, w+2), flattened channel-major like PyTorch.
  // ch0 body recency (head 1 → tail 1/L, so heading is visible), ch1 head, ch2 food, ch3 wall ring.
  // Mirror: python/snake_rl/features.py::grid_obs and vec_env.py::_obs.
  function gridObservation(g) {
    const W = g.w + 2, H = g.h + 2, plane = W * H;
    const x = new Float32Array(4 * plane);
    const L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * W + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * W + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * W + g.food[0] + 1] = 1;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      if (r === 0 || c === 0 || r === H - 1 || c === W - 1) x[3 * plane + r * W + c] = 1;
    return { data: x, shape: [4, H, W] };
  }

  // Tryout 05 observation: a fixed 14x14 canvas (board at offset 1, everything outside is wall) so one network plays every
  // board up to 12x12. Channels: 0 tail order (age/length), 1 head, 2 food, 3 wall, 4 length/cells, 5 (win6) reachable area.
  // Mirrors python/snake_rl/features.py::win_obs and TorchSnakeVecEnv._win.
  function gridObservationWin(g, reach) {
    const C = 14, S = g.w, plane = C * C, nch = reach ? 6 : 5, x = new Float32Array(nch * plane), L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * C + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * C + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * C + g.food[0] + 1] = 1;
    for (let r = 0; r < C; r++) for (let c = 0; c < C; c++) x[3 * plane + r * C + c] = (r >= 1 && r <= S && c >= 1 && c <= S) ? 0 : 1;
    for (let r = 1; r <= S; r++) for (let c = 1; c <= S; c++) x[4 * plane + r * C + c] = L / (S * S);
    if (reach) {
      const seen = new Uint8Array(S * S), stack = [[g.body[0][0], g.body[0][1]]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        for (const [dx, dy] of DIRS) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && ny >= 0 && nx < S && ny < S && !g.occ[ny * S + nx] && !seen[ny * S + nx]) { seen[ny * S + nx] = 1; stack.push([nx, ny]); }
        }
      }
      for (let i = 0; i < S * S; i++) if (seen[i]) x[5 * plane + (Math.floor(i / S) + 1) * C + (i % S) + 1] = 1;
    }
    return { data: x, shape: [nch, C, C] };

  // "Trap" mask (tryout 05): [straight, right, left] -> true if the move kills at once OR leads into a region too small for the snake.
  // Time-aware flood fill: a body cell can be entered at move m once its age <= m (the tail keeps freeing cells); K = cells/2 + 2
  // expansions; trap when the reachable area < length (+1 if the move eats). If every move is a trap only instant deaths are
  // blocked. Mirrors python/snake_rl/features.py::trap_danger and TorchSnakeVecEnv.danger_trap.
  function trapDanger(g) {
    const S = g.w, L = g.body.length, age = new Map(), key = (x, y) => y * S + x;
    g.body.forEach(([bx, by], i) => age.set(key(bx, by), L - i));
    const [hx, hy] = g.body[0], inst = [], areas = [], cands = [];
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
      const dead = nx < 0 || ny < 0 || nx >= S || ny >= S || (age.get(key(nx, ny)) || 0) > 1;
      inst.push(dead); cands.push([nx, ny]);
      if (dead) { areas.push(0); continue; }
      let reach = new Set([key(nx, ny)]);

    let ok = [0, 1, 2].map(j => !(inst[j] || trap[j]));

  // Non-RL reference: follow a Hamiltonian cycle of the board. Visits every cell once, so the snake can never trap itself and
  // fills the board on every seed. Even square boards of at least 6x6 (the start body must lie on the cycle).
  const HAM = {};
  function hamCycle(S) {

    if (S % 2 || S < 6) throw new Error('the Hamiltonian-cycle agent needs an even board of at least 6x6');
    const cyc = [];
    for (let x = 0; x < S; x++) cyc.push([x, 0]);
    for (let r = 1; r < S; r++) { if (r % 2) for (let x = S - 1; x > 0; x--) cyc.push([x, r]); else for (let x = 1; x < S; x++) cyc.push([x, r]); }
    for (let y = S - 1; y > 0; y--) cyc.push([0, y]);
    const c = S / 2, k = cyc.findIndex(q => q[0] === c && q[1] === c), nx = cyc[(k + 1) % cyc.length];
    if (!(nx[0] === c + 1 && nx[1] === c)) cyc.reverse();

    const { cyc, pos } = hamCycle(g.w), [hx, hy] = g.body[0], [nx, ny] = cyc[(pos.get(hx + ',' + hy) + 1) % cyc.length];
    const d = DIRS.findIndex(v => v[0] === nx - hx && v[1] === ny - hy), rel = (d - g.dir + 4) % 4;
    return rel === 0 ? 0 : rel === 1 ? 1 : 2;

  // Minimal NCHW inference for exported CNN/MLP models (layers written by python/export_model.py).
  function runLayers(layers, inp) {

        const Ho = Math.floor((H + 2 * p - k) / s) + 1, Wo = Math.floor((W + 2 * p - k) / s) + 1;

      } else if (L.op === 'relu') {

      } else if (L.op === 'flatten') {
        shape = [x.length];
      } else if (L.op === 'linear') {

        for (let o = 0; o < L.out; o++) {

          out[o] = acc;
        }

      } else if (L.op === 'dueling') {
        const v = runLayers(L.value, { data: x, shape }).data[0];
        const a = runLayers(L.adv, { data: x, shape }).data;
        const m = a.reduce((s2, t) => s2 + t, 0) / a.length;
        x = a.map(t => v + t - m); shape = [a.length];
      } else throw new Error('unknown op ' + L.op);
    }
    return { data: x, shape };
  }

  function modelInput(m, g) {
    if (m.obs === 'grid4') return gridObservation(g);
    if (m.obs === 'win5') return gridObservationWin(g, false);
    if (m.obs === 'win6') return gridObservationWin(g, true);
    const f = m.features === 'extended' ? extendedFeatures(g) : basicFeatures(g);
    return { data: Float32Array.from(f), shape: [f.length] };
  }

  // ---- policies ----

  function argmax(a) { let b = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[b]) b = i; return b; }

  const policies = {
    random: (g, rng) => rng.int(3),
    // Greedy-toward-food that avoids immediate death: the bar any learned agent has to clear.
    greedy: (g) => {
      const [hx, hy] = g.body[0];
      let best = 0, bestD = Infinity;
      for (const a of [0, 1, 2]) {
        const d = a === 0 ? g.dir : a === 1 ? (g.dir + 1) % 4 : (g.dir + 3) % 4;
        const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
        if (g.blocked(nx, ny)) continue;
        const dist = g.food ? Math.abs(nx - g.food[0]) + Math.abs(ny - g.food[1]) : 0;
        if (dist < bestD) { bestD = dist; best = a; }
      }
      return best;
    },
  };

  function mlpForward(layers, x) {
    let h = x;
    for (let l = 0; l < layers.length; l++) {
      const { w, b } = layers[l];
      const out = new Array(b.length);
      for (let i = 0; i < b.length; i++) {
        let s = b[i]; const row = w[i];
        for (let j = 0; j < h.length; j++) s += row[j] * h[j];
        out[i] = l < layers.length - 1 && s < 0 ? 0 : s; // ReLU on hidden layers only
      }
      h = out;
    }
    return h;
  }

  function policyFromModel(m) {
    // q may be a dense array or a sparse {stateIndex: [..]} map; unseen states default to 0s.
    if (m.type === 'hamiltonian') return (g) => hamiltonianAction(g);
    if (m.type === 'tabular') return (g) => argmax(m.q[basicStateIndex(g)] || [0, 0, 0]);
    if (m.type === 'mlp') {
      const feat = m.features === 'extended' ? extendedFeatures : basicFeatures;
      return (g) => argmax(mlpForward(m.layers, feat(g)));
    }
    if (m.type === 'net') {
      if (!m.mask) return (g) => argmax(Array.from(runLayers(m.layers, modelInput(m, g)).data));
      // action masking (tryout 03): never pick a move that kills on the next tick, unless every move does.
      // basicFeatures()[0..2] are the danger bits for [straight, right, left], the same action order as the net's outputs.
      return (g) => {
        const q = Array.from(runLayers(m.layers, modelInput(m, g)).data), d = m.mask === 'trap' ? trapDanger(g) : basicFeatures(g);
        let ok = [!d[0], !d[1], !d[2]];
        if (!ok.some(Boolean)) ok = [true, true, true];
        let best = -1;
        for (let i = 0; i < 3; i++) if (ok[i] && (best < 0 || q[i] > q[best])) best = i;
        return best;
      };
    }
    throw new Error('unknown model type ' + m.type);
  }

  function modelScores(m, g) {
    if (m.type === 'hamiltonian') return [0, 0, 0];
    if (m.type === 'tabular') return m.q[basicStateIndex(g)] || [0, 0, 0];
    if (m.type === 'mlp') return mlpForward(m.layers, (m.features === 'extended' ? extendedFeatures : basicFeatures)(g));
    return Array.from(runLayers(m.layers, modelInput(m, g)).data);
  }

  // ---- tabular Q-learning (mirror: python/train_tabular.py) ----

  function trainTabularQ(opts = {}) {
    const o = Object.assign({
      width: 12, height: 12, episodes: 20000, alpha: 0.1, gamma: 0.95,
      epsStart: 1.0, epsEnd: 0.01, epsDecayFrac: 0.5, seed: 1, logEvery: 250,
    }, opts);
    const q = Array.from({ length: 2048 }, () => [0, 0, 0]);
    const visits = new Uint32Array(2048);
    const rng = new Rng(o.seed ^ 0x9E3779B9);
    const g = new SnakeGame({ width: o.width, height: o.height, seed: o.seed });

      const eps = Math.max(o.epsEnd, o.epsStart - (o.epsStart - o.epsEnd) * ep / (o.episodes * o.epsDecayFrac));
      g.reset();
      let s = basicStateIndex(g);
      while (!g.done) {
        const a = rng.nextU32() / 4294967296 < eps ? rng.int(3) : argmax(q[s]);
        const r = g.step(a);
        const s2 = r.terminated ? -1 : basicStateIndex(g);
        // terminated → no bootstrap; truncated → still bootstrap (the state wasn't terminal)
        const target = r.reward + (r.terminated ? 0 : o.gamma * Math.max(...q[s2]));
        q[s][a] += o.alpha * (target - q[s][a]);
        visits[s]++; s = s2; totalSteps++;
      }
      buf.push([g.score, g.cause]);
      if ((ep + 1) % o.logEvery === 0) {
        const sc = buf.map(b => b[0]);
        log.push({
          episode: ep + 1, steps: totalSteps, eps: +eps.toFixed(3),
          mean: +(sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(3), max: Math.max(...sc),
          wall: buf.filter(b => b[1] === 'wall').length / buf.length,
          self: buf.filter(b => b[1] === 'self').length / buf.length,
          timeout: buf.filter(b => b[1] === 'timeout').length / buf.length,
        });
        buf = [];
      }
    }
    return { q, visits, log, opts: o, totalSteps };
  }

  // Greedy evaluation on held-out seeds. Optionally records one replay every k episodes.
  function evaluate(policy, { width = 12, height = 12, seeds = [], recordEvery = 0, rngSeed = 7 } = {}) {
    const rng = new Rng(rngSeed);
    const res = { scores: [], lengths: [], causes: {}, replays: [] };
    seeds.forEach((seed, i) => {
      const g = new SnakeGame({ width, height, seed });
      const actions = [];
      while (!g.done) { const a = policy(g, rng); actions.push(a); g.step(a); }
      res.scores.push(g.score); res.lengths.push(g.steps);
      res.causes[g.cause] = (res.causes[g.cause] || 0) + 1;

    });

      median: pct(0.5), p10: pct(0.1), p90: pct(0.9), max: s[s.length - 1],
      // IQM: mean of the middle 50%, robust to outliers (Agarwal et al. 2021)
      iqm: (() => { const m = s.slice(Math.floor(s.length * 0.25), Math.ceil(s.length * 0.75)); return m.reduce((a, b) => a + b, 0) / m.length; })(),

  const api = { DIRS, ACTIONS, Rng, SnakeGame, basicFeatures, basicStateIndex, extendedFeatures, reachable,
    gridObservation, gridObservationWin, hamiltonianAction, trapDanger, runLayers, modelInput, modelScores,
    argmax, policies, mlpForward, policyFromModel, trainTabularQ, evaluate };

    }
    const xt = [...new Set(series[0].x)];
    const step = Math.ceil(xt.length / 10);
    xt.forEach((v, i) => { if (i % step) return; const t = s('text', { x: X(v), y: m.t + Hh + 16, 'text-anchor': 'middle' }); t.textContent = v; svg.append(t); });
    const xl = s('text', { x: m.l + W / 2, y: h - 4, 'text-anchor': 'middle' }); xl.textContent = xlabel; svg.append(xl);
    const yl = s('text', { x: 12, y: m.t + Hh / 2, transform: `rotate(-90 12 ${m.t + Hh / 2})`, 'text-anchor': 'middle' }); yl.textContent = ylabel; svg.append(yl);
    hlines.forEach(l => {
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(l.y), y2: Y(l.y), stroke: l.color || '#999', 'stroke-dasharray': '4 4' }));
      const t = s('text', { x: m.l + 6, y: Y(l.y) - 5 }); t.textContent = l.name; svg.append(t);
    });
    series.forEach((d, k) => {
      const pts = d.x.map((x, i) => d.y[i] == null ? null : [X(x), Y(d.y[i])]).filter(Boolean);
      svg.append(s('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: d.color, 'stroke-width': 2, 'stroke-dasharray': d.dash || '' }));
      d.x.forEach((x, i) => {
        if (d.y[i] == null) return;
        const dense = d.x.length > 60;
        if (dense && i % 5) return;  // keep long curves readable; every 5th point stays hoverable
        const c = s('circle', { cx: X(x), cy: Y(d.y[i]), r: dense ? 2.5 : 4, fill: d.color });
        c.onmousemove = ev => showTip(`${d.name}\n${xlabel} ${x}: ${d.y[i]}${d.extra ? '\n' + d.extra(i) : ''}`, ev);
        c.onmouseleave = hideTip;
        svg.append(c);
      });
      const t = s('text', { x: m.l + W + 6, y: m.t + 14 + k * 16, fill: d.color }); t.textContent = '— ' + d.name; t.setAttribute('style', `fill:${d.color}`); svg.append(t);
    });
    host.append(svg);
    return svg;
  }
  // Draw a Snake board; overlay(x, y) may return a CSS colour per cell (heatmaps).
  function board(canvas, g, { cell = 22, overlay = null, label = null } = {}) {
    canvas.width = g.w * cell; canvas.height = g.h * cell;
    const c = canvas.getContext('2d');
    c.fillStyle = '#9bbc0f'; c.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const col = overlay && overlay(x, y);
      if (col) { c.fillStyle = col; c.fillRect(x * cell, y * cell, cell, cell); }
      else if ((x + y) % 2) { c.fillStyle = '#93b40f'; c.fillRect(x * cell, y * cell, cell, cell); }
      if (label) { const t = label(x, y); if (t) { c.fillStyle = '#0f380f'; c.font = '9px monospace'; c.fillText(t, x * cell + 2, y * cell + cell - 4); } }
    }
    if (g.food) { c.fillStyle = '#0f380f'; const p = cell * 0.28; c.fillRect(g.food[0] * cell + p, g.food[1] * cell + p, cell - 2 * p, cell - 2 * p); }
    g.body.forEach(([x, y], i) => { c.fillStyle = i ? '#306230' : '#0f380f'; c.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2); });
  }
  const heat = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1))); return `rgba(${Math.round(220 - 190 * t)},${Math.round(70 + 120 * t)},${Math.round(60 + 30 * t)},0.85)`; };
  return { el, slider, lineChart, board, heat, showTip, hideTip, s };
})();
const WIDGETS = {};
</script>
<script>
// Interactive figures for tryout 02. Everything reads results.json written by python/train_dqn.py
// (+ results/bench/bench.json merged in as R.bench). Missing data → a clear "run it first" message.
const C2 = ['#306230', '#c27c0e', '#3a6ea5', '#9b3d8f', '#b3261e'];
const need = (host, H, cond, msg) => { if (!cond) host.append(H.el('div', { class: 'mono' }, msg)); return !cond; };

WIDGETS.summary = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Run summary'));
  if (need(host, H, R.config, 'No results yet: run  .\\run.ps1 train02  then  .\\run.ps1 notes')) return;
  const c = R.config, b = R.best, last = R.checkpoints[R.checkpoints.length - 1];
  const rows = [
    ['model', `${R.name}: ${c.params.toLocaleString()} params, ${(c.model_bytes_fp32 / 1e6).toFixed(2)} MB fp32`],
    ['device', c.device],
    ['replay buffer', `${c.buffer.toLocaleString()} transitions, ${(c.replay_bytes / 1e6).toFixed(0)} MB`],
    ['training', `${(R.epochs.at(-1)?.env_steps / 1e6).toFixed(1)} M env steps, ${c.envs} envs, batch ${c.batch}, lr ${c.lr}, γ ${c.gamma}, ${c.no_double ? 'vanilla' : 'Double'} DQN${c.dueling ? ' + dueling' : ''}`],
    ['last checkpoint (test, 500 seeds)', last ? `mean ${last.test.mean.toFixed(2)}, median ${last.test.median}, max ${last.test.max}, wins ${last.test.wins}` : '–'],
    ['best by validation', b ? `epoch ${b.epoch}: test mean ${b.test.mean.toFixed(2)}, max ${b.test.max}, wins ${b.test.wins}` : '–'],
    ['baselines (same 500 seeds)', `random ${R.baselines12.random}, greedy heuristic ${R.baselines12.greedy_heuristic}, tabular Q ${R.baselines12.tabular_q}`],
    ['throughput', R.epochs.length ? `${Math.round(R.epochs.reduce((s, e) => s + e.steps_per_s, 0) / R.epochs.length).toLocaleString()} env steps/s (avg incl. learning)` + (R.epochs.at(-1).vram_mb ? `, peak VRAM ${R.epochs.at(-1).vram_mb} MB` : '') : '–'],
  ];
  const t = H.el('table'); rows.forEach(([k, v]) => t.append(H.el('tr', {}, H.el('th', {}, k), H.el('td', {}, v)))); host.append(t);
};

WIDGETS.curves = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Learning curve: training (ε-greedy) per epoch, greedy test at checkpoints'));
  if (need(host, H, R.epochs && R.epochs.length, 'No training log yet.')) return;
  const chart = H.el('div'); host.append(chart);
  const ep = R.epochs.map(e => e.epoch);
  const cps = new Map(R.checkpoints.map(c => [c.epoch, c]));
  H.lineChart(chart, {
    series: [
      { name: 'train mean (ε-greedy)', x: ep, y: ep.map((_, i) => +R.epochs[i].train_mean.toFixed(2)), color: C2[1], dash: '4 3' },
      { name: 'TEST mean (greedy)', x: ep, y: ep.map(e => cps.has(e) ? +cps.get(e).test.mean.toFixed(2) : null), color: C2[0],
        extra: i => { const c = cps.get(ep[i]); return c ? `median ${c.test.median}, max ${c.test.max}, wins ${c.test.wins}\ndeaths ${JSON.stringify(c.test.causes)}` : ''; } },
    ],
    xlabel: 'epoch (50k env steps)', ylabel: 'score',
    hlines: [{ y: R.baselines12.greedy_heuristic, name: 'heuristic / tabular ≈ 20', color: '#b3261e' }],
  });
};

WIDGETS.checkpoint_table = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Checkpoints: every 25 epochs, greedy on 500 held-out test seeds'));
  if (need(host, H, R.checkpoints && R.checkpoints.length, 'No checkpoints yet.')) return;
  const pct = (c, k) => Math.round(100 * ((c.test.causes || {})[k] || 0) / c.test.n) + '%';
  const box = H.el('div');
  box.innerHTML = '<table><tr><th>epoch</th><th>env steps</th><th>ε</th><th>train mean (max, wins)</th><th>TEST mean</th><th>median</th><th>p90</th><th>max</th><th>wins</th><th>Δ test</th><th>wall / self / timeout</th><th>val mean</th></tr>' +
    R.checkpoints.map(c => `<tr><td>${c.epoch}</td><td>${(c.env_steps / 1e6).toFixed(2)}M</td><td>${c.eps}</td><td>${c.train_mean.toFixed(2)} (${c.train_max}, ${c.train_wins})</td>` +
      `<td><b>${c.test.mean.toFixed(2)}</b></td><td>${c.test.median}</td><td>${c.test.p90}</td><td>${c.test.max}</td><td>${c.test.wins}</td>` +
      `<td>${c.delta_test_mean == null ? '–' : (c.delta_test_mean >= 0 ? '+' : '') + c.delta_test_mean.toFixed(2)}</td><td>${pct(c, 'wall')} / ${pct(c, 'self')} / ${pct(c, 'timeout')}</td><td>${c.val_mean.toFixed(2)}</td></tr>`).join('') +
    '</table><div class="mono">win = score 141 on 12×12. Best checkpoint is chosen on validation seeds, never on test.</div>';
  host.append(box);
};

WIDGETS.loss_q = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Health checks: TD loss and mean predicted Q per epoch'));
  if (need(host, H, R.epochs && R.epochs.length, 'No training log yet.')) return;
  const a = H.el('div'), b = H.el('div'); host.append(a, b);
  const ep = R.epochs.map(e => e.epoch);
  H.lineChart(a, { series: [{ name: 'Huber TD loss', x: ep, y: R.epochs.map(e => +e.loss.toFixed(5)), color: C2[2] }], xlabel: 'epoch', ylabel: 'loss', h: 200 });
  H.lineChart(b, { series: [{ name: 'mean Q(s,a) on batches', x: ep, y: R.epochs.map(e => +e.q_mean.toFixed(3)), color: C2[3] }], xlabel: 'epoch', ylabel: 'Q', h: 200 });
  host.append(H.el('div', { class: 'mono' }, 'With γ = 0.99 and +1 per food, a policy eating every ~k steps has V ≈ 1/(1 − γ^k) − 1 … sanity-check that Q stays in that range instead of drifting upward (overestimation) or exploding (divergence).'));
};

WIDGETS.overestimation = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Monte Carlo: bias of max vs the Double estimator (true values all equal to 0)'));
  let m = 3, sigma = 1, n = 20000;
  const out = H.el('div', { class: 'mono', style: 'white-space:pre' }), chart = H.el('div');
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const draw = () => {
    let single = 0, dbl = 0;
    const hs = [], hd = [];
    for (let t = 0; t < n; t++) {
      const qa = Array.from({ length: m }, () => sigma * gauss()), qb = Array.from({ length: m }, () => sigma * gauss());
      const mx = Math.max(...qa); single += mx;
      const sel = qa.indexOf(mx); dbl += qb[sel];
      if (t < 400) { hs.push(mx); hd.push(qb[sel]); }
    }
    out.textContent = `actions m = ${m}, noise σ = ${sigma}\nE[max_a Q(a)]          = ${(single / n).toFixed(3)}   ← DQN target bias (true max = 0)\nE[Q_B(argmax_a Q_A(a))] = ${(dbl / n).toFixed(3)}   ← Double estimator`;
    const xs = Array.from({ length: 21 }, (_, i) => -3 + i * 0.3);
    const hist = arr => xs.map(x => arr.filter(v => v >= x && v < x + 0.3).length);
    H.lineChart(chart, { series: [{ name: 'max (single)', x: xs.map(x => +x.toFixed(1)), y: hist(hs), color: C2[4] }, { name: 'double', x: xs.map(x => +x.toFixed(1)), y: hist(hd), color: C2[0] }],
      xlabel: 'estimated value (σ units)', ylabel: 'count (400 draws)', h: 200 });
  };
  host.append(H.el('div', { class: 'row' }, H.slider('actions m ', 2, 20, 1, m, v => { m = v; draw(); }), H.slider('noise σ ', 0.1, 3, 0.1, sigma, v => { sigma = v; draw(); }, v => v.toFixed(1))), out, chart);
  draw();
};

WIDGETS.bench = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'CPU vs CUDA on this machine (python/bench_device.py)'));
  if (need(host, H, R.bench, 'No benchmark yet: run  .\\run.ps1 bench  then  .\\run.ps1 notes')) return;
  const B = R.bench;
  host.append(H.el('div', { class: 'mono' }, B.machine.devices.join(' | ')));
  const tbl = (rows, cols, title) => {
    const d = H.el('div'); d.innerHTML = `<p><b>${title}</b></p><table><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>` +
      rows.map(r => `<tr>${cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')}</tr>`).join('') + '</table>';
    host.append(d);
  };
  tbl(B.inference, ['model', 'params', 'device', 'threads', 'latency_us'], '1. Inference latency at batch 1 (median µs, lower is better)');
  const ts = H.el('div'); host.append(H.el('p', {}, H.el('b', {}, '2. Training step throughput (samples/s, higher is better)')), ts);
  const series = [];
  ['mlp 11→64→64→3', 'cnn 4x14x14'].forEach((m, i) => ['cpu', 'cuda'].forEach((d, j) => {
    const rows = B.train_step.filter(r => r.model === m && r.device === d);
    if (rows.length) series.push({ name: `${m.split(' ')[0]} ${d}`, x: rows.map(r => r.batch), y: rows.map(r => r.samples_per_s), color: C2[i * 2 + j], dash: d === 'cpu' ? '4 3' : '' });
  }));
  H.lineChart(ts, { series, xlabel: 'batch size', ylabel: 'samples / s' });
  tbl(B.env, ['env', 'device', 'n_envs', 'steps_per_s'], '3. Environment throughput (env steps/s, random actions)');
};

WIDGETS.replay = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Replays of the best checkpoint on test seeds (exact re-simulation)'));
  if (need(host, H, R.replays && R.replays.length, 'No replays yet.')) return;
  let k = 0, g, t = 0, timer = null, speed = 15;
  const cv = H.el('canvas'), info = H.el('div', { class: 'mono', style: 'white-space:pre' }), bars = H.el('div');
  const sel = H.el('select'); R.replays.forEach((r, i) => sel.append(H.el('option', { value: i }, `seed ${r.seed}: score ${r.score} (${r.cause})`)));
  const draw = () => {
    const r = R.replays[k], q = r.q[Math.min(t, r.q.length - 1)];
    H.board(cv, g, { cell: 22 });
    info.textContent = `seed ${r.seed}  step ${t}/${r.actions.length}  score ${g.score}  length ${g.body.length}${g.done ? '  → ' + g.cause.toUpperCase() : ''}`;
    const lo = Math.min(...q), hi = Math.max(...q);
    bars.innerHTML = ['straight', 'right', 'left'].map((n, i) => `<div class="mono">${n.padEnd(9)} <span style="display:inline-block;height:10px;width:${Math.round(10 + 150 * (q[i] - lo) / ((hi - lo) || 1))}px;background:${q[i] === hi ? '#306230' : '#bbb'}"></span> ${q[i].toFixed(3)}</div>`).join('');
  };
  const load = () => { stop(); k = +sel.value; t = 0; g = new S.SnakeGame({ width: R.replays[k].width, height: R.replays[k].height, seed: R.replays[k].seed }); draw(); };
  const tick = () => { const r = R.replays[k]; if (g.done || t >= r.actions.length) return stop(); g.step(+r.actions[t++]); draw(); };
  const stop = () => { clearInterval(timer); timer = null; };
  sel.onchange = load;
  host.append(H.el('div', { class: 'row' }, sel, H.el('button', { class: 'btn', onclick: () => { stop(); timer = setInterval(tick, 1000 / speed); } }, '▶ play'),
    H.el('button', { class: 'btn', onclick: stop }, '❚❚'), H.el('button', { class: 'btn', onclick: () => { stop(); tick(); } }, 'step'),
    H.slider('speed ', 2, 60, 1, speed, v => { speed = v; if (timer) { stop(); timer = setInterval(tick, 1000 / speed); } }, v => v + '/s')),
    H.el('div', { class: 'row', style: 'align-items:flex-start' }, cv, H.el('div', {}, info, bars)));
  load();
};

</script>
<script>
// ---------- render markdown + math + widgets + quizzes ----------
(() => {
  const doc = document.getElementById('doc');
  const fm = MD.match(/^---\n([\s\S]*?)\n---\n/);
  const meta = {};
  if (fm) fm[1].split('\n').forEach(l => { const m = l.match(/^(\w+):\s*"?(.*?)"?$/); if (m) meta[m[1]] = m[2]; });
  let md = fm ? MD.slice(fm[0].length) : MD;
  const blocks = [];
  md = md.replace(/```(widget|quiz)\n([\s\S]*?)```/g, (_, kind, body) => { blocks.push({ kind, body: body.trim() }); return `\n<div class="blk" data-i="${blocks.length - 1}"></div>\n`; });
  const maths = [];
  const keep = (m, d) => { maths.push({ m, d }); return `@@M${maths.length - 1}@@`; };
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true)).replace(/\$([^$\n]+?)\$/g, (_, m) => keep(m, false));
  const tex = (m, d) => window.katex ? katex.renderToString(m, { displayMode: d, throwOnError: false }) : `<code>${m}</code>`;
  const inlineMath = t => t.replace(/\$([^$\n]+?)\$/g, (_, m) => tex(m, false));
  let html = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, '&lt;')}</pre><p class="err">marked.js did not load (offline?)</p>`;
  html = html.replace(/@@M(\d+)@@/g, (_, i) => tex(maths[i].m, maths[i].d));
  doc.innerHTML = `<header><h1 class="doc">${meta.title || ''}</h1><div class="subtitle">${meta.subtitle || ''}</div></header>` + html;

  doc.querySelectorAll('.blk').forEach(div => {
    const b = blocks[+div.dataset.i];
    if (b.kind === 'widget') {
      const box = H.el('div', { class: 'widget' });
      div.replaceWith(box);
      try { (WIDGETS[b.body] || (() => { throw new Error('no widget ' + b.body); }))(box, RESULTS, window.SnakeCore, H); }
      catch (e) { box.append(H.el('div', { class: 'err' }, String(e.stack || e))); }
    } else {
      const q = { opts: [] };
      b.body.split('\n').forEach(l => {
        if (l.startsWith('Q:')) q.q = l.slice(2).trim();
        else if (/^- \[( |x)\]/.test(l)) q.opts.push({ t: l.slice(6).trim(), ok: l[3] === 'x' });
        else if (l.startsWith('Why:')) q.why = l.slice(4).trim();
      });
      const box = H.el('div', { class: 'quiz' }, H.el('h4', {}, 'Self-check'));
      const p = H.el('p', {}); p.innerHTML = inlineMath(q.q); box.append(p);
      q.opts.forEach(o => {
        const btn = H.el('button', {}); btn.innerHTML = inlineMath(o.t);
        btn.onclick = () => { btn.classList.add(o.ok ? 'right' : 'wrong'); if (o.ok) box.classList.add('done'); };
        box.append(btn);
      });
      const why = H.el('div', { class: 'why' }); why.innerHTML = '<b>Why:</b> ' + inlineMath(q.why || ''); box.append(why);
      div.replaceWith(box);
    }
  });

  const toc = document.getElementById('toc');
  toc.append(H.el('div', { class: 'title' }, meta.title || 'Contents'));
  const hs = [...doc.querySelectorAll('main h1:not(.doc)')];
  hs.forEach((h, i) => { h.id = 's' + i; const a = H.el('a', { href: '#s' + i }, h.textContent); toc.append(a); });
  const links = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    let k = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) k = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === k));
  });
})();
</script>
