---
title: "05 · The win challenge: can reinforcement learning fill the whole board?"
subtitle: "Curriculum learning, sparse rewards, long horizons, and a planner that never loses"
---

# Summary

Every agent so far scores around 20 on the 12×12 board. A *win* means filling all 144 cells (141 foods), and none of them has ever done it. This tryout asks whether a learned agent can win at all, how far up in board size it gets, and what separates it from a trivial planning algorithm that always wins.

**An honest framing first.** Winning Snake is a long-horizon planning problem. The reward for the final bite arrives hundreds of steps after the decisions that made it possible, and a policy that has never won has never *seen* the big reward. Pure RL on a laptop GPU is a stretch goal here. The plan is a curriculum from small boards to large ones, so there is a chance to see wins at all, and a non-RL reference (a Hamiltonian-cycle follower) to show what winning looks like.

```widget
summary
```

# 1. Why wins are hard

Three things stack up.

1. **A rare event.** A random policy essentially never fills a board. If a learner never wins, the win bonus never appears in its data, and nothing pulls it toward winning.
2. **A long horizon.** A 6×6 win takes about 300 steps; a 12×12 win takes about 4 800 (the Hamiltonian agent below needs that many). A reward arriving after $T$ steps contributes $\gamma^T R$ to the value of the start state.
3. **Credit assignment.** The mistake that dooms a long snake (coiling into a region too small to survive in) happens many steps before the death, and a cell-level mistake looks identical to a good move at the time.

## The effective horizon

With discount $\gamma$, a reward $T$ steps away is weighted by $\gamma^{T}$, and the weights sum to $1/(1-\gamma)$. That sum is the **effective horizon**: roughly how many steps ahead the agent can "see". With $\gamma = 0.99$ it is 100 steps; with $0.995$, 200; with $0.999$, 1 000.

```widget
horizon_demo
```

A win bonus of 10 after $T = 300$ steps is worth $10\cdot 0.99^{300} \approx 0.5$ at the start with $\gamma = 0.99$ but $10 \cdot 0.995^{300} \approx 2.2$ with $\gamma = 0.995$. This is why the runs here use $\gamma = 0.995$, and why a bigger $\gamma$ is not free: it also raises the variance of every return estimate, which GAE ($\lambda$) then has to control.

# 2. The setup

**Algorithm.** PPO with invalid-action masking, the fastest learner in tryout 04 (masked PPO reached a test mean above 12 within 2 M steps while unmasked PPO was still circling). It uses the batched GPU environment with 256 parallel games.

**Observation: a size-agnostic canvas.** The network sees a fixed 14×14 canvas whatever the board size; the board sits inside it and everything outside is wall. Channels:

| Channel | Meaning | Why |
|---|---|---|
| 0 | tail order: age / length, so how long until each body cell frees | the one thing the snake can *wait for*: a cell next to the tail is safe soon |
| 1 | head | |
| 2 | food | |
| 3 | wall (everything outside the board) | |
| 4 | length / number of cells, a constant plane | tells the net how crowded the board is |
| 5 | *(ablation)* cells reachable from the head through empty cells | the flood-fill feature a planner would compute |

Because the input shape never changes, **the same weights can be trained on 6×6 and then fine-tuned on 8×8, 10×10 and 12×12** (a fully convolutional net would also do this; a fixed canvas is simpler and keeps the tryout-04 architecture).

**Rewards.** +1 per food, −1 on death, and a **win bonus of 10** on filling the board. A starvation timeout stays at $100\times$length steps without food, which already scales with the snake and is far above the cycle time on these boards. A timeout remains a *truncation*, not a terminal, exactly as in tryouts 02 to 04.

# 3. Curriculum learning

Train first on a board where winning is *reachable*, then reuse the weights on a bigger one (Bengio et al. 2009; Narvekar et al. 2020 survey the RL version). Here the "task difficulty" is the board size:

$$6\times6 \;\to\; 8\times8 \;\to\; 10\times10 \;\to\; 12\times12.$$

Why it can help: on 6×6 a decent policy sees wins often enough for the win bonus to *shape* the value function; the 8×8 stage then starts from a policy that already avoids trapping itself. Why it can hurt: weights that fit a small board can encode board-size-specific shortcuts (**negative transfer**), so every stage is compared with a from-scratch control on the same board.

# 4. When learning stalls: a shield with a little planning inside

On 8×8 the plain masked agent plateaued at about 68–73% fill and **never won a single held-out game in 12 M steps**. Its deaths were almost all slow traps: the mask stops the snake from turning into a wall or its body this tick, but not from coiling into a region it cannot leave a dozen moves later. That is a planning failure, and a policy network that sees one board image per step is poorly placed to fix it.

The remedy used here is a **shield**: besides the instant-death mask, the environment also blocks a move when the snake could not survive in the region that move leads to. The check is a *time-aware flood fill* from the cell the head would enter:

* a free cell can be entered at any time; a body cell can be entered at move $m$ once its age is at most $m$ (the tail keeps freeing cells as the snake moves, so most of the body unwinds in time);
* expand the reachable set for $K = \lceil 	ext{cells}/2 
ceil + 2$ moves;
* call the move a **trap** if the reachable area is smaller than the snake's length (one more if the move eats).

If every move is a trap, only instant deaths are blocked; if every move kills, nothing is blocked. The same rule is implemented three times (vectorised on the GPU, in the scalar Python engine, and in the game's JavaScript) and the three agree on every state tested (1 315 states between the GPU version and the Python version; 417 between Python and JavaScript).

**What this means for how to read the result.** A shielded agent is *learning plus a hand-written safety check*. The network still has to learn where to go, but part of what stops it from dying is planning that the environment supplies. It is not pure RL, and the game labels these agents "+ trap shield" so nobody mistakes them for it. The comparison that matters is the same setup with and without the shield, from the same starting weights.

# 5. A planner that never loses: the Hamiltonian cycle

A **Hamiltonian cycle** visits every cell exactly once and returns to its start. A snake that simply follows one can never run into itself (the cell ahead of its head is always either empty or the tail's vacating cell) and passes through every cell, so it eats every food and fills the board, on every seed.

On an even $n\times n$ board a cycle always exists. A simple construction (used in `python/snake_rl/hamilton.py`, and mirrored in the game): run along the top row, zigzag through the remaining rows using columns $1\dots n-1$, then return up the first column.

| Board | Cells | Hamiltonian agent: wins / 500 | mean steps to win |
|---|---|---|---|
| 6×6 | 36 | 500 | about 300 |
| 8×8 | 64 | 500 | about 900 |
| 10×10 | 100 | 500 | about 2 500 |
| 12×12 | 144 | 500 | about 4 800 |

This is the **contrast between planning and learning**. The cycle agent uses the *rules of the world* (it knows the geometry exactly) and no learning at all, and it is perfect and slow (it never takes a shortcut). A learned policy gets no such prior: it has to discover the idea of "do not trap yourself" from a reward that, for a long time, says nothing about it. The agent is in the game's dropdown, clearly labelled *not RL*, as the upper bound to measure everything against. (Real strong Snake players combine the two: they follow a cycle but take *shortcuts* when they are provably safe. Learning such shortcuts on top of the cycle is a natural next experiment, not done here.)

# 6. Results

**Analysis.** All numbers are greedy play on the 500 held-out games of that board size, for the checkpoint chosen on 200 separate validation games (the choice prefers more validation wins, then a higher mean). Every run below is a **single training seed**; the win rates fluctuate by 10–20 points from one checkpoint to the next, so read them as ranges.

| Board | Agent (training) | Win rate | Mean fill | Notes |
|---|---|---|---|---|
| 6×6 | masked PPO + reachable-area channel, from scratch, 6 M steps | **97.4%** (487/500) | 98% | 92% already at 2 M steps |
| 6×6 | same without the reachable-area channel (control), 4 M steps | 83.4% (417/500) | 91% | 43% at 2 M steps |
| 8×8 | masked PPO, from scratch, 12 M steps | **88.6%** (443/500) | 91% | first wins at 4 M steps |
| 8×8 | initialised from the 6×6 agent, 12 M steps | 0.8% (4/500) | 42% | the checkpoint chosen on validation is from 2 M steps; later checkpoints fill 70–75% of the board but win 0–1 games |
| 8×8 | 6×6 start + trap shield, 8 M steps | 49.6% (248/500) | 77% | shielded, see §4 |
| 10×10 | masked PPO, from scratch, 16 M steps | 0% at the selected checkpoint (1/500 at 15 M) | 63% | best game 97 of 97 |
| 10×10 | the same run continued for 16 M more steps | **63.0%** (315/500) | 78% | 342/500 at two other checkpoints |
| 12×12 | masked PPO, from scratch, 24 M steps | 0% | 49% | best game 120 of 141 |
| 12×12 | the run above continued (extended run, stopped by the plateau rule at 135 M further steps; validation-selected checkpoint) | **68.0%** (340/500) | 85% | first win at 12.5 M further steps; 70.0% (350/500) at best on the test set |
| any | Hamiltonian cycle (not RL) | 100% | 100% | 6×6 to 12×12 |

1. **Pure reinforcement learning wins small boards reliably, and the win rate drops with the size of the board.** 97% on 6×6, 89% on 8×8, 63% on 10×10 (after 32 M steps in total), and, after the extended run described below, 68% on 12×12 (340 of 500) at the end of writing. The cost of a win grows quickly: a 12×12 win means 141 consecutive correct meals, and the training signal for the last few dozen only arrives in games that have already gone almost perfectly.
2. **The reachable-area channel matters most when training is young.** On 6×6 it roughly doubled the win rate at 2 M steps (92% against 43%) and the gap narrowed to about 10 points by 4 M (94% against 83%). It gives the network, as an input, what a planner would compute (how much free space is still connected to the head). It is information, not a rule, so the agent is still learning; it just learns faster.
3. **Starting from the smaller board hurt on 8×8 in this run.** The agent initialised from the 6×6 weights won 4 of 500 games at its validation-selected checkpoint (2 M steps) and at most one game at any later checkpoint over 12 M steps; the same recipe from scratch won 89%. A fine-tuned policy can carry habits that suit the small board (here, probably a tendency to circle) and be harder to un-learn than to never learn. This is **one seed per variant**, so it is an observation, not a finding about curricula in general; the size-agnostic canvas makes the transfer *possible*, it does not make it *useful*. The fair way to test curriculum learning would be several seeds of each, which this tryout did not run.
4. **The trap shield rescued the curriculum run but did not beat plain learning.** With the shield the 6×6 start reached about 50% on 8×8, far better than without (0.2%), yet below the from-scratch run's 89%. A hand-written safety check removes a failure the learner would otherwise have to discover (§4) at the cost of being part of the agent: the agent is not "pure RL" any more, and the game labels it so. In this experiment it did not turn out to be the best option.
5. **The remaining failures are slow traps.** On 10×10 the final deaths are 114 self-collisions, 30 wall hits and 41 timeouts out of 500; on 12×12, 428 of 500 end by self-collision. The agent usually fills most of the board and then runs out of room: the planner's guarantee, that the route can always be completed, is exactly what it lacks.
6. **More training kept paying on 10×10.** Continuing the 16 M-step run (with the learning rate restarted) took the win rate from 0–1 wins to 47–68% over the next 16 M steps, with a lot of checkpoint-to-checkpoint noise. The first run's learning rate had decayed to zero, which probably capped it.
7. **12×12 was won, after a long extension.** The 24 M-step run did not win a single held-out game (best game 120 of 141 cells). Continuing it with the same recipe, with 1 024 parallel environments instead of 256 (the throughput study in tryout 04, §8), produced the first win after 12.5 M further steps, and the win count then rose quickly:

| Further steps | Mean score | Mean fill | Best game | Wins of 500 |
|---|---|---|---|---|
| 2.5 M | 55.5 | 39% | 112 | 0 |
| 5 M | 71.9 | 51% | 123 | 0 |
| 7.5 M | 65.7 | 47% | 122 | 0 |
| 10 M | 71.4 | 51% | 128 | 0 |
| 12.5 M | 68.7 | 49% | 141 | 1 |
| 15 M | 73.8 | 52% | 141 | 3 |
| 17.5 M | 77.1 | 55% | 136 | 0 |
| 20 M | 85.0 | 60% | 141 | 26 |
| 22.5 M | 84.6 | 60% | 141 | 40 |
| 25 M | 91.9 | 65% | 141 | 112 |
| 37.5 M | 98.4 | 70% | 141 | 195 |
| 50 M | 109.2 | 77% | 141 | 258 |
| 62.5 M | 114.2 | 81% | 141 | 281 |
| 80 M | 116.3 | 83% | 141 | 312 |
| 90 M | 118.7 | 84% | 141 | 333 |
| 107.5 M | 120.1 | 85% | 141 | 350 (highest) |
| 125 M | 120.1 | 85% | 141 | 340 (published) |
| 135 M (end) | 112.7 | 80% | 141 | 303 |

This is a single run (one seed). The win rate rose quickly up to about 50 M further steps, then slowly, and from about 90 M further steps it moved between 55% and 70% from one evaluation to the next (the standard error of a win rate measured on 500 games is about 2 percentage points, and the checkpoints themselves differ, so swings of this size are partly noise and partly real changes in the policy). The plateau rule stopped the run at 135 M further steps because neither the fill (85.1% against 85.2% before) nor the win rate (68.2% against 70.0%) had gained over the last 25 M steps. The published agent is the checkpoint with the best validation score (340 of 500 test wins, 68.0%); the single best test evaluation of the run was 350 of 500 (70.0%), which is not used as the headline because choosing the maximum over 50 noisy evaluations would flatter the result. Almost all remaining failures are self-collisions after the agent has filled most of the board (140 of 500 at the published checkpoint). The full evaluation-by-evaluation table is in `docs/12x12_trajectory.md`. What it shows is that pure reinforcement learning, a masked PPO policy with a reachable-area input, *can* fill the full 12×12 board on a laptop GPU, but it took on the order of 150 M environment steps in total for about two-thirds of the games, against none at all for the Hamiltonian cycle's route to the same result (which learns nothing).

**What the Hamiltonian cycle adds to this picture.** It reaches 100% on every size with zero learning, but it takes the long way (about 4 800 steps for a 12×12 win), and it needs the rules and an even board. The learned agents are shorter and more general in what they need to be told, but they are not close to reliable beyond 8×8. Neither is "better": they answer different questions (what can be *learned* from reward, and what can be *computed* with the rules).

# 7. What to try next

* **Search on top of the learned value function** (AlphaZero-style tree search, or even a short rollout with the flood-fill check): planning supplies the lookahead that the network lacks.
* **Imitation, then RL**: pretrain on the Hamiltonian agent's trajectories (a strong, safe policy) and let RL improve on its speed.
* **Reward shaping by free area**: a potential $\Phi(s) = $ reachable-area fraction, which keeps the optimal policy (Ng et al. 1999) while rewarding the behaviour a planner would.
* **More compute**: the hardest stages are limited by training time on a 1650 Ti, not by the idea.

# 8. Failure modes to watch for

* **Win rate hides a collapse in fill.** Track mean length and fill % too, and the causes of death.
* **Catastrophic forgetting between stages**: re-evaluate the new weights on the *previous* board size.
* **A mask is not planning.** It stops instant deaths only; the main killer of long snakes is the slow trap.
* **Counting a lucky seed as a result.** The win rate is over 500 held-out seeds, and each stage has a from-scratch control.

# Self-check

```quiz
Q: With γ = 0.99 and a win bonus of 10 arriving 400 steps after a decision, roughly how much does that bonus add to the value of the decision?
- [ ] About 10
- [x] About 0.18, since 0.99^400 ≈ 0.018
- [ ] Exactly zero
Why: Rewards are weighted by γ^T. At γ = 0.99 the effective horizon is only 100 steps, so a distant bonus is almost invisible, which is why a larger γ is used for this task.
```

```quiz
Q: Why can a snake that follows a Hamiltonian cycle never trap itself?
- [ ] Because it moves very fast
- [x] The cycle visits every cell once; the snake's body always occupies a contiguous stretch of it, so the next cell is empty or the vacating tail
- [ ] Because it avoids food
Why: Knowing the whole geometry in advance is planning. The agent needs no learning, only the rules.
```

<script>
// === SNAKE CORE BEGIN ===
// Engine shared by this page, node tools (game/snake_core.js extracts this block) and, by line-for-line
// mirroring, python/snake_rl/core.py. Change a rule here → change it there; tests/test_parity.py catches drift.
(function (root) {
  'use strict';

  // Clockwise order, so "turn right" is dir+1 and "turn left" is dir+3 (mod 4). y grows downward.
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // R, D, L, U
  const ACTIONS = { STRAIGHT: 0, RIGHT: 1, LEFT: 2 };

  // mulberry32: tiny, fast, reproducible bit-for-bit in Python with 32-bit masking.
  class Rng {
    constructor(seed) { this.s = seed >>> 0; }
    nextU32() {
      this.s = (this.s + 0x6D2B79F5) >>> 0;
      let t = this.s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return (t ^ (t >>> 14)) >>> 0;
    }
    // Integer maths, not float, so Python computes the identical index (u*n < 2^53 always here).
    int(n) { return Math.floor(this.nextU32() * n / 4294967296); }
  }

  class SnakeGame {
    constructor({ width = 12, height = 12, seed = 0, idleLimit = 100 } = {}) {

      this.rng = new Rng(seed);
      this.occ = new Uint8Array(width * height);

    }

    // reset(seed) restarts the RNG; reset() continues the stream (what auto-reset in the vec env does).
    reset(seed) {

      this.occ.fill(0);

      this.dir = 0;
      this.score = 0; this.steps = 0; this.sinceFood = 0;
      this.done = false; this.won = false; this.cause = null;

    }

    placeFood() {

      for (let y = 0; y < this.h; y++)

      this.food = free.length ? free[this.rng.int(free.length)] : null;
    }

    // The tail cell vacates on this tick, so it is not an obstacle. Food never sits on the body,
    // so "moving into the tail while eating" can't happen and needs no special case.
    blocked(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return true;
      const t = this.body[this.body.length - 1];
      return this.occ[y * this.w + x] === 1 && !(x === t[0] && y === t[1]);
    }

    step(action) {
      if (this.done) throw new Error('step() after episode end; call reset()');
      if (action === ACTIONS.RIGHT) this.dir = (this.dir + 1) % 4;
      else if (action === ACTIONS.LEFT) this.dir = (this.dir + 3) % 4;
      const [dx, dy] = DIRS[this.dir];
      const nx = this.body[0][0] + dx, ny = this.body[0][1] + dy;
      this.steps++; this.sinceFood++;

      if (this.blocked(nx, ny)) {
        this.done = true;
        this.cause = (nx < 0 || ny < 0 || nx >= this.w || ny >= this.h) ? 'wall' : 'self';
        return { reward: -1, terminated: true, truncated: false, event: this.cause };
      }
      const eating = this.food !== null && nx === this.food[0] && ny === this.food[1];
      if (!eating) {
        const t = this.body.pop();
        this.occ[t[1] * this.w + t[0]] = 0;
      }
      this.body.unshift([nx, ny]);
      this.occ[ny * this.w + nx] = 1;

      if (eating) {
        this.score++; this.sinceFood = 0;
        if (this.body.length === this.w * this.h) {
          this.done = true; this.won = true; this.food = null; this.cause = 'win';
          return { reward: 1, terminated: true, truncated: false, event: 'win' };
        }
        this.placeFood();
        return { reward: 1, terminated: false, truncated: false, event: 'food' };
      }
      // Truncation, not termination: the state isn't terminal, we just stop a looping agent.
      // Learners must still bootstrap through it (Pardo et al. 2018).
      if (this.sinceFood > this.idleLimit * this.body.length) {
        this.done = true; this.cause = 'timeout';
        return { reward: 0, terminated: false, truncated: true, event: 'timeout' };
      }
      return { reward: 0, terminated: false, truncated: false, event: null };
    }

    // Human input is absolute (arrow keys); agents act relative. Reversal maps to straight.
    relativeFromAbsolute(absDir) {
      const d = (absDir - this.dir + 4) % 4;
      return d === 1 ? ACTIONS.RIGHT : d === 3 ? ACTIONS.LEFT : ACTIONS.STRAIGHT;
    }
  }

  // ---- features (mirror: python/snake_rl/features.py) ----

  // 11 binary features: danger [straight, right, left], heading one-hot [R, D, L, U], food [left, right, up, down].
  function basicFeatures(g) {
    const [hx, hy] = g.body[0];
    const f = new Array(11).fill(0);
    const rel = [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4];
    for (let i = 0; i < 3; i++) { const [dx, dy] = DIRS[rel[i]]; f[i] = g.blocked(hx + dx, hy + dy) ? 1 : 0; }
    f[3 + g.dir] = 1;
    if (g.food) {
      f[7] = g.food[0] < hx ? 1 : 0; f[8] = g.food[0] > hx ? 1 : 0;
      f[9] = g.food[1] < hy ? 1 : 0; f[10] = g.food[1] > hy ? 1 : 0;
    }
    return f;
  }

  function basicStateIndex(g) {
    const f = basicFeatures(g);
    let s = 0;
    for (let i = 0; i < 11; i++) s |= f[i] << i;
    return s;
  }

  // Free area reachable from (sx,sy), tail counted as free. Approximate (the body moves while you
  // travel) but it is exactly the signal the 11 features lack: "will this move trap me?".
  function reachable(g, sx, sy) {
    if (g.blocked(sx, sy)) return 0;
    const seen = new Uint8Array(g.w * g.h);
    const stack = [[sx, sy]]; seen[sy * g.w + sx] = 1; let n = 0;
    while (stack.length) {
      const [x, y] = stack.pop(); n++;
      for (const [dx, dy] of DIRS) {
        const ax = x + dx, ay = y + dy;
        if (ax < 0 || ay < 0 || ax >= g.w || ay >= g.h) continue;
        const k = ay * g.w + ax;
        if (seen[k] || g.blocked(ax, ay)) continue;
        seen[k] = 1; stack.push([ax, ay]);
      }
    }
    return n;
  }

  // 15 features: basic 11 + reachable-area fraction for [straight, right, left] + length fraction.
  function extendedFeatures(g) {
    const f = basicFeatures(g);
    const [hx, hy] = g.body[0];
    const area = g.w * g.h;
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const [dx, dy] = DIRS[d];
      f.push(reachable(g, hx + dx, hy + dy) / area);
    }
    f.push(g.body.length / area);
    return f;
  }

  // Grid observation for the CNN agents, shape (4, h+2, w+2), flattened channel-major like PyTorch.
  // ch0 body recency (head 1 → tail 1/L, so heading is visible), ch1 head, ch2 food, ch3 wall ring.
  // Mirror: python/snake_rl/features.py::grid_obs and vec_env.py::_obs.
  function gridObservation(g) {
    const W = g.w + 2, H = g.h + 2, plane = W * H;
    const x = new Float32Array(4 * plane);
    const L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * W + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * W + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * W + g.food[0] + 1] = 1;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      if (r === 0 || c === 0 || r === H - 1 || c === W - 1) x[3 * plane + r * W + c] = 1;
    return { data: x, shape: [4, H, W] };
  }

  // Tryout 05 observation: a fixed 14x14 canvas (board at offset 1, everything outside is wall) so one network plays every
  // board up to 12x12. Channels: 0 tail order (age/length), 1 head, 2 food, 3 wall, 4 length/cells, 5 (win6) reachable area.
  // Mirrors python/snake_rl/features.py::win_obs and TorchSnakeVecEnv._win.
  function gridObservationWin(g, reach) {
    const C = 14, S = g.w, plane = C * C, nch = reach ? 6 : 5, x = new Float32Array(nch * plane), L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * C + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * C + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * C + g.food[0] + 1] = 1;
    for (let r = 0; r < C; r++) for (let c = 0; c < C; c++) x[3 * plane + r * C + c] = (r >= 1 && r <= S && c >= 1 && c <= S) ? 0 : 1;
    for (let r = 1; r <= S; r++) for (let c = 1; c <= S; c++) x[4 * plane + r * C + c] = L / (S * S);
    if (reach) {
      const seen = new Uint8Array(S * S), stack = [[g.body[0][0], g.body[0][1]]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        for (const [dx, dy] of DIRS) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && ny >= 0 && nx < S && ny < S && !g.occ[ny * S + nx] && !seen[ny * S + nx]) { seen[ny * S + nx] = 1; stack.push([nx, ny]); }
        }
      }
      for (let i = 0; i < S * S; i++) if (seen[i]) x[5 * plane + (Math.floor(i / S) + 1) * C + (i % S) + 1] = 1;

    return { data: x, shape: [nch, C, C] };
  }

  // "Trap" mask (tryout 05): [straight, right, left] -> true if the move kills at once OR leads into a region too small for the snake.
  // Time-aware flood fill: a body cell can be entered at move m once its age <= m (the tail keeps freeing cells); K = cells/2 + 2
  // expansions; trap when the reachable area < length (+1 if the move eats). If every move is a trap only instant deaths are
  // blocked. Mirrors python/snake_rl/features.py::trap_danger and TorchSnakeVecEnv.danger_trap.
  function trapDanger(g) {
    const S = g.w, L = g.body.length, age = new Map(), key = (x, y) => y * S + x;
    g.body.forEach(([bx, by], i) => age.set(key(bx, by), L - i));
    const [hx, hy] = g.body[0], inst = [], areas = [], cands = [];

      const dead = nx < 0 || ny < 0 || nx >= S || ny >= S || (age.get(key(nx, ny)) || 0) > 1;
      inst.push(dead); cands.push([nx, ny]);

          for (const [dx, dy] of DIRS) {
            const qx = cx + dx, qy = cy + dy;

    let ok = [0, 1, 2].map(j => !(inst[j] || trap[j]));

    return ok.map(v => !v);
  }

  // Non-RL reference: follow a Hamiltonian cycle of the board. Visits every cell once, so the snake can never trap itself and
  // fills the board on every seed. Even square boards of at least 6x6 (the start body must lie on the cycle).
  const HAM = {};
  function hamCycle(S) {
    if (HAM[S]) return HAM[S];
    if (S % 2 || S < 6) throw new Error('the Hamiltonian-cycle agent needs an even board of at least 6x6');
    const cyc = [];
    for (let x = 0; x < S; x++) cyc.push([x, 0]);
    for (let r = 1; r < S; r++) { if (r % 2) for (let x = S - 1; x > 0; x--) cyc.push([x, r]); else for (let x = 1; x < S; x++) cyc.push([x, r]); }
    for (let y = S - 1; y > 0; y--) cyc.push([0, y]);
    const c = S / 2, k = cyc.findIndex(q => q[0] === c && q[1] === c), nx = cyc[(k + 1) % cyc.length];
    if (!(nx[0] === c + 1 && nx[1] === c)) cyc.reverse();
    const pos = new Map(); cyc.forEach((q, i) => pos.set(q[0] + ',' + q[1], i));
    return (HAM[S] = { cyc, pos });

  function hamiltonianAction(g) {
    const { cyc, pos } = hamCycle(g.w), [hx, hy] = g.body[0], [nx, ny] = cyc[(pos.get(hx + ',' + hy) + 1) % cyc.length];
    const d = DIRS.findIndex(v => v[0] === nx - hx && v[1] === ny - hy), rel = (d - g.dir + 4) % 4;
    return rel === 0 ? 0 : rel === 1 ? 1 : 2;
  }

  // Minimal NCHW inference for exported CNN/MLP models (layers written by python/export_model.py).
  function runLayers(layers, inp) {
    let x = inp.data, shape = inp.shape;
    for (const L of layers) {
      if (L.op === 'conv') {
        const [C, H, W] = shape, { cout, k, stride: s, pad: p, w, b } = L;
        const Ho = Math.floor((H + 2 * p - k) / s) + 1, Wo = Math.floor((W + 2 * p - k) / s) + 1;
        const out = new Float32Array(cout * Ho * Wo);
        for (let co = 0; co < cout; co++)
          for (let i = 0; i < Ho; i++)
            for (let j = 0; j < Wo; j++) {
              let acc = b[co];
              for (let ci = 0; ci < C; ci++)
                for (let ki = 0; ki < k; ki++) {
                  const yy = i * s + ki - p; if (yy < 0 || yy >= H) continue;
                  for (let kj = 0; kj < k; kj++) {
                    const xx = j * s + kj - p; if (xx < 0 || xx >= W) continue;
                    acc += w[((co * C + ci) * k + ki) * k + kj] * x[(ci * H + yy) * W + xx];
                  }
                }
              out[(co * Ho + i) * Wo + j] = acc;
            }
        x = out; shape = [cout, Ho, Wo];
      } else if (L.op === 'relu') {
        x = x.map(v => (v > 0 ? v : 0));
      } else if (L.op === 'flatten') {
        shape = [x.length];
      } else if (L.op === 'linear') {
        const out = new Float32Array(L.out);
        for (let o = 0; o < L.out; o++) {
          let acc = L.b[o]; const base = o * L.in;
          for (let i = 0; i < L.in; i++) acc += L.w[base + i] * x[i];
          out[o] = acc;
        }
        x = out; shape = [L.out];
      } else if (L.op === 'dueling') {
        const v = runLayers(L.value, { data: x, shape }).data[0];
        const a = runLayers(L.adv, { data: x, shape }).data;
        const m = a.reduce((s2, t) => s2 + t, 0) / a.length;
        x = a.map(t => v + t - m); shape = [a.length];
      } else throw new Error('unknown op ' + L.op);
    }
    return { data: x, shape };
  }

  function modelInput(m, g) {
    if (m.obs === 'grid4') return gridObservation(g);
    if (m.obs === 'win5') return gridObservationWin(g, false);
    if (m.obs === 'win6') return gridObservationWin(g, true);
    const f = m.features === 'extended' ? extendedFeatures(g) : basicFeatures(g);
    return { data: Float32Array.from(f), shape: [f.length] };
  }

  // ---- policies ----

  function argmax(a) { let b = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[b]) b = i; return b; }

  const policies = {
    random: (g, rng) => rng.int(3),
    // Greedy-toward-food that avoids immediate death: the bar any learned agent has to clear.
    greedy: (g) => {
      const [hx, hy] = g.body[0];
      let best = 0, bestD = Infinity;
      for (const a of [0, 1, 2]) {
        const d = a === 0 ? g.dir : a === 1 ? (g.dir + 1) % 4 : (g.dir + 3) % 4;
        const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
        if (g.blocked(nx, ny)) continue;
        const dist = g.food ? Math.abs(nx - g.food[0]) + Math.abs(ny - g.food[1]) : 0;
        if (dist < bestD) { bestD = dist; best = a; }
      }
      return best;
    },
  };

  function mlpForward(layers, x) {
    let h = x;
    for (let l = 0; l < layers.length; l++) {
      const { w, b } = layers[l];
      const out = new Array(b.length);
      for (let i = 0; i < b.length; i++) {
        let s = b[i]; const row = w[i];
        for (let j = 0; j < h.length; j++) s += row[j] * h[j];
        out[i] = l < layers.length - 1 && s < 0 ? 0 : s; // ReLU on hidden layers only
      }
      h = out;
    }
    return h;
  }

  function policyFromModel(m) {
    // q may be a dense array or a sparse {stateIndex: [..]} map; unseen states default to 0s.
    if (m.type === 'hamiltonian') return (g) => hamiltonianAction(g);
    if (m.type === 'tabular') return (g) => argmax(m.q[basicStateIndex(g)] || [0, 0, 0]);
    if (m.type === 'mlp') {
      const feat = m.features === 'extended' ? extendedFeatures : basicFeatures;
      return (g) => argmax(mlpForward(m.layers, feat(g)));
    }
    if (m.type === 'net') {
      if (!m.mask) return (g) => argmax(Array.from(runLayers(m.layers, modelInput(m, g)).data));
      // action masking (tryout 03): never pick a move that kills on the next tick, unless every move does.
      // basicFeatures()[0..2] are the danger bits for [straight, right, left], the same action order as the net's outputs.
      return (g) => {
        const q = Array.from(runLayers(m.layers, modelInput(m, g)).data), d = m.mask === 'trap' ? trapDanger(g) : basicFeatures(g);
        let ok = [!d[0], !d[1], !d[2]];
        if (!ok.some(Boolean)) ok = [true, true, true];
        let best = -1;
        for (let i = 0; i < 3; i++) if (ok[i] && (best < 0 || q[i] > q[best])) best = i;
        return best;
      };
    }
    throw new Error('unknown model type ' + m.type);
  }

  function modelScores(m, g) {
    if (m.type === 'hamiltonian') return [0, 0, 0];
    if (m.type === 'tabular') return m.q[basicStateIndex(g)] || [0, 0, 0];
    if (m.type === 'mlp') return mlpForward(m.layers, (m.features === 'extended' ? extendedFeatures : basicFeatures)(g));
    return Array.from(runLayers(m.layers, modelInput(m, g)).data);
  }

  // ---- tabular Q-learning (mirror: python/train_tabular.py) ----

  function trainTabularQ(opts = {}) {
    const o = Object.assign({
      width: 12, height: 12, episodes: 20000, alpha: 0.1, gamma: 0.95,
      epsStart: 1.0, epsEnd: 0.01, epsDecayFrac: 0.5, seed: 1, logEvery: 250,
    }, opts);
    const q = Array.from({ length: 2048 }, () => [0, 0, 0]);
    const visits = new Uint32Array(2048);
    const rng = new Rng(o.seed ^ 0x9E3779B9);
    const g = new SnakeGame({ width: o.width, height: o.height, seed: o.seed });
    const log = []; let buf = []; let totalSteps = 0;
    for (let ep = 0; ep < o.episodes; ep++) {
      const eps = Math.max(o.epsEnd, o.epsStart - (o.epsStart - o.epsEnd) * ep / (o.episodes * o.epsDecayFrac));
      g.reset();
      let s = basicStateIndex(g);
      while (!g.done) {
        const a = rng.nextU32() / 4294967296 < eps ? rng.int(3) : argmax(q[s]);
        const r = g.step(a);
        const s2 = r.terminated ? -1 : basicStateIndex(g);
        // terminated → no bootstrap; truncated → still bootstrap (the state wasn't terminal)
        const target = r.reward + (r.terminated ? 0 : o.gamma * Math.max(...q[s2]));
        q[s][a] += o.alpha * (target - q[s][a]);
        visits[s]++; s = s2; totalSteps++;
      }
      buf.push([g.score, g.cause]);
      if ((ep + 1) % o.logEvery === 0) {
        const sc = buf.map(b => b[0]);
        log.push({
          episode: ep + 1, steps: totalSteps, eps: +eps.toFixed(3),
          mean: +(sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(3), max: Math.max(...sc),
          wall: buf.filter(b => b[1] === 'wall').length / buf.length,
          self: buf.filter(b => b[1] === 'self').length / buf.length,
          timeout: buf.filter(b => b[1] === 'timeout').length / buf.length,
        });
        buf = [];
      }
    }
    return { q, visits, log, opts: o, totalSteps };
  }

  // Greedy evaluation on held-out seeds. Optionally records one replay every k episodes.
  function evaluate(policy, { width = 12, height = 12, seeds = [], recordEvery = 0, rngSeed = 7 } = {}) {
    const rng = new Rng(rngSeed);
    const res = { scores: [], lengths: [], causes: {}, replays: [] };
    seeds.forEach((seed, i) => {
      const g = new SnakeGame({ width, height, seed });
      const actions = [];
      while (!g.done) { const a = policy(g, rng); actions.push(a); g.step(a); }
      res.scores.push(g.score); res.lengths.push(g.steps);
      res.causes[g.cause] = (res.causes[g.cause] || 0) + 1;
      if (recordEvery && i % recordEvery === 0) res.replays.push({ seed, width, height, actions: actions.join(''), score: g.score });
    });
    const s = [...res.scores].sort((a, b) => a - b);
    const pct = p => s[Math.min(s.length - 1, Math.floor(p * s.length))];
    res.summary = {
      n: s.length, mean: s.reduce((a, b) => a + b, 0) / s.length,
      median: pct(0.5), p10: pct(0.1), p90: pct(0.9), max: s[s.length - 1],
      // IQM: mean of the middle 50%, robust to outliers (Agarwal et al. 2021)
      iqm: (() => { const m = s.slice(Math.floor(s.length * 0.25), Math.ceil(s.length * 0.75)); return m.reduce((a, b) => a + b, 0) / m.length; })(),
    };
    return res;
  }

  const api = { DIRS, ACTIONS, Rng, SnakeGame, basicFeatures, basicStateIndex, extendedFeatures, reachable,
    gridObservation, gridObservationWin, hamiltonianAction, trapDanger, runLayers, modelInput, modelScores,
    argmax, policies, mlpForward, policyFromModel, trainTabularQ, evaluate };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SnakeCore = api;
})(typeof self !== 'undefined' ? self : this);

// ---------- shared widget helpers ----------
const H = (() => {

  };
  const showTip = (txt, ev) => { tip.textContent = txt; tip.style.display = 'block'; tip.style.left = ev.clientX + 12 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; };

  const slider = (label, min, max, step, value, onInput, fmt = v => v) => {
    const out = el('span', { class: 'mono' }, fmt(value));
    const inp = el('input', { type: 'range', min, max, step, value });
    inp.oninput = () => { out.textContent = fmt(+inp.value); onInput(+inp.value); };
    return el('label', {}, label, inp, out);
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  // Line chart with hover. series: [{name, x:[], y:[], color, dash}]
  function lineChart(host, { series, xlabel = '', ylabel = '', w = 760, h = 300, ymin, ymax, hlines = [] }) {
    host.innerHTML = '';
    const m = { l: 48, r: 130, t: 12, b: 36 }, W = w - m.l - m.r, Hh = h - m.t - m.b;
    const xs = series.flatMap(d => d.x), ys = series.flatMap(d => d.y).filter(v => v != null).concat(hlines.map(l => l.y));
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = ymin ?? Math.min(0, ...ys), y1 = ymax ?? Math.max(...ys) * 1.08;
    const X = v => m.l + (v - x0) / (x1 - x0 || 1) * W, Y = v => m.t + Hh - (v - y0) / (y1 - y0 || 1) * Hh;
    const svg = s('svg', { viewBox: `0 0 ${w} ${h}`, width: '100%' });
    for (let i = 0; i <= 5; i++) {
      const v = y0 + (y1 - y0) * i / 5;
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(v), y2: Y(v), stroke: '#eceee8' }));
      const t = s('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = +v.toFixed(1); svg.append(t);
    }
    const xt = [...new Set(series[0].x)];
    const step = Math.ceil(xt.length / 10);
    xt.forEach((v, i) => { if (i % step) return; const t = s('text', { x: X(v), y: m.t + Hh + 16, 'text-anchor': 'middle' }); t.textContent = v; svg.append(t); });
    const xl = s('text', { x: m.l + W / 2, y: h - 4, 'text-anchor': 'middle' }); xl.textContent = xlabel; svg.append(xl);
    const yl = s('text', { x: 12, y: m.t + Hh / 2, transform: `rotate(-90 12 ${m.t + Hh / 2})`, 'text-anchor': 'middle' }); yl.textContent = ylabel; svg.append(yl);
    hlines.forEach(l => {
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(l.y), y2: Y(l.y), stroke: l.color || '#999', 'stroke-dasharray': '4 4' }));
      const t = s('text', { x: m.l + 6, y: Y(l.y) - 5 }); t.textContent = l.name; svg.append(t);
    });
    series.forEach((d, k) => {
      const pts = d.x.map((x, i) => d.y[i] == null ? null : [X(x), Y(d.y[i])]).filter(Boolean);
      svg.append(s('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: d.color, 'stroke-width': 2, 'stroke-dasharray': d.dash || '' }));
      d.x.forEach((x, i) => {
        if (d.y[i] == null) return;
        const dense = d.x.length > 60;
        if (dense && i % 5) return;  // keep long curves readable; every 5th point stays hoverable
        const c = s('circle', { cx: X(x), cy: Y(d.y[i]), r: dense ? 2.5 : 4, fill: d.color });
        c.onmousemove = ev => showTip(`${d.name}\n${xlabel} ${x}: ${d.y[i]}${d.extra ? '\n' + d.extra(i) : ''}`, ev);
        c.onmouseleave = hideTip;
        svg.append(c);
      });
      const t = s('text', { x: m.l + W + 6, y: m.t + 14 + k * 16, fill: d.color }); t.textContent = '— ' + d.name; t.setAttribute('style', `fill:${d.color}`); svg.append(t);
    });
    host.append(svg);
    return svg;
  }
  // Draw a Snake board; overlay(x, y) may return a CSS colour per cell (heatmaps).
  function board(canvas, g, { cell = 22, overlay = null, label = null } = {}) {
    canvas.width = g.w * cell; canvas.height = g.h * cell;
    const c = canvas.getContext('2d');
    c.fillStyle = '#9bbc0f'; c.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const col = overlay && overlay(x, y);
      if (col) { c.fillStyle = col; c.fillRect(x * cell, y * cell, cell, cell); }
      else if ((x + y) % 2) { c.fillStyle = '#93b40f'; c.fillRect(x * cell, y * cell, cell, cell); }
      if (label) { const t = label(x, y); if (t) { c.fillStyle = '#0f380f'; c.font = '9px monospace'; c.fillText(t, x * cell + 2, y * cell + cell - 4); } }
    }
    if (g.food) { c.fillStyle = '#0f380f'; const p = cell * 0.28; c.fillRect(g.food[0] * cell + p, g.food[1] * cell + p, cell - 2 * p, cell - 2 * p); }
    g.body.forEach(([x, y], i) => { c.fillStyle = i ? '#306230' : '#0f380f'; c.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2); });
  }
  const heat = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1))); return `rgba(${Math.round(220 - 190 * t)},${Math.round(70 + 120 * t)},${Math.round(60 + 30 * t)},0.85)`; };
  return { el, slider, lineChart, board, heat, showTip, hideTip, s };
})();
const WIDGETS = {};

WIDGETS.horizon_demo = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Discounting: how much a reward T steps away is worth now'));
  let gamma = 0.995, T = 300, bonus = 10;
  const cv = H.el('canvas', { width: 720, height: 220 }), out = H.el('div', { class: 'mono', style: 'white-space:pre' });
  const draw = () => {
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, 720, 220);
    const L = 800, X = t => 30 + t / L * 680, Y = v => 200 - v * 180;
    ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(30, 200); ctx.lineTo(710, 200); ctx.moveTo(30, 20); ctx.lineTo(30, 200); ctx.stroke();
    [[0.99, '#999'], [0.995, '#c27c0e'], [0.999, '#3a6ea5']].forEach(([g, col]) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let t = 0; t <= L; t += 4) { const x = X(t), y = Y(Math.pow(g, t)); t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
      ctx.fillStyle = col; ctx.font = '11px monospace'; ctx.fillText('γ = ' + g, 620, Y(Math.pow(g, 760)) - 4);
    });
    ctx.strokeStyle = '#306230'; ctx.lineWidth = 3; ctx.beginPath();
    for (let t = 0; t <= L; t += 4) { const x = X(t), y = Y(Math.pow(gamma, t)); t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();

  };
  host.append(H.el('div', { class: 'row' },
    H.slider('γ ', 0.95, 0.999, 0.001, gamma, v => { gamma = v; draw(); }, v => v.toFixed(3)),
    H.slider('T ', 10, 800, 10, T, v => { T = v; draw(); }, v => String(v)),

WIDGETS.win_replay = (host, R, S, H) => {

  const draw = () => { const r = R.replays[k]; H.board(cv, g, { cell: Math.max(10, Math.floor(300 / g.w)) }); info.textContent = `${r.label}\nstep ${t}/${r.actions.length}  score ${g.score}  length ${g.body.length}${g.done ? '  → ' + g.cause.toUpperCase() : ''}`; };
  const load = () => { stop(); k = +sel.value; t = 0; g = new S.SnakeGame({ width: R.replays[k].width, height: R.replays[k].height, seed: R.replays[k].seed }); draw(); };
  const tick = () => { const r = R.replays[k]; if (g.done || t >= r.actions.length) return stop(); g.step(+r.actions[t++]); draw(); };

    H.el('button', { class: 'btn', onclick: stop }, '❚❚'), H.slider('speed ', 5, 200, 5, speed, v => { speed = v; if (timer) { stop(); timer = setInterval(tick, 1000 / speed); } }, v => v + '/s')),
    H.el('div', { class: 'row', style: 'align-items:flex-start' }, cv, info));
  load();
};

  let md = fm ? MD.slice(fm[0].length) : MD;
  const blocks = [];
  md = md.replace(/```(widget|quiz)\n([\s\S]*?)```/g, (_, kind, body) => { blocks.push({ kind, body: body.trim() }); return `\n<div class="blk" data-i="${blocks.length - 1}"></div>\n`; });
  const maths = [];
  const keep = (m, d) => { maths.push({ m, d }); return `@@M${maths.length - 1}@@`; };
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true)).replace(/\$([^$\n]+?)\$/g, (_, m) => keep(m, false));
  const tex = (m, d) => window.katex ? katex.renderToString(m, { displayMode: d, throwOnError: false }) : `<code>${m}</code>`;
  const inlineMath = t => t.replace(/\$([^$\n]+?)\$/g, (_, m) => tex(m, false));
  let html = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, '&lt;')}</pre><p class="err">marked.js did not load (offline?)</p>`;
  html = html.replace(/@@M(\d+)@@/g, (_, i) => tex(maths[i].m, maths[i].d));
  doc.innerHTML = `<header><h1 class="doc">${meta.title || ''}</h1><div class="subtitle">${meta.subtitle || ''}</div></header>` + html;

  doc.querySelectorAll('.blk').forEach(div => {
    const b = blocks[+div.dataset.i];
    if (b.kind === 'widget') {
      const box = H.el('div', { class: 'widget' });
      div.replaceWith(box);
      try { (WIDGETS[b.body] || (() => { throw new Error('no widget ' + b.body); }))(box, RESULTS, window.SnakeCore, H); }
      catch (e) { box.append(H.el('div', { class: 'err' }, String(e.stack || e))); }
    } else {
      const q = { opts: [] };
      b.body.split('\n').forEach(l => {
        if (l.startsWith('Q:')) q.q = l.slice(2).trim();
        else if (/^- \[( |x)\]/.test(l)) q.opts.push({ t: l.slice(6).trim(), ok: l[3] === 'x' });
        else if (l.startsWith('Why:')) q.why = l.slice(4).trim();
      });
      const box = H.el('div', { class: 'quiz' }, H.el('h4', {}, 'Self-check'));
      const p = H.el('p', {}); p.innerHTML = inlineMath(q.q); box.append(p);
      q.opts.forEach(o => {
        const btn = H.el('button', {}); btn.innerHTML = inlineMath(o.t);
        btn.onclick = () => { btn.classList.add(o.ok ? 'right' : 'wrong'); if (o.ok) box.classList.add('done'); };
        box.append(btn);
      });
      const why = H.el('div', { class: 'why' }); why.innerHTML = '<b>Why:</b> ' + inlineMath(q.why || ''); box.append(why);
      div.replaceWith(box);
    }
  });

  const toc = document.getElementById('toc');
  toc.append(H.el('div', { class: 'title' }, meta.title || 'Contents'));
  const hs = [...doc.querySelectorAll('main h1:not(.doc)')];
  hs.forEach((h, i) => { h.id = 's' + i; const a = H.el('a', { href: '#s' + i }, h.textContent); toc.append(a); });
  const links = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    let k = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) k = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === k));
  });
})();
</script>
</body>
</html>
