title: "04 · Policy gradients and PPO on Snake (batched environments on the GPU)"
subtitle: "From REINFORCE to PPO: the maths, the code, and why an on-policy method suits an environment that runs thousands of games at once"

# Summary

Tryouts 01–03 learned a *value function* $Q(s,a)$ and acted greedily on it. This tryout learns the **policy** $\pi_\theta(a\mid s)$ directly, together with a value function that is used only to reduce variance (an *actor-critic*). The algorithm is PPO (Schulman et al. 2017) with the usual implementation details: a shared CNN trunk, generalized advantage estimation, the clipped surrogate objective, value-loss clipping, an entropy bonus, advantage normalisation and orthogonal initialisation. An optional arm adds **invalid-action masking** (Huang & Ontañón 2020).

PPO is on-policy: it learns from the data its *current* policy just produced and then discards it. That needs a lot of data and little reuse, which is the opposite of DQN's replay buffer, and it is exactly what a batched GPU environment is good at.

```

# 1. The policy gradient theorem

Let the return of a trajectory $\tau = (s_0, a_0, r_0, s_1, \dots)$ be $G(\tau) = \sum_t \gamma^t r_t$ and the objective $J(\theta) = \mathbb{E}_{\tau\sim\pi_\theta}[G(\tau)]$. The probability of a trajectory factorises into environment terms, which do not depend on $\theta$, and policy terms:

$$p_\theta(\tau) = p(s_0)\prod_t \pi_\theta(a_t\mid s_t)\, p(s_{t+1}\mid s_t, a_t).$$

Use the log-derivative trick $\nabla_\theta p = p\,\nabla_\theta \log p$:

$$\nabla_\theta J = \int \nabla_\theta p_\theta(\tau)\, G(\tau)\, d\tau = \mathbb{E}_\tau\bigl[G(\tau)\,\nabla_\theta \log p_\theta(\tau)\bigr] = \mathbb{E}_\tau\Bigl[G(\tau)\sum_t \nabla_\theta \log \pi_\theta(a_t\mid s_t)\Bigr].$$

The environment's dynamics have vanished: the gradient can be estimated from sampled games, without knowing the transition model. Because an action at time $t$ cannot affect rewards before $t$, each term can use only the *reward-to-go* $G_t = \sum_{k\ge t}\gamma^{k-t} r_k$:

$$\nabla_\theta J = \mathbb{E}\Bigl[\sum_t \nabla_\theta \log\pi_\theta(a_t\mid s_t)\; G_t\Bigr]. \qquad\text{(policy gradient theorem)}$$

**REINFORCE** is the Monte-Carlo estimate of this: play episodes, then step $\theta$ along $\sum_t G_t\nabla\log\pi(a_t|s_t)$. It is unbiased and slow, because $G_t$ is a sum of many random rewards: in Snake, one lucky meal early changes the return of every later step, and the gradient is dominated by noise.

# 2. Baselines and the advantage

Subtract anything that does not depend on the action. For any function $b(s)$,

$$\mathbb{E}_{a\sim\pi}\bigl[b(s)\,\nabla_\theta\log\pi_\theta(a\mid s)\bigr] = b(s)\sum_a \nabla_\theta \pi_\theta(a\mid s) = b(s)\,\nabla_\theta \underbrace{\textstyle\sum_a \pi_\theta(a\mid s)}_{=1} = 0,$$

so replacing $G_t$ with $G_t - b(s_t)$ leaves the expected gradient unchanged while it can shrink the variance a lot. The natural baseline is the value function $V^\pi(s)$, giving the **advantage** $A^\pi(s,a) = Q^\pi(s,a) - V^\pi(s)$: how much better this action is than the policy's average action in this state. Actions with a positive advantage get more probable, negative ones less.

# 3. Actor-critic and generalized advantage estimation

We do not know $V^\pi$, so a second head of the network, the **critic** $V_\phi(s)$, learns it by regression. Using the critic to bootstrap gives a family of advantage estimators with the TD residual $\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)$:

$$\hat A_t^{(1)} = \delta_t \;\;(\text{low variance, biased by critic errors}), \qquad \hat A_t^{(\infty)} = \sum_{l\ge 0}\gamma^l \delta_{t+l} = G_t - V(s_t)\;\;(\text{unbiased, high variance}).$$

**GAE** (Schulman et al. 2016) takes an exponentially weighted mixture of the $k$-step estimators, controlled by $\lambda\in[0,1]$:

$$\hat A_t^{\text{GAE}(\gamma,\lambda)} = \sum_{l=0}^{\infty} (\gamma\lambda)^l\,\delta_{t+l}.$$

*Derivation.* The $k$-step advantage is $\hat A_t^{(k)} = \sum_{l=0}^{k-1}\gamma^l\delta_{t+l}$ (the sum telescopes the value terms: $\hat A^{(k)}_t = -V(s_t) + r_t + \gamma r_{t+1} + \dots + \gamma^{k}V(s_{t+k})$). Weight $\hat A^{(k)}$ by $(1-\lambda)\lambda^{k-1}$:

$$(1-\lambda)\sum_{k\ge1}\lambda^{k-1}\sum_{l=0}^{k-1}\gamma^l\delta_{t+l} = (1-\lambda)\sum_{l\ge0}\gamma^l\delta_{t+l}\sum_{k\ge l+1}\lambda^{k-1} = \sum_{l\ge0}(\gamma\lambda)^l\,\delta_{t+l}.$$

$\lambda = 0$ gives the one-step TD residual, $\lambda = 1$ gives the Monte-Carlo advantage. $\lambda\approx 0.95$ is the usual compromise. In code it is a backwards recursion over the rollout, $\hat A_t = \delta_t + \gamma\lambda(1-d_t)\hat A_{t+1}$, where $d_t$ marks the end of an episode.

```

**Timeouts are not terminals.** Snake ends an episode by starvation after $100\cdot$length moves without food. That is an artefact of the time limit, not a property of the state, so the value of the state after a timeout is *not* zero. The code folds $\gamma V(s')$ into the last reward for a truncated step and then cuts the GAE trace, which is the same truncation-versus-termination rule used for DQN in tryout 02. Only deaths and wins bootstrap from zero.

# 4. From TRPO to PPO: why clip?

A policy-gradient step is only trustworthy near the policy that collected the data. Reusing a batch for several gradient steps pushes $\pi_\theta$ away from $\pi_{\theta_{\text{old}}}$, and the estimated gradient stops being valid. The surrogate objective with an importance ratio $r_t(\theta) = \pi_\theta(a_t|s_t)/\pi_{\theta_{\text{old}}}(a_t|s_t)$,

$$L^{\text{PG}}(\theta) = \mathbb{E}_t\bigl[r_t(\theta)\,\hat A_t\bigr],$$

is correct to first order at $\theta = \theta_{\text{old}}$ but unbounded away from it. TRPO (Schulman et al. 2015) maximises it subject to a trust-region constraint $\mathbb{E}[\mathrm{KL}(\pi_{\text{old}}\|\pi_\theta)] \le \delta$, which needs a second-order (conjugate-gradient) step. PPO gets a similar effect with a first-order objective by *clipping the ratio*:

$$L^{\text{CLIP}}(\theta) = \mathbb{E}_t\Bigl[\min\bigl(r_t\hat A_t,\ \operatorname{clip}(r_t,\,1-\epsilon,\,1+\epsilon)\,\hat A_t\bigr)\Bigr].$$

Reading the $\min$: for $\hat A_t>0$ the objective rises with $r_t$ only until $r_t = 1+\epsilon$, after which the gradient is zero, so there is no incentive to make a good action much more likely than it was. For $\hat A_t<0$ it stops at $r_t = 1-\epsilon$. The pessimistic $\min$ keeps the *unclipped* term when it is worse, so a policy that has moved the wrong way is still pushed back.

```widget
clip_demo
```

The clip is a heuristic, not a guarantee: a single step can still overshoot $1\pm\epsilon$, and what keeps the update safe in practice is the small number of epochs and the small learning rate. The code logs the approximate KL and the fraction of clipped samples to watch this.

# 5. The full loss and the implementation details

$$L(\theta,\phi) = -L^{\text{CLIP}} + c_v\,L^{V} - c_e\,\mathcal H[\pi_\theta].$$

| Part | What it does | Setting |
|---|---|---|
| Clipped surrogate | trust-region-like step | $\epsilon = 0.2$ |
| Value loss $L^V$ | critic regression to $\hat R_t = \hat A_t + V_{\text{old}}(s_t)$, with the new value clipped to $V_{\text{old}}\pm\epsilon$ and the *larger* of the two squared errors used | $c_v = 0.5$ |
| Entropy bonus $\mathcal H$ | keeps the policy stochastic, so it keeps exploring | $c_e = 0.01$ |
| Advantage normalisation | per-minibatch zero mean, unit variance, so the policy-gradient scale does not depend on the reward scale | on |
| Orthogonal init | gain $\sqrt2$ in the trunk, $0.01$ on the policy output (the first policy is almost uniform), $1$ on the value output | on |
| Learning rate | Adam, $2.5\cdot10^{-4}$, decayed linearly to 0 | |
| Gradient clip | global norm 0.5 | |
| Rollouts | 256 envs × 64 steps = 16 384 transitions per update, 4 epochs over 8 minibatches | |

# 6. Invalid-action masking

Snake has a rule the agent can read from the board: some moves kill at once. With masking, the logits of those moves are set to $-\infty$ before the softmax, so they have probability exactly 0:

$$\pi_\theta(a\mid s) = \operatorname{softmax}\bigl(z(s) + m(s)\bigr)_a,\qquad m_a = 0 \text{ if safe},\ -\infty \text{ otherwise}.$$

Two consequences matter. The **gradient** of a masked action's logit is zero, because its probability does not depend on it: the network is never pushed to "unlearn" a move that is not in the distribution. This is the point of Huang & Ontañón's analysis, which shows that masking is a valid policy gradient on the restricted action set, whereas penalising invalid actions with a negative reward leaves the network wasting probability on them. And the **entropy** is computed over the valid moves only. The mask must be identical in the rollout (when sampling) and in the update (when recomputing $\log\pi$): the code stores it with each transition. If every move kills, the mask is lifted.

# 7. On-policy versus off-policy, and why PPO fits this machine

|  | DQN (off-policy) | PPO (on-policy) |
|---|---|---|
| Learns from | a replay buffer of old transitions from any past policy | the last rollout, from the current policy only |
| Data reuse | each transition is replayed many times | 4 epochs, then discarded |
| Sample efficiency | higher | lower |
| Needs | a Q-function; a target network; replay | many parallel environments for a decorrelated, big batch |
| Cost per env step on this machine | one gradient step per ~8 env steps, 3 forward passes each | one forward pass; the 4 epochs of updates are amortised over 16 k steps |

The batched torch environment steps hundreds of thousands of games per second on the GPU, so *data is nearly free* and the update is the cost. That reverses the usual situation, in which the simulator is the bottleneck and sample efficiency matters most. On this machine PPO's lower sample efficiency is paid for by its higher throughput: one job runs about 7 000 env steps/s against about 900 for the DQN.

# 8. Throughput lesson: how many jobs should share one small GPU?

The obvious bottleneck for several training jobs on a 4 GB GPU looks like VRAM. It is not. Each job here holds only a few hundred MB, but a GTX 1650 Ti has few multiprocessors and the CPU cores that launch its kernels are shared, so compute saturates long before memory does, and past that point extra jobs slow each other down. The sensible way to schedule them is to *measure*: run $k = 1, 2, 3, \dots$ identical jobs, record the aggregate steps/s, GPU utilisation, memory and CPU load, and stop adding jobs when the aggregate stops rising.

**Analysis.** Two arms, three training seeds each, 10 M environment steps per run, the same 500 held-out games as every other tryout, best checkpoint chosen on 200 separate validation games.

| Arm | Seeds (test mean) | Mean ± sd | Best game | Deaths wall / self / timeout (mean of 500) |
|---|---|---|---|---|
| PPO | 21.4, 18.7, 7.9 | 16.0 ± 7.1 | 49 | 8 / 204 / 289 |
| PPO + invalid-action masking | 26.5, 26.3, 25.7 | **26.2 ± 0.4** | 51 | 20 / 404 / 76 |

1. **Masking is the difference between an unreliable agent and a reliable one.** The masked arm lands at 26.2 in all three seeds (range 25.7–26.5); the unmasked arm ranges from 7.9 to 21.4. The unmasked runs mostly fail by *circling*: 289 of 500 games end by starvation, against 76 for the masked arm. A policy that is trying to avoid walls and its own body while its probabilities are still near uniform spends many steps in loops that cost nothing, and the entropy bonus keeps it from committing out of them. The mask removes the unsafe options outright, so the policy has fewer ways to be indecisive.
2. **Masked PPO is the best learned agent on the standard 12×12 board in this repository**: 26.2 ± 0.4 (three seeds, 10 M steps) against 24.5 for the CNN DQN (one seed, 5 M steps, best checkpoint) and the tabular agent's 20. Caveats that matter: PPO had twice the environment steps; the two used different recipes tuned by hand to a different degree; and the DQN figure is a best-over-checkpoints value from a single seed, which flatters it. The gap to DQN is small and is not a clean win for the algorithm.
3. **Throughput, not sample efficiency, is where PPO wins on this machine.** A PPO run of 10 M steps took about an hour on the shared GPU (about 2.6 k environment steps/s with other jobs running, about 7 k/s alone); the 5 M-step DQN run took 98 minutes (about 0.9 k/s). DQN needs fewer samples for a given score; PPO collects them far faster here because the batched environment makes data nearly free (§7).
4. **The remaining deaths are slow traps.** For the masked arm, 404 of 500 games end in self-collision. The mask removes instant deaths and wall hits (20 of 500), but a long snake still coils itself into a dead end. The next tryout (05) asks what it takes to avoid that.
5. **What is not claimed.** One hyperparameter set, no tuning of $\lambda$, learning rate or the entropy coefficient, a fixed horizon of 64 steps, and a policy evaluated greedily (always the most likely move). A greedy evaluation of an entropy-regularised policy can loop where a sampled one would not, which probably lowers the unmasked arm's numbers.

# 10. Failure modes to watch for

* **Entropy collapse:** the policy becomes deterministic too early and stops exploring (entropy → 0, return flat).
* **Value-loss domination:** a large critic loss with a shared trunk can swamp the policy gradient; watch the value loss and clip fraction.
* **Too many epochs or too high a learning rate:** approximate KL jumps and the clip fraction climbs; performance can collapse.
* **Mask mismatch between rollout and update** silently breaks the importance ratio.
* **Treating a timeout as a terminal**, which teaches the critic that waiting is "free of future".

# Self-check

```quiz
Q: Why is subtracting a state-dependent baseline $b(s)$ from the return safe for the policy gradient?
- [ ] Because $b$ is small
- [x] $\mathbb{E}_{a\sim\pi}[\nabla_\theta\log\pi(a|s)] = \nabla_\theta\sum_a\pi(a|s) = \nabla_\theta 1 = 0$, so any $b(s)$ adds zero in expectation
- [ ] Because the baseline is learned
Why: The baseline only changes the variance of the estimate, never its mean, as long as it does not depend on the action.
```

```quiz
Q: In PPO's clipped objective with $\hat A_t > 0$ and $r_t > 1 + \epsilon$, what is the gradient with respect to the policy?
- [ ] positive, so the action keeps becoming more likely
- [x] zero, the clipped term is the minimum and it does not depend on $\theta$
- [ ] negative
Why: $\min(r\hat A, (1+\epsilon)\hat A) = (1+\epsilon)\hat A$ when $r>1+\epsilon$, a constant. The step has already used up its allowance for this sample.
```

      if (eating) {

        if (this.body.length === this.w * this.h) {

          return { reward: 1, terminated: true, truncated: false, event: 'win' };

        this.placeFood();
        return { reward: 1, terminated: false, truncated: false, event: 'food' };

      // Truncation, not termination: the state isn't terminal, we just stop a looping agent.
      // Learners must still bootstrap through it (Pardo et al. 2018).
      if (this.sinceFood > this.idleLimit * this.body.length) {
        this.done = true; this.cause = 'timeout';
        return { reward: 0, terminated: false, truncated: true, event: 'timeout' };
      }
      return { reward: 0, terminated: false, truncated: false, event: null };
    }

    // Human input is absolute (arrow keys); agents act relative. Reversal maps to straight.
    relativeFromAbsolute(absDir) {
      const d = (absDir - this.dir + 4) % 4;
      return d === 1 ? ACTIONS.RIGHT : d === 3 ? ACTIONS.LEFT : ACTIONS.STRAIGHT;

  // ---- features (mirror: python/snake_rl/features.py) ----

  // 11 binary features: danger [straight, right, left], heading one-hot [R, D, L, U], food [left, right, up, down].
  function basicFeatures(g) {
    const [hx, hy] = g.body[0];
    const f = new Array(11).fill(0);
    const rel = [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4];
    for (let i = 0; i < 3; i++) { const [dx, dy] = DIRS[rel[i]]; f[i] = g.blocked(hx + dx, hy + dy) ? 1 : 0; }
    f[3 + g.dir] = 1;
    if (g.food) {
      f[7] = g.food[0] < hx ? 1 : 0; f[8] = g.food[0] > hx ? 1 : 0;
      f[9] = g.food[1] < hy ? 1 : 0; f[10] = g.food[1] > hy ? 1 : 0;
    }

  }

  function basicStateIndex(g) {
    const f = basicFeatures(g);
    let s = 0;
    for (let i = 0; i < 11; i++) s |= f[i] << i;
    return s;
  }

  // Free area reachable from (sx,sy), tail counted as free. Approximate (the body moves while you
  // travel) but it is exactly the signal the 11 features lack: "will this move trap me?".
  function reachable(g, sx, sy) {
    if (g.blocked(sx, sy)) return 0;
    const seen = new Uint8Array(g.w * g.h);
    const stack = [[sx, sy]]; seen[sy * g.w + sx] = 1; let n = 0;
    while (stack.length) {
      const [x, y] = stack.pop(); n++;
      for (const [dx, dy] of DIRS) {
        const ax = x + dx, ay = y + dy;
        if (ax < 0 || ay < 0 || ax >= g.w || ay >= g.h) continue;
        const k = ay * g.w + ax;
        if (seen[k] || g.blocked(ax, ay)) continue;
        seen[k] = 1; stack.push([ax, ay]);
      }

    return n;
  }

  // 15 features: basic 11 + reachable-area fraction for [straight, right, left] + length fraction.
  function extendedFeatures(g) {
    const f = basicFeatures(g);
    const [hx, hy] = g.body[0];
    const area = g.w * g.h;
    for (const d of [g.dir, (g.dir + 1) % 4, (g.dir + 3) % 4]) {
      const [dx, dy] = DIRS[d];
      f.push(reachable(g, hx + dx, hy + dy) / area);
    }
    f.push(g.body.length / area);
    return f;
  }

  // Grid observation for the CNN agents, shape (4, h+2, w+2), flattened channel-major like PyTorch.
  // ch0 body recency (head 1 → tail 1/L, so heading is visible), ch1 head, ch2 food, ch3 wall ring.
  // Mirror: python/snake_rl/features.py::grid_obs and vec_env.py::_obs.
  function gridObservation(g) {
    const W = g.w + 2, H = g.h + 2, plane = W * H;
    const x = new Float32Array(4 * plane);
    const L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * W + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * W + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * W + g.food[0] + 1] = 1;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)

    return { data: x, shape: [4, H, W] };

  // Tryout 05 observation: a fixed 14x14 canvas (board at offset 1, everything outside is wall) so one network plays every
  // board up to 12x12. Channels: 0 tail order (age/length), 1 head, 2 food, 3 wall, 4 length/cells, 5 (win6) reachable area.
  // Mirrors python/snake_rl/features.py::win_obs and TorchSnakeVecEnv._win.
  function gridObservationWin(g, reach) {
    const C = 14, S = g.w, plane = C * C, nch = reach ? 6 : 5, x = new Float32Array(nch * plane), L = g.body.length;
    g.body.forEach(([bx, by], i) => { x[(by + 1) * C + bx + 1] = (L - i) / L; });
    x[plane + (g.body[0][1] + 1) * C + g.body[0][0] + 1] = 1;
    if (g.food) x[2 * plane + (g.food[1] + 1) * C + g.food[0] + 1] = 1;
    for (let r = 0; r < C; r++) for (let c = 0; c < C; c++) x[3 * plane + r * C + c] = (r >= 1 && r <= S && c >= 1 && c <= S) ? 0 : 1;
    for (let r = 1; r <= S; r++) for (let c = 1; c <= S; c++) x[4 * plane + r * C + c] = L / (S * S);
    if (reach) {
      const seen = new Uint8Array(S * S), stack = [[g.body[0][0], g.body[0][1]]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        for (const [dx, dy] of DIRS) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && ny >= 0 && nx < S && ny < S && !g.occ[ny * S + nx] && !seen[ny * S + nx]) { seen[ny * S + nx] = 1; stack.push([nx, ny]); }
        }

      for (let i = 0; i < S * S; i++) if (seen[i]) x[5 * plane + (Math.floor(i / S) + 1) * C + (i % S) + 1] = 1;

  // "Trap" mask (tryout 05): [straight, right, left] -> true if the move kills at once OR leads into a region too small for the snake.
  // Time-aware flood fill: a body cell can be entered at move m once its age <= m (the tail keeps freeing cells); K = cells/2 + 2
  // expansions; trap when the reachable area < length (+1 if the move eats). If every move is a trap only instant deaths are
  // blocked. Mirrors python/snake_rl/features.py::trap_danger and TorchSnakeVecEnv.danger_trap.
  function trapDanger(g) {

    g.body.forEach(([bx, by], i) => age.set(key(bx, by), L - i));

  const HAM = {};

  function modelInput(m, g) {
    if (m.obs === 'grid4') return gridObservation(g);
    if (m.obs === 'win5') return gridObservationWin(g, false);
    if (m.obs === 'win6') return gridObservationWin(g, true);
    const f = m.features === 'extended' ? extendedFeatures(g) : basicFeatures(g);
    return { data: Float32Array.from(f), shape: [f.length] };
  }

  // ---- policies ----

  function argmax(a) { let b = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[b]) b = i; return b; }

  const policies = {
    random: (g, rng) => rng.int(3),
    // Greedy-toward-food that avoids immediate death: the bar any learned agent has to clear.
    greedy: (g) => {
      const [hx, hy] = g.body[0];
      let best = 0, bestD = Infinity;
      for (const a of [0, 1, 2]) {
        const d = a === 0 ? g.dir : a === 1 ? (g.dir + 1) % 4 : (g.dir + 3) % 4;
        const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
        if (g.blocked(nx, ny)) continue;
        const dist = g.food ? Math.abs(nx - g.food[0]) + Math.abs(ny - g.food[1]) : 0;
        if (dist < bestD) { bestD = dist; best = a; }
      }
      return best;
    },
  };

  function mlpForward(layers, x) {
    let h = x;
    for (let l = 0; l < layers.length; l++) {
      const { w, b } = layers[l];
      const out = new Array(b.length);
      for (let i = 0; i < b.length; i++) {
        let s = b[i]; const row = w[i];
        for (let j = 0; j < h.length; j++) s += row[j] * h[j];
        out[i] = l < layers.length - 1 && s < 0 ? 0 : s; // ReLU on hidden layers only
      }
      h = out;
    }
    return h;
  }

  function policyFromModel(m) {
    // q may be a dense array or a sparse {stateIndex: [..]} map; unseen states default to 0s.
    if (m.type === 'hamiltonian') return (g) => hamiltonianAction(g);
    if (m.type === 'tabular') return (g) => argmax(m.q[basicStateIndex(g)] || [0, 0, 0]);
    if (m.type === 'mlp') {
      const feat = m.features === 'extended' ? extendedFeatures : basicFeatures;
      return (g) => argmax(mlpForward(m.layers, feat(g)));
    }
    if (m.type === 'net') {
      if (!m.mask) return (g) => argmax(Array.from(runLayers(m.layers, modelInput(m, g)).data));
      // action masking (tryout 03): never pick a move that kills on the next tick, unless every move does.
      // basicFeatures()[0..2] are the danger bits for [straight, right, left], the same action order as the net's outputs.
      return (g) => {
        const q = Array.from(runLayers(m.layers, modelInput(m, g)).data), d = m.mask === 'trap' ? trapDanger(g) : basicFeatures(g);
        let ok = [!d[0], !d[1], !d[2]];
        if (!ok.some(Boolean)) ok = [true, true, true];
        let best = -1;
        for (let i = 0; i < 3; i++) if (ok[i] && (best < 0 || q[i] > q[best])) best = i;

    }

  }

  function modelScores(m, g) {
    if (m.type === 'hamiltonian') return [0, 0, 0];
    if (m.type === 'tabular') return m.q[basicStateIndex(g)] || [0, 0, 0];
    if (m.type === 'mlp') return mlpForward(m.layers, (m.features === 'extended' ? extendedFeatures : basicFeatures)(g));
    return Array.from(runLayers(m.layers, modelInput(m, g)).data);

  // ---- tabular Q-learning (mirror: python/train_tabular.py) ----

  function trainTabularQ(opts = {}) {
    const o = Object.assign({
      width: 12, height: 12, episodes: 20000, alpha: 0.1, gamma: 0.95,
      epsStart: 1.0, epsEnd: 0.01, epsDecayFrac: 0.5, seed: 1, logEvery: 250,

          timeout: buf.filter(b => b[1] === 'timeout').length / buf.length,

      }
    }

  }

  // Greedy evaluation on held-out seeds. Optionally records one replay every k episodes.
  function evaluate(policy, { width = 12, height = 12, seeds = [], recordEvery = 0, rngSeed = 7 } = {}) {
    const rng = new Rng(rngSeed);

    seeds.forEach((seed, i) => {
      const g = new SnakeGame({ width, height, seed });
      const actions = [];
      while (!g.done) { const a = policy(g, rng); actions.push(a); g.step(a); }
      res.scores.push(g.score); res.lengths.push(g.steps);

    const yl = s('text', { x: 12, y: m.t + Hh / 2, transform: `rotate(-90 12 ${m.t + Hh / 2})`, 'text-anchor': 'middle' }); yl.textContent = ylabel; svg.append(yl);
    hlines.forEach(l => {
      svg.append(s('line', { x1: m.l, x2: m.l + W, y1: Y(l.y), y2: Y(l.y), stroke: l.color || '#999', 'stroke-dasharray': '4 4' }));
      const t = s('text', { x: m.l + 6, y: Y(l.y) - 5 }); t.textContent = l.name; svg.append(t);
    });
    series.forEach((d, k) => {
      const pts = d.x.map((x, i) => d.y[i] == null ? null : [X(x), Y(d.y[i])]).filter(Boolean);
      svg.append(s('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: d.color, 'stroke-width': 2, 'stroke-dasharray': d.dash || '' }));
      d.x.forEach((x, i) => {
        if (d.y[i] == null) return;
        const dense = d.x.length > 60;
        if (dense && i % 5) return;  // keep long curves readable; every 5th point stays hoverable
        const c = s('circle', { cx: X(x), cy: Y(d.y[i]), r: dense ? 2.5 : 4, fill: d.color });
        c.onmousemove = ev => showTip(`${d.name}\n${xlabel} ${x}: ${d.y[i]}${d.extra ? '\n' + d.extra(i) : ''}`, ev);
        c.onmouseleave = hideTip;
        svg.append(c);
      });
      const t = s('text', { x: m.l + W + 6, y: m.t + 14 + k * 16, fill: d.color }); t.textContent = '— ' + d.name; t.setAttribute('style', `fill:${d.color}`); svg.append(t);
    });
    host.append(svg);
    return svg;
  }
  // Draw a Snake board; overlay(x, y) may return a CSS colour per cell (heatmaps).
  function board(canvas, g, { cell = 22, overlay = null, label = null } = {}) {
    canvas.width = g.w * cell; canvas.height = g.h * cell;
    const c = canvas.getContext('2d');
    c.fillStyle = '#9bbc0f'; c.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const col = overlay && overlay(x, y);
      if (col) { c.fillStyle = col; c.fillRect(x * cell, y * cell, cell, cell); }
      else if ((x + y) % 2) { c.fillStyle = '#93b40f'; c.fillRect(x * cell, y * cell, cell, cell); }
      if (label) { const t = label(x, y); if (t) { c.fillStyle = '#0f380f'; c.font = '9px monospace'; c.fillText(t, x * cell + 2, y * cell + cell - 4); } }
    }
    if (g.food) { c.fillStyle = '#0f380f'; const p = cell * 0.28; c.fillRect(g.food[0] * cell + p, g.food[1] * cell + p, cell - 2 * p, cell - 2 * p); }
    g.body.forEach(([x, y], i) => { c.fillStyle = i ? '#306230' : '#0f380f'; c.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2); });
  }
  const heat = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1))); return `rgba(${Math.round(220 - 190 * t)},${Math.round(70 + 120 * t)},${Math.round(60 + 30 * t)},0.85)`; };
  return { el, slider, lineChart, board, heat, showTip, hideTip, s };
})();
const WIDGETS = {};
</script>
<script>
// Interactive figures for tryout 04. R = results.json written by python/make_notes_data.py:
//   R.name/config/epochs/checkpoints/best : the best PPO run (same shape as tryout 02's results.json plus entropy/kl/clipfrac)
//   R.arms     : [{id, label, runs: [{seed, run, best: {epoch, val_mean, test}, curve: [[epoch, testMean], ...]}]}]
//   R.parallel : {ppo: {rows: [...]}, dqn: {rows: [...]}}  from python/bench_parallel.py
const C4 = ['#306230', '#c27c0e', '#3a6ea5', '#9b3d8f', '#b3261e', '#5b6b2f'];
const need4 = (host, H, cond, msg) => { if (!cond) host.append(H.el('div', { class: 'mono' }, msg)); return !cond; };
const mean4 = a => a.reduce((s, x) => s + x, 0) / a.length;
const sd4 = a => { const m = mean4(a); return a.length < 2 ? 0 : Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };  // sample sd (n-1)

WIDGETS.summary = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Best PPO run'));
  if (need4(host, H, R.config, 'No results yet: run  python python/jobq.py  then  python python/make_notes_data.py')) return;
  const c = R.config, b = R.best, last = R.checkpoints[R.checkpoints.length - 1];
  const rows = [
    ['model', `${R.name}: ${c.params.toLocaleString()} params (shared CNN trunk, policy and value heads)`],
    ['device', c.device],
    ['setup', `${c.envs} envs × ${c.horizon} steps = ${c.batch.toLocaleString()} per update, ${c.update_epochs} epochs × ${c.minibatches} minibatches, lr ${c.lr}, γ ${c.gamma}, λ ${c.gae_lambda}, clip ${c.clip}, entropy ${c.ent_coef}${c.mask ? ', invalid-action masking' : ''}`],
    ['training', `${(R.epochs.at(-1).env_steps / 1e6).toFixed(1)} M env steps in ${(R.epochs.reduce((s, e) => s + e.seconds, 0) / 60).toFixed(0)} min (${Math.round(R.epochs.reduce((s, e) => s + e.steps_per_s, 0) / R.epochs.length).toLocaleString()} steps/s average)`],
    ['last checkpoint (test, 500 seeds)', last ? `mean ${last.test.mean.toFixed(2)}, median ${last.test.median}, max ${last.test.max}` : '–'],
    ['best by validation', b ? `epoch ${b.epoch}: test mean ${b.test.mean.toFixed(2)}, max ${b.test.max}, deaths ${JSON.stringify(b.test.causes)}` : '–'],
    ['reference (same seeds)', 'tabular ≈ 20, DQN CNN best 24.5'],
  ];
  const t = H.el('table'); rows.forEach(([k, v]) => t.append(H.el('tr', {}, H.el('th', {}, k), H.el('td', {}, v)))); host.append(t);
};

// GAE: advantage = sum_l (γλ)^l δ_{t+l}. Show the weights on the TD residuals and the effective horizon.
WIDGETS.gae_demo = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'GAE: how much each future TD residual δ counts'));
  let lam = 0.95;
  const gamma = 0.99, cv = H.el('canvas', { width: 720, height: 200 }), out = H.el('div', { class: 'mono', style: 'white-space:pre' });
  const draw = () => {
    const L = 40, ctx = cv.getContext('2d'); ctx.clearRect(0, 0, 720, 200);
    const w = Array.from({ length: L }, (_, l) => Math.pow(gamma * lam, l)), bw = 720 / L;
    w.forEach((v, l) => { ctx.fillStyle = '#306230'; ctx.fillRect(l * bw + 2, 180 - v * 160, bw - 4, v * 160); });
    ctx.fillStyle = '#333'; ctx.font = '10px monospace'; ctx.fillText('weight (γλ)^l on δ_{t+l}, l = 0 … 39', 6, 12);
    const hor = 1 / (1 - gamma * lam);
    out.textContent = `γ = ${gamma}, λ = ${lam.toFixed(2)}: weights decay by ${(gamma * lam).toFixed(3)} per step, effective horizon 1/(1-γλ) ≈ ${hor.toFixed(1)} steps.\n` +
      (lam === 0 ? 'λ = 0: one-step TD residual. Lowest variance, biased by the critic\'s errors.' :
        lam === 1 ? 'λ = 1: Monte-Carlo advantage G_t - V(s_t). Unbiased, highest variance.' : 'In between: the usual trade of a little bias for much less variance.');
  };
  host.append(H.slider('λ ', 0, 1, 0.01, lam, v => { lam = v; draw(); }, v => v.toFixed(2)), cv, out);
  draw();
};

// PPO clipped surrogate: L(r) = min(r A, clip(r, 1-ε, 1+ε) A) for A > 0 and A < 0.
WIDGETS.clip_demo = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'PPO clipped objective as a function of the ratio r = π_new / π_old'));
  let eps = 0.2;
  const cv = H.el('canvas', { width: 720, height: 260 }), out = H.el('div', { class: 'mono', style: 'white-space:pre' });
  const draw = () => {
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, 720, 260);
    const x = r => 30 + (r - 0.4) / 1.2 * 660, f = (r, A) => Math.min(r * A, Math.max(1 - eps, Math.min(1 + eps, r)) * A);
    const y = v => 130 - v * 70;
    ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(30, 130); ctx.lineTo(690, 130); ctx.moveTo(x(1), 10); ctx.lineTo(x(1), 250); ctx.stroke();
    [[1, '#306230', 'A > 0 (good action)'], [-1, '#b3261e', 'A < 0 (bad action)']].forEach(([A, col, lab], k) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
      for (let i = 0; i <= 120; i++) { const r = 0.4 + i / 100, px = x(r), py = y(f(r, A)); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke(); ctx.fillStyle = col; ctx.font = '12px monospace'; ctx.fillText(lab, 40, 24 + 16 * k);
    });
    ctx.fillStyle = '#333'; ctx.font = '11px monospace';
    [0.5, 0.8, 1, 1.2, 1.5].forEach(r => ctx.fillText(r.toFixed(1), x(r) - 8, 256));
    ctx.fillText('r →', 672, 124);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = '#c27c0e'; ctx.lineWidth = 1;
    [1 - eps, 1 + eps].forEach(r => { ctx.beginPath(); ctx.moveTo(x(r), 10); ctx.lineTo(x(r), 250); ctx.stroke(); });
    ctx.setLineDash([]);
    out.textContent = `ε = ${eps.toFixed(2)}. A > 0: the objective is flat for r > ${(1 + eps).toFixed(2)} (no gradient: the action is already ${(100 * eps).toFixed(0)}% more likely than before).\n` +
      `A < 0: flat for r < ${(1 - eps).toFixed(2)}. The min keeps the unclipped (worse) branch on the other side, so a step in the wrong direction is still corrected.`;
  };
  host.append(H.slider('ε ', 0.05, 0.5, 0.01, eps, v => { eps = v; draw(); }, v => v.toFixed(2)), cv, out);
  draw();
};

WIDGETS.parallel = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Measured: k identical jobs sharing the GTX 1650 Ti (python/bench_parallel.py)'));
  if (need4(host, H, R.parallel && (R.parallel.ppo || R.parallel.dqn), 'No benchmark yet: run  python python/bench_parallel.py --family ppo')) return;
  const chart = H.el('div');
  [['ppo', 'PPO (256 envs, update-heavy)'], ['dqn', 'DQN (32 envs, 4 updates per step)']].forEach(([fam, title], k) => {
    const P = R.parallel[fam]; if (!P) return;
    const t = H.el('table'); host.append(H.el('p', {}, H.el('b', {}, title)));
    t.append(H.el('tr', {}, ...['jobs', 'steps/s per job', 'aggregate steps/s', 'speed-up vs 1 job', 'GPU util %', 'CPU util %', 'GPU memory in use (MB)'].map(x => H.el('th', {}, x))));
    const base = P.rows[0].aggregate_steps_per_s;
    P.rows.forEach(r => t.append(H.el('tr', {}, H.el('td', {}, String(r.jobs)), H.el('td', {}, r.per_job_steps_per_s.map(v => v.toLocaleString()).join(' / ')),
      H.el('td', {}, r.aggregate_steps_per_s.toLocaleString()), H.el('td', {}, (r.aggregate_steps_per_s / base).toFixed(2) + '×'),
      H.el('td', {}, String(r.gpu_util_pct)), H.el('td', {}, String(r.cpu_util_pct)), H.el('td', {}, String(r.gpu_mem_used_mb)))));
    host.append(t);
  });
  host.append(chart);
  const series = ['ppo', 'dqn'].filter(f => R.parallel[f]).map((f, i) => {
    const rows = R.parallel[f].rows, base = rows[0].aggregate_steps_per_s;
    return { name: f.toUpperCase() + ' aggregate speed-up', x: rows.map(r => r.jobs), y: rows.map(r => +(r.aggregate_steps_per_s / base).toFixed(2)), color: C4[i * 2] };
  });
  H.lineChart(chart, { series, xlabel: 'concurrent jobs', ylabel: 'aggregate throughput vs 1 job', ymin: 0 });
};

WIDGETS.ppo_table = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'PPO arms: 500-game greedy test mean of the best checkpoint, per training seed'));
  if (need4(host, H, R.arms && R.arms.length, 'No arm data yet.')) return;
  const t = H.el('table');
  t.append(H.el('tr', {}, ...['arm', 'seeds', 'test mean per seed', 'mean ± sd', 'max (best seed)', 'deaths wall / self / timeout (mean per 500)'].map(x => H.el('th', {}, x))));
  R.arms.forEach(a => {
    const m = a.runs.map(r => r.best.test.mean), mx = a.runs.map(r => r.best.test.max);
    const cs = ['wall', 'self', 'timeout'].map(k => Math.round(mean4(a.runs.map(r => r.best.test.causes[k] || 0))));
    t.append(H.el('tr', {}, H.el('td', {}, a.label), H.el('td', {}, String(a.runs.length)), H.el('td', {}, m.map(x => x.toFixed(1)).join(', ')),
      H.el('td', {}, `${mean4(m).toFixed(1)} ± ${sd4(m).toFixed(1)}`), H.el('td', {}, String(Math.max(...mx))), H.el('td', {}, cs.join(' / '))));
  });
  host.append(t);
};

WIDGETS.ppo_curves = (host, R, S, H) => {
  host.append(H.el('h4', {}, 'Learning curves: greedy test mean (500 games) at each checkpoint, mean over seeds'));
  if (need4(host, H, R.arms && R.arms.length, 'No arm data yet.')) return;
  const chart = H.el('div'); host.append(chart);
  const series = R.arms.map((a, i) => {
    const eps = a.runs[0].curve.map(c => c[0]);
    return { name: a.label, x: eps.map(e => e * 0.5), y: eps.map((e, k) => +mean4(a.runs.filter(r => r.curve[k]).map(r => r.curve[k][1])).toFixed(2)), color: C4[i % C4.length] };
  });
  H.lineChart(chart, { series, xlabel: 'env steps (millions)', ylabel: 'test mean score', hlines: [{ y: 20, name: 'tabular ≈ 20', color: '#b3261e' }] });
  if (R.epochs && R.epochs.length) {
    const c2 = H.el('div'); host.append(H.el('h4', {}, `Training diagnostics of ${R.name}`), c2);
    const ep = R.epochs.map(e => e.epoch * 0.5);
    H.lineChart(c2, { series: [
      { name: 'policy entropy', x: ep, y: R.epochs.map(e => +e.entropy.toFixed(3)), color: C4[2] },
      { name: 'clip fraction ×10', x: ep, y: R.epochs.map(e => +(10 * e.clipfrac).toFixed(3)), color: C4[1] },
      { name: 'approx KL ×100', x: ep, y: R.epochs.map(e => +(100 * e.approx_kl).toFixed(3)), color: C4[3] },
    ], xlabel: 'env steps (millions)', ylabel: 'value', h: 220 });
  }
};

</script>
<script>
// ---------- render markdown + math + widgets + quizzes ----------
(() => {
  const doc = document.getElementById('doc');
  const fm = MD.match(/^---\n([\s\S]*?)\n---\n/);
  const meta = {};
  if (fm) fm[1].split('\n').forEach(l => { const m = l.match(/^(\w+):\s*"?(.*?)"?$/); if (m) meta[m[1]] = m[2]; });
  let md = fm ? MD.slice(fm[0].length) : MD;
  const blocks = [];
  md = md.replace(/```(widget|quiz)\n([\s\S]*?)```/g, (_, kind, body) => { blocks.push({ kind, body: body.trim() }); return `\n<div class="blk" data-i="${blocks.length - 1}"></div>\n`; });
  const maths = [];
  const keep = (m, d) => { maths.push({ m, d }); return `@@M${maths.length - 1}@@`; };
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true)).replace(/\$([^$\n]+?)\$/g, (_, m) => keep(m, false));
  const tex = (m, d) => window.katex ? katex.renderToString(m, { displayMode: d, throwOnError: false }) : `<code>${m}</code>`;
  const inlineMath = t => t.replace(/\$([^$\n]+?)\$/g, (_, m) => tex(m, false));
  let html = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, '&lt;')}</pre><p class="err">marked.js did not load (offline?)</p>`;
  html = html.replace(/@@M(\d+)@@/g, (_, i) => tex(maths[i].m, maths[i].d));
  doc.innerHTML = `<header><h1 class="doc">${meta.title || ''}</h1><div class="subtitle">${meta.subtitle || ''}</div></header>` + html;

  doc.querySelectorAll('.blk').forEach(div => {
    const b = blocks[+div.dataset.i];
    if (b.kind === 'widget') {
      const box = H.el('div', { class: 'widget' });
      div.replaceWith(box);
      try { (WIDGETS[b.body] || (() => { throw new Error('no widget ' + b.body); }))(box, RESULTS, window.SnakeCore, H); }
      catch (e) { box.append(H.el('div', { class: 'err' }, String(e.stack || e))); }
    } else {
      const q = { opts: [] };
      b.body.split('\n').forEach(l => {
        if (l.startsWith('Q:')) q.q = l.slice(2).trim();
        else if (/^- \[( |x)\]/.test(l)) q.opts.push({ t: l.slice(6).trim(), ok: l[3] === 'x' });
        else if (l.startsWith('Why:')) q.why = l.slice(4).trim();
      });
      const box = H.el('div', { class: 'quiz' }, H.el('h4', {}, 'Self-check'));
      const p = H.el('p', {}); p.innerHTML = inlineMath(q.q); box.append(p);
      q.opts.forEach(o => {
        const btn = H.el('button', {}); btn.innerHTML = inlineMath(o.t);
        btn.onclick = () => { btn.classList.add(o.ok ? 'right' : 'wrong'); if (o.ok) box.classList.add('done'); };
        box.append(btn);
      });
      const why = H.el('div', { class: 'why' }); why.innerHTML = '<b>Why:</b> ' + inlineMath(q.why || ''); box.append(why);
      div.replaceWith(box);
    }
  });

  const toc = document.getElementById('toc');
  toc.append(H.el('div', { class: 'title' }, meta.title || 'Contents'));
  const hs = [...doc.querySelectorAll('main h1:not(.doc)')];
  hs.forEach((h, i) => { h.id = 's' + i; const a = H.el('a', { href: '#s' + i }, h.textContent); toc.append(a); });
  const links = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    let k = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) k = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === k));
  });
})();
</script>
